*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Cairo,system-ui,sans-serif;background:radial-gradient(120% 80% at 50% 0%,#1c3fa0,#14307F 55%,#0b1d52);color:#fff;display:flex;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom))}

p{margin:0 0 22px;color:#c9d4f5;font-size:14px}
input{width:100%;padding:14px 16px;border-radius:16px;border:1.5px solid #E5AE1A88;background:#ffffff14;color:#fff;font:inherit;font-size:17px;text-align:center;outline:none}

button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:16px;font:inherit;font-weight:800;font-size:16px;color:#14307F;background:linear-gradient(#f6cf5b,#E5AE1A);box-shadow:0 6px 18px #0005;cursor:pointer}
button:disabled{opacity:.6}
label{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:14px;font-size:13px;color:#c9d4f5}
#m{min-height:22px;margin-top:12px;color:#ffb4b4;font-size:13.5px}
.sh{animation:sh .4s}@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

async function open(pw){
  const e=new TextEncoder(),km=await crypto.subtle.importKey('raw',e.encode(pw),'PBKDF2',false,['deriveKey']);

async function go(pw,rem){

    const html=await open(pw);
