>أسأل أستاذًا عن الجواب<\/button>\n    <div style=\"text-align:center;margin-top:16px\"><button class=\"btn\">تابع الإشارة<\/button><\/div>\n  <\/div>\n<\/section>\n\n<div class=\"lab\">SCREEN 03 / PUZZLE — لغز<\/div>\n<section class=\"screen\" id=\"s3\">\n  <div class=\"puz-head\"><span class=\"badge\">لغز · شفرة · مستوى ٢<\/span><span class=\"timer\">02:41<\/span><\/div>\n  <div class=\"panel case\"><span class=\"tag fact\">ملف القضية ٠١٧<\/span><h3>الرسالة التي وصلت ناقصة<\/h3><p>اعترض المحقق رسالة مشفّرة بإزاحة ثابتة. ثلاثة أحرف فُكّت، والباقي ينتظرك.<\/p><\/div>\n  <div class=\"cipher\">\n    <div class=\"cell k\">ك<\/div><div class=\"cell k\">ت<\/div><div class=\"cell q\">؟<\/div><div class=\"cell k\">ب<\/div><div class=\"cell q\">؟<\/div><div class=\"cell q\">؟<\/div>\n  <\/div>\n  <div class=\"clues\">\n    <div class=\"clue\"><em>دليل ١<\/em><span>الإزاحة ثابتة لكل الحروف.<\/span><\/div>\n    <div class=\"clue\"><em>دليل ٢<\/em><span>الكلمة شيء يُقرأ ويُكتب.<\/span><\/div>\n  <\/div>\n  <div class=\"answer\"><div>اكتب الكلمة…<\/div><button class=\"btn\">تحقّق<\/button><\/div>\n  <p class=\"hint\">تلميح متاح بعد ٣٠ ثانية · لا عقوبة على الخطأ<\/p>\n  <nav class=\"dock\">\n    <a><svg viewBox=\"0 0 24 24\"><path d=\"M5 5h6v6H5zM13 5h6v6h-6zM5 13h6v6H5zM13 13h6v6h-6z\"/><\/svg>الطاقم<\/a>\n    <a><svg viewBox=\"0 0 24 24\"><path d=\"M7 4h10v5a5 5 0 01-10 0zM12 14v4M8 20h8\"/><\/svg>المسابقات<\/a>\n    <a><svg viewBox=\"0 0 24 24\"><path d=\"M12 3l2.2 5.2L20 10l-5.8 1.8L12 17l-2.2-5.2L4 10l5.8-1.8z\"/><\/svg>الرئيسية<\/a>\n    <a><svg viewBox=\"0 0 24 24\"><path d=\"M4 5h7a3 3 0 013 3v11a2 2 0 00-2-2H4zM20 5h-6\"/><\/svg>القصص<\/a>\n    <a class=\"on\"><svg viewBox=\"0 0 24 24\"><path d=\"M9 4h6l4 4v8l-4 4H9l-4-4V8zM9 12h6\"/><\/svg>الألغاز<\/a>\n  <\/nav>\n<\/section>\n\n<p style=\"text-align:center;font-size:.68rem;color:var(--ink-3);padding:18px 0 28px\">ARAFAT ALRAJHI © 2026<\/p>\n\n<script>\nvar W=[[\"rawi\",\"الراوي\",\"#e6b866\"],[\"raid\",\"الرائد\",\"#f n:12px 0}\n.read .ttl{font:700 1.7rem/1.4 \"Reem Kufi\",\"Tajawal\",system-ui,sans-serif;margin-top:14px}\n.read .ttl em{font-style:normal;color:var(--acc)}\n.tag{display:inline-block;font-size:.68rem;color:var(--acc);border:1px solid var(--acc);padding:2px 10px}\n.rule{height:1px;background:linear-gradient(90deg,var(--acc),transparent);margin:12px 0;opacity:.6}\n<\/style>\n<\/head>\n<body>\n<div class=\"page\">\n<header class=\"top\">\n  <h1>أثر<i> | <\/i>آفاق · مكتبة الانتقالات<\/h1>\n  <p>١٦ حركة: ٨ بين الأمكنة و٨ بين الحالات — كلها CSS/JS خالص، تتبع الإصبع وتتراجع<\/p>\n  <div class=\"opts\">\n    <label><input type=\"checkbox\" id=\"optRM\"> محاكاة «تقليل الحركة»<\/label>\n    <label><input type=\"checkbox\" id=\"optSlow\"> حركة بطيئة ×٤<\/label>\n    <label><input type=\"checkbox\" id=\"optSfx\"> صوت قصير<\/label>\n  <\/div>\n<\/header>\n\n<div class=\"cols\">\n  <!-- ===== الشاشتان الوهميتان: مكان→مكان ===== -->\n  <section class=\"col\">\n    <h2>مكان ← مكان <em id=\"curName\">الشاشة أ · محطة سُهيل<\/em><\/h2>\n    <div class=\"phone aa-stage\" id=\"st1\" aria-label=\"شاشتان وهميتان للانتقالات\">\n      <div class=\"aa-scr on\" id=\"A\" data-name=\"الشاشة أ · محطة سُهيل\">\n        <div class=\"stars\"><\/div>\n        <div class=\"in\">\n          <div class=\"bar\"><b>أثر<i> | <\/i>آفاق<\/b><span class=\"pill\">محطة سُهيل · متصلة<\/span><\/div>\n          <div class=\"window\"><div class=\"earth\"><\/div><h1>الأرض تتوهّج.<br><em>محطة سُهيل<\/em><\/h1><\/div>\n          <h3>ملفات تنتظر الفتح<\/h3>\n          <button class=\"card\" data-open><small>إشارة · تاريخ موثّق<\/small><b>ابن الهيثم وغرفة الظلام<\/b><span>العصر الفاطمي · ١٠ دقائق<\/span><\/button>\n          <button class=\"card\" data-open><small>قضية · خلاف بين المصادر<\/small><b>من أحرق مكتبة الحكم؟<\/b><span>احكم أنت بين روايتين<\/span><\/button>\n          <button class=\"card\" data-open><small>خيال علمي · متخيَّلة<\/small><b>لوحٌ أسخن من الهواء<\/b><span>الأمانة العلمية<\/span><\/button>\n        <\/div>\n      <\/div>\n      <div class=\"aa-scr\" id=\"B\" data-name=\"الشاشة ب · غرفة القراءة\" style=\"--acc:#ffb454;background:#080b14\">\n        <div class=\"stars\"><\/div>\n        <div class=\"in read\">\n          <div class=\"bar\"><b>غرفة<i> | <\/i>القراءة<\/b><span class=\"pill\">الراوي · الفصل ١<\/span><\/div>\n          <span class=\"tag\">تاريخ موثّق<\/span>\n          <div class=\"ttl\">ابن الهيثم<br><em>وغرفة الظلام<\/em><\/div>\n          <div class=\"rule\"><\/div>\n          <p>في غرفةٍ مظلمة لاحظ ابن الهيثم أنّ الضوء يسير في خطوطٍ مستقيمة، فجرّب وكرّر، ولم يكتفِ بما قاله السابقون.<\/p>\n          <p>هنا يبدأ الفصل الأول: ما الذي رآه على الجدار، ولماذا قلبت الصورةُ رأسًا على عقب؟<\/p>\n          <button class=\"backbtn\" data-back>عودة إلى المحطة<\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div class=\"chips\" id=\"chips1\"><\/div>\n    <div class=\"when\" id=\"when1\"><\/div>\n    <div class=\"scrub\"><span>مرّر التقدّم<\/span><input type=\"range\" id=\"scrub\" min=\"0\" max=\"100\" value=\"0\" aria-label=\"تقدّم الانتقال\"><span id=\"scrubv\">٠٪<\/span><\/div>\n    <p class=\"hint\">اسحب على الشاشة نفسها (أفقيًا/عموديًا حسب الانتقال) أو مرّر الشريط: اترك قبل الثلث فيتراجع. كل ذلك له زر بديل.<\/p>\n  <\/section>\n\n  <!-- ===== حالة ← حالة ===== -->\n  <section class=\"col\">\n    <h2>حالة ← حالة <em>وحدة التحدّي<\/em><\/h2>\n    <div class=\"phone aa-stage\" id=\"st2\">\n      <div class=\"aa-scr on\" id=\"S\">\n        <div class=\"stars\"><\/div>\n        <div class=\"in\">\n          <div class=\"bar\"><b>أثر<i> | <\/i>آفاق<\/b><span class=\"pill\">اليوم <span id=\"dayn\">٣<\/span><\/span><\/div>\n          <h3>وحدة التحدّي<\/h3>\n          <div class=\"unit\" id=\"unit\" data-st=\"idle\">\n            <div class=\"u-lock\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"9\"/><path class=\"shackle\" d=\"M8 11V8a4 4 0 018 0v3\"/><\/svg><\/div>\n            <div class=\"u-body\">\n              <small style=\"color:var(--mu);font-size:.68rem\">شفرة المخطوطة ٧<\/small>\n              <div data-r style=\"font:700 1.3rem 'Reem Kufi',system-ui,sans-serif;margin:6px 0\">٣ ٧ _ _ ٤<\/div>\n              <div data-r style=\"font-size:.78rem;color:var(--mu);line-height:1.8\">اللوح الأول يذكر تسع إشارات، والثاني يخفي اثنتين.<\/div>\n              <div data-r style=\"font-size:.78rem;color:var(--mu);line-height:1.8\">تلميح: الأرقام تتصاعد بفارق ثابت.<\/div>\n            <\/div>\n            <div class=\"u-msg\" id=\"umsg\" aria-live=\"polite\">جاهز لاستقبال الإجابة<\/div>\n          <\/div>\n          <h3 style=\"margin-top:18px\">سجلّ الإشارات<\/h3>\n          <div class=\"card\" data-net style=\"cursor:default\"><small>آخر إشارة<\/small><b>شظية ٤ من ١٠٠٠<\/b><span>ملتقطة قبل ساعتين<\/span><\/div>\n          <div class=\"card\" data-net style=\"cursor:default\"><small>أثرك<\/small><b>١٢٨ نقطة<\/b><span>مستوى «رائد»<\/span><\/div>\n        <\/div>\n      <\/div>\n      <div class=\"aa-scr\" id=\"S2\" style=\"--acc:#8a7bff;background:#080a16\">\n        <div class=\"stars\"><\/div>\n        <div class=\"in read\">\n          <div class=\"bar\"><b>إشارة<i> | <\/i>واردة<\/b><span class=\"pill\">من «ناظم»<\/span><\/div>\n          <span class=\"tag\">رسالة<\/span>\n          <div class=\"ttl\">وصلت<br><em>شظية جديدة<\/em><\/div>\n          <div class=\"rule\"><\/div>\n          <p>التقط ناظم نبضةً غريبة قرب الحلقة الثالثة. هل تساعده في فكّ رموزها؟<\/p>\n          <button class=\"backbtn\" data-back2>عودة إلى الوحدة<\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div class=\"chips\" id=\"chips2\"><\/div>\n    <div class=\"when\" id=\"when2\"><\/div>\n    <p class=\"hint\">«يوم جديد» و«نهاية اليوم» لحظتان دراميتان (&gt;٧٠٠ مللي ثانية) ومسموح بهما.<\/p>\n  <\/section>\n<\/div>\n<p class=\"sig\">ARAFAT ALRAJHI © 2026<\/p>\n<\/div>\n\n<script>\n/* ======================= مكتبة الانتقالات: JS ======================= */\n/*<<core*/\nconst AA=(()=>{ ل · متصلة<\/span><\/div>\n  <div id=\"resumeSlot\"><\/div>\n  <h2>ملفات تنتظر الفتح<\/h2>\n  <div id=\"cards\"><\/div>\n  <div class=\"orbit\" id=\"orbit\"><\/div>\n  <p class=\"foot\">ARAFAT ALRAJHI © 2026<\/p>\n<\/main>\n<div class=\"toast\" id=\"toast\"><\/div>\n\n<section id=\"reader\" aria-label=\"قارئ القصة\">\n  <header class=\"rh\" id=\"rh\">\n    <div class=\"grab\"><\/div>\n    <div class=\"rtop\">\n      <button class=\"back\" id=\"back\" aria-label=\"عودة إلى المحطة\"><svg viewBox=\"0 0 24 24\"><path d=\"M6 9l6 6 6-6\"/><\/svg><\/button>\n      <div><small id=\"rtag\"><\/small><h1 id=\"rtitle\"><\/h1><\/div>\n    <\/div>\n    <nav class=\"rail\" id=\"rail\" aria-label=\"مقاطع القصة\">\n      <button data-s=\"read\">قراءة<\/button><button data-s=\"q\">سؤال<\/button><button data-s=\"sum\">خلاصة<\/button><button data-s=\"src\">مصادر<\/button>\n    <\/nav>\n  <\/header>\n  <div class=\"stage\" id=\"stage\"><div class=\"seam\" id=\"seamA\"><\/div><div class=\"seam\" id=\"seamB\"><\/div><\/div>\n  <div class=\"latch\" id=\"latch\"><button id=\"latchBtn\"><span id=\"latchTxt\"><\/span><svg viewBox=\"0 0 24 24\"><path d=\"M12 19V6M6 11l6-6 6 6\"/><\/svg><\/button><small>اسحب للأعلى أو انقر<\/small><\/div>\n<\/section>\n<div class=\"dim\" id=\"dim\"><\/div><div class=\"beam\" id=\"beam\"><\/div>\n\n<script>\n\"use strict\";\nvar RM=window.matchMedia&&matchMedia(\"(prefers-reduced-motion:reduce)\").matches;\nvar $=function(s){return document.querySelector(s)};\nvar S=[\n{id:\"ibn\",tag:\"إشارة · تاريخ موثّق\",title:\"ابن الهيثم وغرفة الظلام\",era:\"القاهرة · القرن الخامس الهجري\",eta:\"٣ دقائق\",tags:[\"بصريات\",\"تجربة\",\"منهج\",\"أمانة علمية\"],\n note:\"وثّقنا: التجربة ونتيجتها في كتاب المناظر. من خيال المحطة: مشهد الغرفة وتفاصيله.\",\n p:[\"جلس ابن الهيثم في غرفة مغلقة، وفي جدارها ثقب لا يزيد على رأس الإبرة.||كان يريد أن يعرف كيف يصل المشهد إلى العين، وهل [[العين تُرسل]] شيئًا أم [[تستقبله]].\",\n    \"وضع ضوءين مختلفين خارج الغرفة،||فظهر على الجدار المقابل ضوءان منفصلان. وحين غطّى أحدهما اختفى [[ضوؤه وحده]]. استنتج أن الضوء يسير في خطوط مستقيمة من الشيء إلى الثقب.\",\n    \"@الضوء يأتي إلينا، ونحن لا نُرسل شيئًا.\",\n    \"لم يكتفِ بالاستنتاج.||كتب كتاب المناظر وأعاد كل تجربة بطرق شتى، وطلب من قارئه ألّا يصدّقه قبل أن [[يجرّب بنفسه]]؛ فالحقيقة تُطلب بالدليل لا بالسلطة.\",\n    \"هكذا صار الثقب الصغير بابًا لعلم كبير.||وبقي منهجه، [[الشك ثم التجربة]]، مدرسةً لمن جاؤوا بعده.\"],\n q:\"ما الذي جعل ابن الهيثم يطمئن إلى أن الضوء يأتي من الأشياء إلى العين؟\",\n o:[[\"لأن العلماء قبله أجمعوا على ذلك\",0,\"قريب. كثيرون قبله قالوا عكس ذلك، ولم يكن الإجماع دليله.\"],[\"لأن تغطية أحد الضوءين أخفت ضوءه وحده على الجدار\",1,\"أحسنت. الدليل جاء من تجربة يمكن تكرارها.\"],[\"لأنه رأى ذلك في حلم\",0,\"قريب. الحلم لا يصلح دليلًا، وهو نفسه كان يرفض ذلك.\"]],\n sum:\"الدليل الذي تكرّره التجربة أقوى من القول الذي تكرّره الألسنة.\",\n src:[\"ابن الهيثم، «كتاب المناظر».\",\"موسوعة ستانفورد للفلسفة، مادة Ibn al-Haytham.\",\"مقتطع تجريبي للنموذج؛ تُراجَع المصادر قبل النشر.\"]},\n{id:\"bir\",tag:\"إشارة · تاريخ موثّق\",title:\"البيروني يقيس الأرض من فوق جبل\",era:\"شمال الهند · القرن الخامس الهجري\",eta:\"٣ دقائق\",tags:[\"قياس\",\"فلك\",\"منهج\",\"أمانة علمية\"],\n note:\"وثّقنا: طريقته وعمله في القانون المسعودي. من خيال المحطة: صياغة المشهد.\",\n p:[\"وقف البيروني على قمة جبل عالٍ، ومعه آلة بسيطة لقياس الزوايا.||أراد أن يقيس الأرض كلها [[دون أن يغادر مكانه]].\",\n    \"الفكرة أن الأفق ينخفض قليلًا كلما ارتفعتَ.||فقاس زاوية انخفاضه من القمة، وقاس ارتفاع الجبل، ثم استعمل [[المثلثات]] ليستخرج نصف قطر الأرض.\",\n    \"@قياس واحد من قمة، وأرض كاملة في المعادلة.\",\n    \"جاءت نتيجته قريبة جدًا مما تقيسه الأجهزة اليوم،||وهذا يدهش حين نتذكر أنه لم يملك [[ساعة دقيقة]] ولا قمرًا صناعيًا.\",\n    \"ولم يُخفِ البيروني حدود طريقته.||كان يدوّن مواضع الشك ويعيد القياس؛ فالأمانة عنده أن تُري القارئ [[كيف وصلت]] وأين قد تخطئ.\"],\n q:\"ما الذي قاسه البيروني مباشرة ليصل إلى حجم الأرض؟\",\n o:[[\"طول ظله عند الظهيرة\",0,\"قريب. هذه طريقة عالم آخر سبقه بقرون.\"],[\"زاوية انخفاض الأفق وارتفاع الجبل\",1,\"أحسنت. قياسان صغيران ثم رياضيات.\"],[\"المسافة بين مدينتين بعيدتين\",0,\"قريب. لكنه لم يعتمد عليها هنا.\"]],\n sum:\"الأرقام الكبيرة قد تبدأ من قياس صغير صادق.\",\n src:[\"البيروني، «القانون المسعودي».\",\"البيروني، «تحديد نهايات الأماكن لتصحيح مسافات المساكن».\",\"مقتطع تجريبي للنموذج؛ تُراجَع المصادر قبل النشر.\"]},\n{id:\"sem\",tag:\"إشارة · تاريخ موثّق\",title:\"اليدان اللتان أنقذتا الأمهات\",era:\"فيينا · ١٨٤٧\",eta:\"٣ دقائق\",tags:[\"تجربة\",\"أمانة علمية\",\"طب\"],\n note:\"وثّقنا: ملاحظات سملويس ونتائج غسل اليدين. من خيال المحطة: صياغة المشاهد.\",\n p:[\"في مستشفى فيينا جناحان للولادة، ولاحظ الطبيب إغناز سملويس أمرًا مقلقًا.||كانت الوفاة بين الأمهات في أحد الجناحين [[أعلى بكثير]] من الآخر.\",\n    \"جرّب تفسيرًا بعد تفسير، وتخلّص منها واحدًا تلو الآخر.||ثم مات زميل له بعد جرح أثناء تشريح، وظهرت عليه أعراض تشبه ما يصيب الأمهات.\",\n    \"@ربما تحمل اليدان شيئًا لا تراه العين.\",\n    \"فأمر الأطباء بغسل أيديهم بمحلول الكلور قبل الفحص.||وانخفضت الوفيات في جناحه [[انخفاضًا ملحوظًا]].\",\n    \"ورفض كثيرون فكرته لأنهم لم يعرفوا سببها،||فلم تكن الجراثيم معروفة يومئذ. لكنه دوّن [[أرقامه كما هي]] وترك للزمن أن يحكم.\"],\n q:\"ما الذي جعل فكرة سملويس مقنعة رغم غياب التفسير؟\",\n o:[[\"شهرته بين أطباء المدينة\",0,\"قريب. وفي الحقيقة رفضها كثيرون منهم.\"],[\"الأرقام قبل الغسل وبعده\",1,\"أحسنت. الملاحظة الصادقة تسبق التفسير أحيانًا.\"],[\"أنه شرح الجراثيم بدقة\",0,\"قريب. لم تكن معروفة في زمنه.\"]],\n sum:\"قد تسبق الملاحظة الصادقة التفسير؛ وللأرقام شهادتها.\",\n src:[\"Semmelweis, «Die Ätiologie, der Begriff und die Prophylaxis des Kindbettfiebers» (1861).\",\"K. Codell Carter, «Childbed Fever: A Scientific Biography of Ignaz Semmelweis».\",\"مقتطع تجريبي للنموذج؛ تُراجَع المصادر قبل النشر.\"]}\n];\nvar byId={};S.forEach(function(s){byId[s.id]=s});\nvar st={cur:null,sec:\"read\",done:{},parked:{},para:{},last:null};\nfunction ld(){try{var j=JSON.parse(localStorage.getItem(\"v4\")||\"null\");if(j){st.done=j.done||{};st.parke position:absolute;left:50%;top:50%;padding:8px 14px;border:1px solid var(--acc);color:var(--acc);background:rgba(5,8,18,.9);border-radius:999px;font-size:.78rem;white-space:nowrap}\n/* rooms */\n.door{position:absolute;left:0;right:0;height:25.4%;background:repeating-linear-gradient(90deg,rgba(143,180,255,.07) 0 2px,transparent 2px 38px),linear-gradient(#0e1a38,#070d20);border-block:1px solid var(--acc);display:flex;align-items:center;padding:0 18px;gap:8px;font-size:.66rem;color:var(--mu)}\n.door i{width:10px;height:10px;border-radius:2px;background:rgba(255,255,255,.15);margin-inline-start:auto;transition:.2s}\n.door i.on{background:var(--acc);box-shadow:0 0 12px var(--acc)}\n/* lift */\n.lines{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 37px,rgba(143,180,255,.35) 37px 38px);opacity:0;-webkit-mask:linear-gradient(transparent,#000 40%,#000 60%,transparent);mask:linear-gradient(transparent,#000 40%,#000 60%,transparent)}\n.ld{position:absolute;top:0;bottom:0;width:50.5%;background:linear-gradient(90deg,#101a33,#0a1226);z-index:2}\n.ld.a{right:0;border-left:2px solid var(--acc)}.ld.b{left:0;border-right:2px solid var(--acc)}\n.flr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;text-align:center;font-family:\"Reem Kufi\",sans-serif;color:var(--acc);opacity:0}\n.flr b{display:block;font-size:2.6rem;font-weight:700;text-shadow:0 0 18px var(--acc);font-variant-numeric:tabular-nums;direction:ltr}\n.flr small{font-size:.74rem;color:var(--mu)}\n.arrows{position:absolute;left:50%;top:50%;margin:-98px 0 0 -14px;width:28px;z-index:3;opacity:0}\n.arrows i{display:block;width:16px;height:16px;margin:0 auto 4px;border-right:3px solid var(--acc);border-bottom:3px solid var(--acc);transform:rotate(45deg);opacity:.9}\n@media (prefers-reduced-motion:reduce){.lens .g:after{animation:none}#maze .c,#me,#fog{transition:none}}\n<\/style>\n<\/head>\n<body>\n<div id=\"app\" data-who=\"base\">\n  <div class=\"stars\"><\/div>\n  <div id=\"screen\">\n    <header>\n      <b>محطة <i>سُهيل<\/i><\/b>\n      <span class=\"chip who\" id=\"whoChip\">أنت<\/span>\n      <span class=\"chip\" id=\"depth\">المستوى 1 · 0م<\/span>\n      <span class=\"chip\" id=\"kept\"><\/span>\n    <\/header>\n    <div id=\"hud\"><span id=\"hudTxt\">وضع الاستكشاف<\/span><div class=\"bar\"><i id=\"fuel\"><\/i><\/div><\/div>\n    <div id=\"mazeWrap\"><div id=\"maze\"><\/div><div id=\"me\"><\/div><div id=\"fog\"><\/div><\/div>\n    <div id=\"msg\" aria-live=\"polite\"><\/div>\n    <div id=\"lab\">\n      <h3>كيف جئت؟ (يغيّر نبرة الانتقال)<\/h3>\n      <div class=\"row\" id=\"modes\">\n        <button data-m=\"free\" aria-pressed=\"true\">بإرادتي<\/button>\n        <button data-m=\"challenge\" aria-pressed=\"false\">بعد تحدٍّ<\/button>\n        <button data-m=\"fail\" aria-pressed=\"false\">بعد إخفاق<\/button>\n      <\/div>\n      <h3>تقمّص<\/h3>\n      <div class=\"row\" id=\"chars\">\n        <button data-c=\"raid\">الرائد<\/button>\n        <button data-c=\"muh\">المحقق<\/button>\n        <button data-c=\"tabib\">الطبيب<\/button>\n        <button data-c=\"exit\">خروج<\/button>\n      <\/div>\n      <h3>المتاهة التالية<\/h3>\n      <div class=\"row\" id=\"mz\">\n        <button data-t=\"rooms\">غرف محكمة<\/button>\n        <button data-t=\"lift\">مصعد للأسفل<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div id=\"sheet\" role=\"dialog\" aria-label=\"عتبة التقمّص\">\n    <p><b id=\"shTitle\"><\/b><span id=\"shLine\"><\/span><\/p>\n    <button id=\"hold\" aria-label=\"ثبّت إصبعك لتتقمّص\"><i><\/i><span>ثبّت إصبعك ثانية ونصفًا<\/span><\/button>\n    <div class=\"alt\"><button id=\"tapGo\">أو: نقرة واحدة للتأكيد<\/button><button id=\"later\">ليس الآن<\/button><\/div>\n  <\/div>\n  <div id=\"fx\" aria-hidden=\"true\"><\/div>\n<\/div>\n\n<script>\n(()=>{\nconst $=s=>document.querySelector(s), app=$('#app'), fx=$('#fx');\nconst params=new URLSearchParams(location.search);\nconst RM=matchMedia('(prefers-reduced-motion: ة، الباب ما زال في الجهة الأخرى', safe?'أضأنا جزءًا من الممر ليساعدك.':'');\n  cap.style.opacity=0;\n  await Promise.all(ds.map((d,i)=>anim(d,[{transform:'none'},{transform:`translateX(${i%2?'':'-'}101%)`}],{duration:520*k,delay:i*90*k,easing:'cubic-bezier(.7,0,.3,1)'})));\n}\nfunction markPath(){ // يُضيء نصف الطريق فقط (تلميح لا حلّ كامل)\n  const g=MAZES[S.maze]; const q=[[...S.pos,[]]],seen=new Set([S.pos+'']);\n  while(q.length){const [r,c,p]=q.shift(); if(g[r][c]==='E'){p.slice(0,Math.ceil(p.length/2)).forEach(([a,b])=>mazeEl.querySelector(`[data-r=\"${a}\"][data-c=\"${b}\"]`).classList.add('path'));break}\n   [[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{const R=r+a,C=c+b; if(g[R]&&g[R][C]&&g[R][C]!=='#'&&!seen.has([R,C]+'')){seen.add([R,C]+'');q.push([R,C,[...p,[R,C]]])}})}\n}\n/* --- مستوى→مستوى: مصعد --- */\nasync function t_lift(k){\n  const next=(S.maze+1)%MAZES.length, d0=S.depth, d1=S.depth+40;\n  fx.className='on'; fx.innerHTML=`<div class=\"lines\"><\/div><div class=\"arrows\"><i><\/i><i><\/i><i><\/i><\/div><div class=\"ld a\"><\/div><div class=\"ld b\"><\/div><div class=\"flr\"><b id=\"dn\">${-d0}<\/b><small>العمق بالمتر<\/small><\/div>`;\n  const la=fx.querySelector('.a'),lb=fx.querySelector('.b'),ln=fx.querySelector('.lines'),fl=fx.querySelector('.flr'),ar=fx.querySelector('.arrows'),dn=fx.querySelector('#dn');\n  await Promise.all([anim(la,[{transform:'translateX(101%)'},{transform:'none'}],{duration:430*k}),anim(lb,[{transform:'translateX(-101%)'},{transform:'none'}],{duration:430*k})]);\n  vib(25); anim(fl,[{opacity:0},{opacity:1}],{duration:200*k});\n  anim(ln,[{opacity:0,backgroundPosition:'0 0'},{opacity:.9,backgroundPosition:'0 600px'}],{duration:1100*k,easing:'ease-in'});\n  anim(ar,[{opacity:0,transform:'translateY(-14px)'},{opacity:1,transform:'translateY(0)'}],{duration:600*k,iterations:2});\n  const sc=$('#screen'); sc.animate([{transform:'translateY(0)'},{transform:'translateY(2px)'},{transform:'translateY(-2px)'},{transform:'translateY(1px)'},{transform:'translateY(0)'}],{duration:RM?1:1000*k,iterations:1});\n  const t0=performance.now(), T=1000*k;\n  await new Promise(res=>{const f=()=>{const p=RM?1:Math.min(1,(performance.now()-t0)/T); dn.textContent='-'+Math.round(d0+(d1-d0)*p); p<1?requestAnimationFrame(f):res()}; f()});\n  setDepth(d1,S.level+1); swapMaze(next,true); mazeEl.classList.remove('hint');\n  setMsg('وصلتَ إلى مستوى أعمق','الهواء أثقل، والخريطة أوسع.');\n  // هبوط ثقيل ثم فتح\n  await sc.animate([{transform:'translateY(0)'},{transform:'translateY(9px)',offset:.35},{transform:'translateY(-3px)',offset:.65},{transform:'translateY(0)'}],{duration:RM?1:520*k,easing:'ease-out'}).finished;\n  anim(fl,[{opacity:1},{opacity:0}],{duration:200*k}); anim(ln,[{opacity:.9},{opacity:0}],{duration:250*k});\n  await Promise.all([anim(la,[{transform:'none'},{transform:'translateX(101%)'}],{duration:520*k,delay:120*k}),anim(lb,[{transform:'none'},{transform:'translateX(-101%)'}],{duration:520*k,delay:120*k})]);\n}\n\n/* ---------- المشغّل ---------- */\nconst TR={raid:[t_raid,'الرائد: أحكِم البدلة'],muh:[t_muh,'المحقق: هذه عدستك'],tabib:[t_tab,'الطبيب: خذ نفَسًا'],exit:[t_exit,'عدتَ إلى نفسك'],rooms:[t_rooms,'غرفة جديدة'],lift:[t_lift,'نزول إلى مستوى أعمق']};\nasync function go(name){\n  if(S.busy)return; S.busy=true; const k=K(); const [fn,label]=TR[name];\n  try{\n    if(RM){\n      await reduced(label,()=>{\n        if(name==='rooms'){const safe=S.mode==='fail';setDepth(S.depth+(safe?0:20),S.level+(safe?0:1));swapMaze(safe?S.maze:(S.maze+1)%3,false)}\n        else if(name==='lift'){setDepth(S.depth+40,S.level+1);swapMaze((S.maze+1)%3,false)}\n        else if(name==='exit'){S.kept=S.who;swapWho('base')} else swapWho(name);\n      });\n    } else await fn(k);\n  }finally{fx.className='';fx.innerHTML='';S.busy=false;S.lock=false}\n  if(S.mode==='challenge'&&['raid','muh','tabib'].includes(name)){ setMsg('ختم الإنجاز: دخلتَ هذا الدور باستحقاق','أُضيف إلى سجلّك.') }\n  if(S.mode==='fail'&&['raid','m &&!S.busy)go(b.dataset.t)};\nwindow.__v5={go,S,swapMaze};\nbuild(0); setMsg('اضغط خلية مجاورة لتتحرك نحو البوابة','أو جرّب أزرار المختبر بالأسفل.');\n})();\n<\/script>\n<\/body>\n<\/html>\n"}</script>
