ipedia.org/wiki/Ibn_Jazla", "note": "فتحتها: وفاته نحو 1100م وإسلامه 1074م، جداول تقويم الأبدان، الترجمة اللاتينية، وتنفي ارتباطه بشارلمان."}, {"title": "Ibn Jazla's Taqwim al-abdan — University of Glasgow Library, Book of the Month", "url": "https://www.gla.ac.uk/myglasgow/library/files/special/exhibns/month/june2003.html", "note": "فتحتها: وفاة 1100م وإسلامه 1074م، 44 جدولًا و352 مرضًا، إهداؤه للمقتدي، الترجمة اللاتينية وطبعة 1532م."}]}, {"id": "ab-ibn-sina-canon-influence", "name": "ابن سينا (الحسين بن عبد الله)", "years_ce": "980–1037م", "city": "بخارى وهمذان وأصفهان", "caliph_era": "في ظل الخلافة العباسية (القادر)؛ عاش في بلاط السامانيين والبويهيين شرق الدولة", "field": "طب وفلسفة", "title": "«القانون في الطب»: كتاب درّسته جامعات أوروبا قرونًا", "story": "بدأ ابن سينا دراسة الطب في سن مبكرة، وتقول سيرته إنه أتقنه وهو في السادسة عشرة. شفى أمير السامانيين نوح بن منصور فسُمح له بدخول مكتبته الملكية. ألّف «القانون في الطب» في خمسة كتب، جمع فيها الطب اليوناني والعربي والهندي. وترجمه جيرارد الكريموني إلى اللاتينية في طليطلة في القرن الثاني عشر، ثم دُرّس في جامعات أوروبا قرونًا.", "did": "ألّف «القانون» في خمسة كتب: المبادئ العامة، الأدوية المفردة، الأمراض، الحالات العامة، الأدوية المركبة. ربط طب جالينوس بفلسفة أرسطو، فأثّر في الدراسة الجامعية في أوروبا.", "quiz": {"q": "من ترجم «القانون» إلى اللاتينية في القرن الثاني عشر؟", "o": ["جيرارد الكريموني", "أندريا ألباغو", "باراسيلسوس"], "a": 0, "e": "ترجم جيرارد في طليطلة؛ أما ألباغو فصحّح النص لاحقًا، وباراسيلسوس أحرق الكتاب علنًا في بازل 1527م."}, "grade": "A", "caveat": "ليس عباسيًّا بغداديًّا بالمعنى الضيق: عاش في المشرق في ظل خلافة اسمية؛ يُترك للقرار البشري هل يدخل في فئة العصر العباسي. تاريخ تأليف «القانون» غير متفق عليه: مصدر يقول كتبه قبل الحادية والعشرين، وآخر يقول بدأه في همذان وأتمه لاحقًا. مصدر encyclopedia.com يحوي أخطاء في بعض التواريخ (مثل ترجمة 1390م) فلا يُعتمد عليه فيها. لم أجد في المصادر المفتوحة سندًا لما يشاع عن «الحجر الصحي» في القانون، فلا يُذكر (انظر rejected.json). لا تُستعمل مادة طبية من الكتاب ف يده المصدر؛ يقول «من أقدم الدساتير بالعربية» فقط. الأصل ضاع أو تغير في النقل، والنسخة المحققة هي «الأقرباذين الصغير»، ومخطوطة ميونخ مؤرخة 741هـ/1341م. تعتمد الفقرة على مراجعة واحدة لدراسة كاهل (تعليق نقدي) ووصفين من الناشر لا يُعدّان مستقلين. لا وصفات ولا جرعات في المدخل. تنبيه: أحد المراجعين انتقد ترجمة بعض أسماء النباتات.", "sources": [{"title": "Review of Kahl, Sabur ibn Sahl's Dispensatory in the Recension of the 'Adudi Hospital (JRAS)", "url": "https://www-cambridge-org.ezproxyberklee.flo.org/core/product/A0CD520D10C705687876E2736FF4A509/core-reader", "note": "فتحتها عبر وسيط جامعي: نسطوري، توفي 255هـ، المتوكل، نسخة العضدي. يُستبدل برابط cambridge.org الرسمي عند المراجعة."}, {"title": "Dispensatorium Parvum (al-Aqrabadhin al-saghir) — Brill record, JGU library", "url": "https://ebooks.jgu.edu.in/Record/ebsco_acadsubs_on1294373073/Description", "note": "فتحتها: «من أقدم الدساتير بالعربية»، وفاة سابور 255هـ/869م، طبعة بريل."}, {"title": "Dispensatorium parvum — Donner (Brill listing)", "url": "https://www.donner.nl/dispensatorium-parvum-al-aqrabadhin-al-saghir/sabur-ibn-sahl/9789004100046", "note": "فتحتها: أقدم شاهد مخطوط على علم الأدوية العربي، الأصل ضاع أو تغيّر."}]}, {"id": "ab-ibn-butlan-taqwim", "name": "ابن بطلان (المختار بن الحسن)", "years_ce": "توفي 1066م (يُقال نحو 1068م)", "city": "بغداد ثم القاهرة وحلب وأنطاكية", "caliph_era": "القائم بأمر الله", "field": "طب وصحة", "title": "تقويم الصحة: كتاب جداول ملهم", "story": "كان ابن بطلان طبيبًا بغداديًا نصرانيًا، تتلمذ على ابن الطيب في مستشفى الصاعدي. ألّف «تقويم الصحة» في جداول عن الطعام والفصول والرياضة والحالات النفسية. هو أول من استعمل الجداول في كتاب غير فلكي، فتبعه ابن جزلة وغيره. وترجم الكتاب إلى اللاتينية باسم Tacuinum Sanitatis فصار الكتاب مزخرفًا بصور الأعشاب والفواكه في أوروبا.", "did": "ابتكر شكل الجدول في الكتب الصحية: لكل عنصر طبيعته ودرجته ومنافعه ومضاره. وسافر من بغداد إلى مصر ثم إلى أنطاكية، وشارك في مناظرة مشهورة مع ابن رضوان.", "quiz": {"q": "ما الذي تميز به كتاب «تقويم الصحة»؟", "o": ["أنه 127م (إستيفان الأنطاكي)؛ المصدران لا يتفقان في التفصيل، فاكتفيتُ بأنها ترجمت وانتشرت. وصفه «النقد الشديد للرازي» لم يثبت؛ المصدر لا يصفه بأنه انتقد الرازي.", "sources": [{"title": "Al-Majusi — Complete Dictionary of Scientific Biography (Hamarneh), encyclopedia.com", "url": "https://www.encyclopedia.com/science/dictionaries-thesauruses-pictures-and-press-releases/al-majus", "note": "فتحتها: وفاة 994م، خدمة عضد الدولة، 20 مقالة، ذات الجنب والصمامات، الأخلاقيات، الترجمة اللاتينية الكاملة 1127م."}, {"title": "The Complete Book of the Medical Art — Wikipedia", "url": "https://en.wikipedia.org/wiki/The_Complete_Book_of_the_Medical_Art", "note": "فتحتها: 20 مقالة، الإهداء لعضد الدولة، 110 موضوعات جراحية، ترجمة جزئية 1089م."}]}, {"id": "ab-tree-of-muqtadir", "name": "شجرة قصر المقتدر", "years_ce": "917م", "city": "بغداد", "caliph_era": "المقتدر بالله", "field": "هندسة وصناعة (آلات متحركة)", "title": "الشجرة التي غنّت طيورها أمام سفراء الروم", "story": "في سنة 917م استقبل الخليفة المقتدر سفراء من الروم في بغداد. قاد الوزير ابن الفرات السفراء في جولة بين قصور كثيرة. وفي «دار الشجرة» رأوا شجرة من الفضة في بركة مستديرة، على أغصانها طيور من فضة وذهب تصفّر بحركتها. ويذكر الخطيب البغدادي أن هذا المشهد كان أكثر ما أدهشهم.", "did": "أقام صنّاع القصر شجرة آلية فيها طيور تصدر صفيرًا، تعبيرًا عن قوة الخلافة وبراعتها الصناعية.", "quiz": {"q": "أي مؤرخ نقل لنا وصف استقبال سفراء الروم سنة 917م؟", "o": ["الخطيب البغدادي", "ابن بطوطة", "المقدسي"], "a": 0, "e": "ورد الوصف في «تاريخ بغداد» للخطيب البغدادي."}, "grade": "B", "caveat": "المصدر الأصلي واحد (الخطيب البغدادي)، وأرقام الرواية متباينة: ويكيبيديا تقول وزن الشجرة 500 ألف درهم و18 غصنًا، وتقول مدونة جامعة ليدن 500 درهم، وعدد القاعات 23 أو 24. الآلية الدقيقة غير معروفة، وقد يكون دهشة السفير مبالغًا فيها لأن القسطنطينية فيها آلات مماثلة. هذا المدخل في الهندسة الفنية لا الطب. لم أجد اسم «هلال الصابئ» في المصادر المفتوحة.", "sources": [{"title": "Robots at a medieval court: the automata of tenth-century Baghdad and Constantinople — Leiden Medievalists Blog", "url": "https://www.leidenmedievalistsblog.nl/articles/robots-at-a-medieval-court-the-automata-of-tenth-century-baghdad-and-constantinople", "note": "فتحتها: يونيو 917م، ابن الفرات، دار الشجرة، رواية الخطيب البغدادي، مراجع Lassner وBrett وIafrate."}, {"title": "Ashmolean: the embassy of 917 (from Grabar, The Formation of Islamic Art)", "url": "https://islamicceramics.ashmolean.org/Abbasid/embassy.htm", "note": "فتحتها: وصف الشجرة والطيور المعدنية، رواية الخطيب، وتفاصيل الجولة."}, {"title": "Taj Palace — Wikipedia", "url": "https://en.wikipedia.org/wiki/Taj_Palace", "note": "فتحتها: دار الشجرة، 18 غصنًا، وزن الشجرة 500,000 درهم بحسب المرجع؛ تعتمد على لو سترانج."}]}, {"id": "ab-abd-al-latif-baghdadi", "name": "عبد اللطيف البغدادي", "years_ce": "1162–1231م", "city": "بغداد ثم القاهرة ودمشق وحلب", "caliph_era": "أواخر العصر العباسي (الناصر لدين الله)", "field": "طب وتشريح وجغرافيا", "title": "الطبيب الذي صحّح التشريح من هياكل المجاعة", "story": "وُلد عبد اللطيف البغدادي في بغداد وتجوّل بين الموصل ودمشق والقدس والقاهرة. حين أصابت مصر مجاعة سنة 1200م، رأى هياكل عظمية كثيرة ودرسها. فخرج برأي مختلف عن جالينوس في تكوّن الفك الأسفل والعجز وعظم العصعص. ودوّن ما رآه في مصر في كتابه «الإفادة والاعتبار».", "did": "لاحظ مباشرة هياكل بشرية وقارنها بوصف جالينوس، وسجّل ملاحظاته في «الإفادة والاعتبار في الأمور المشاهدة والحوادث المعاينة بأرض مصر».", "quiz": {"q": "ما الذي أتاح لعبد اللطيف البغدادي ملاحظة الهياكل العظمية في مصر؟", "o": ["مجاعة سنة 1200م", "حرب صليبية", "فيضان النيل وحده"], "a": 0, "e": "أتاحت مجاعة 1200م مشاهدة هياكل كثيرة بالصدفة."}, "grade": "B", "caveat": "بغدادي المولد لكن إنجازه في مصر في العهد الأيوبي، وبغداد تحت الخلافة العباسية؛ يُترك للمراجعة هل يُحسب عباسيًّا. وصف «خطأ جالينوس» جاء في ويكيبيديا، أما مصدر NLM فيقول إنه حسّن وصف الفك والعجز ولا يسميه خطأ. المجاعة مؤرخة في 597هـ/1200م في المصدرين المفتوحين. تفاصيل أكل لحوم البشر والهرم هي ما يرويه تاريخًا ولا تدخل التطبيق. المصدر الأساسي ابن أبي أصيبعة ولم أفتحه.", "sources": [{"title": "Abd al-Latif al-Baghdadi — Wikipedia", "url": "https://en.wikipedia.org/wiki/Abd_al-Latif_al-Baghdadi", "note": "فتحتها: 1162–1231م، رحلاته، مجاعة 597هـ/1200م وهياكل الفك والعجز والعصعص، ومراجع ابن أبي أصيبعة."}, {"title": "NLM — Arabic Medical Manuscripts (Ibn al-Nafis monograph page)", "url": "https://mainweb.awsprod.nlm.nih.gov/hmd/arabic/mon4.html", "note": "فتحتها: وفاته 629هـ/1231م، تصحيح وصف الفك الأسفل والعجز بعد مجاعة 1200م «ملاحظة بالصدفة»."}]}, {"id": "ab-khalil-ayn", "name": "الخليل بن أحمد الفراهيدي", "years_ce": "نحو 718 – 786 أو 791م", "city": "البصرة", "caliph_era": "العصر العباسي الأول (تقدير المحرر)", "field": "لغة ومعجمات وعروض", "title": "معجم يبدأ من الحلق", "story": "أراد الخليل أن يرتّب كلمات العربية، فلم يبدأ بالألف كما نفعل اليوم. رتّب الحروف بحسب مخارجها في الفم من الأعمق إلى الأقرب، فبدأ بحرف العين، ولذلك سُمّي كتابه «العين». ويُعدّ هذا الكتاب أول معجم عربي وأقدمه. ويرى بعض الباحثين أن تلميذه الليث بن المظفر شارك في إتمامه.", "did": "وضع نظام ترتيب المعجم على مخارج الحروف (كتاب العين)، ويُنسب إليه تقنين أوزان الشعر العربي (علم العروض) وتمييز أشكال الحركات.", "quiz": {"q": "بأي حرف بدأ الخليل ترتيب كتابه «العين» ولماذا؟", "o": ["بالألف لأنه أول الأبجدية", "بالعين لأنه من أعمق مخارج الحروف في الحلق", "بالباء لأنها أسهل الحروف"], "a": 1, "e": "رتّب الحروف بحسب مخارجها من الأعمق إلى الأقرب، فجاءت العين أولًا."}, "grade": "B", "caveat": "المصدران متفقان على الإنجاز، لكن: (1) نسبة الكتاب كله إلى الخليل محل بحث، فقد يكون الليث بن المظفر أكمل أجزاء منه. (2) سنة الوفاة 786 أو 791م، والميلاد نحو 718م وفي مكانه خلاف (عُمان أو البصرة). (3) الموسوعة ذكرت قصة العروض (حدّاد البصرة) وقصة وفاته بالاصطدام بعمود ولم أعتمدهما لأنهما روايتان لا توثيق قويًا لهما. (4) عدد بحور الشعر: المصدر ذكر خمسة عشر في قصة الدوائر، ولم أتحقق من عدد آخر فلا يُجزم بعدد.", "sources": [{"title": "Al-Khalil ibn Ahmad al-Farahidi (Wikipedia)", "url": "https://en.wikipedia.org/wiki/Al-Khalil_ibn_Ahmad_al-Farahidi", "note": "ترتيب العين بالمخارج، العروض، خلاف التأليف والوفاة"}, {"title": "al-Khalil ibn Ahmad (Britannica)", "url": "https://britannica.com/biography/al-Khalil-ibn-Ahmad", "note": "ولادة نحو 718 ووفاة نحو 791 بالبصرة، كتاب العين، احتمال مشاركة الليث"}]}, {"id": "ab-sibawayh-kitab", "name": "سيبويه", "years_ce": "نحو 760 – بين 793 و796م (تقريبًا)", "city": "البصرة (أصله من فارس)", "caliph_era": "عصر هارون الرشيد (تقدير المحرر)", "field": "لغة ونحو", "title": "«الكتاب» الذي لا يحتاج إلى اسم", "story": "جاء سيبويه من بلاد فارس إلى البصرة ليتعلّم العربية، وصار من أعظم نحاتها. تتلمذ على الخليل بن أحمد ويونس بن حبيب. ألّف كتابًا في النحو سمّاه الناس «الكتاب» فقط لعظمته، ويُظن أنه من أوائل النصوص النثرية العربية الكبرى. وتوفي صغيرًا، وكتب تلميذه الأخفش الأكبر نسخته المعروفة.", "did": "ألّف «الكتاب»: أول عرض منظّم شامل لنحو العربية وصرفها، يتدرج من التركيب إلى الصرف مع ملحق في الأصوات.", "quiz": {"q": "من أي بلد جاء سيبويه إلى البصرة؟", "o": ["من اليمن", "من بلاد فارس", "من مصر"], "a": 1, "e": "المصدران يذكران أصله من فارس (شيراز أو البيضاء) وتعلّمه بالبصرة."}, "grade": "A", "caveat": "الميلاد بين 755 و766م تقريبًا والوفاة غير مجزوم بها (793–796م، وقيل 777م). موضع الميلاد: البيضاء/شيراز أو همذان في رواية. قصة المناظرة الزنبورية مع الكسائي رواية في كتب التراجم لم أعتمدها في القصة. ذكرت تتلمذه على الخليل لأن موسوعة بريتانيكا في مدخل الخليل تعدّه من تلاميذه.", "sources": [{"title": "Sibawayh (Wikipedia)", "url": "https://en.wikipedia.org/wiki/Sibawayh", "note": "الأصل، الشيوخ، الكتاب، الأخفش، الخلاف في الوفاة"}, {"title": "Sibawayh (Britannica)", "url": "https://www.britannica.com/biography/Sibawayh", "note": "تواريخ تقريبية، الكتاب في النحو، رواية الاعتزال بعد مناظرة"}]}, {"id": "ab-ibn-nadim-fihrist", "name": "ابن النديم", "years_ce": "نحو 932 – 995م", "city": "بغداد", "caliph_era": "أواخر العصر العباسي (حقبة البويهيين، تقدير المحرر)", "field": "تاريخ وفهرسة", "title": "من يعرف كل الكتب؟", "story": "كان ابن النديم يعمل في أسرة تبيع الكتب في بغداد، فعرف عالم المخطوطات من الداخل. جمع أسماء الكتب ومؤلفيها في «الفهرست»، وأتمّه سنة 987م تقريبًا. ذكر فيه نحو عشرة آلاف كتاب وآلاف المؤلفين، من اللغة إلى الفلسفة والكيمياء. وبفضله نعرف أسماء مؤلفات كثيرة ضاعت ولم يبق منها غير عنوانها.", "did": "صنّف أول فهرس موسوعي لكتب الثقافة العربية الإسلامية وترجم لمؤلفيها في عشر مقالات.", "quiz": {"q": "ما قيمة «الفهرست» الكبرى للباحثين اليوم؟", "o": ["أنه كتاب في الطب فقط", "أنه يضم خرائط الدنيا", "أنه يحفظ أسماء كتب ومؤلفين ضاعت أعمالهم"], "a": 2, "e": "لأن معظم ما وصفه من كتب فُقد، فصار الفهرست مصدرًا لمعرفة ما كُتب قديمًا."}, "grade": "A", "caveat": "تاريخ التأليف 987م (377هـ) أو 988م بحسب المصدر. الأرقام (نحو 10,000 كتاب و3,500–3,700 مؤلف) تقريبية والفهرست ناقص. وفاته نحو 995–998م. انتماؤه المذهبي مختلف فيه (قيل شيعي معتزلي) وهو غير ثابت؛ لم يدخل في القصة.", "sources": [{"title": "Al-Fihrist (Wikipedia)", "url": "https://en.wikipedia.org/wiki/Al-Fihrist", "note": "987م، عشر مقالات، عدد الكتب والمؤلفين"}, {"title": "Ibn al-Nadim (Wikipedia)", "url": "https://en.wikipedia.org/wiki/Ibn_al-Nadim", "note": "حياته ووراقة أبيه وغموض مذهبه"}, {"title": "Fihrist (Britannica)", "url": "https://www.britannica.com/topic/Fihrist", "note": "ابن النديم بائع كتب، التأليف نحو 988م، ضياع أكثر ما وصفه"}]}, {"id": "ab-ibn-fadlan-volga", "name": "أحمد بن فضلان", "years_ce": "رحلته 921–922م (ميلاده ووفاته مجهولان)", "city": "بغداد", "caliph_era": "عصر المقتدر بالله", "field": "رحلات وجغرافيا", "title": "سفير بغداد إلى نهر الفولغا", "story": "في 21 يونيو 921م خرجت من بغداد بعثة أرسلها الخليفة المقتدر إلى ملك البلغار على نهر الفولغا، وكان ابن فضلان سكرتيرها ومرشدها في أمور الدين. قطعت البعثة نحو أربعة آلاف كيلومتر عبر بخارى وبحر قزوين وأراضي الغز والخزر والبشكير. وصلت عاصمة البلغار في 12 مايو 922م. كتب ابن فضلان «الرسالة» التي وصف فيها الشعوب التي رآها، ومنهم الروس (الفايكنغ) على الفولغا.", "did": "دوّن مشاهدة مباشرة لشعوب شرق أوروبا وآسيا الوسطى، وتُعدّ رسالته من أقدم الأوصاف المكتوبة لروس الفولغا.", "quiz": {"q": "في أي عام وصلت بعثة ابن فضلان إلى عاصمة البلغار؟", "o": ["922م", "1022م", "822م"], "a": 0, "e": "خرجت في 921م ووصلت في 12 مايو 922م."}, "grade": "A", "caveat": "المصدران متفقان على التواريخ. لا يُعرف شيء يقين عن أصله وسنة ميلاده ووفاته. النص الكامل لم يصلنا: كان معروفًا بمقتطفات ياقوت حتى وُجدت مخطوطة مشهد سنة 1923م وهي ناقصة. وصفه لبعض الأمم فيه حكم ثقافي متحيز وربما مبالغة. هوية «الروس» وطقس دفن زعيم الروس (فيه تضحية بشرية) مما لا يناسب الفئة العمرية فلم يدخل في القصة؛ ينبغي قرار بشري إن أُريد ذكره.", "sources": [{"title": "Ahmad ibn Fadlan (Wikipedia)", "url": "https://en.wikipedia.org/wiki/Ahmad_ibn_Fadlan", "note": "21 يونيو 921، 12 مايو 922، المسار، مخطوطة مشهد 1923"}, {"title": "Ibn Fadlan: An Arab Among the Vikings of Russia (Encyclopedia.com)", "url": "https://encyclopedia.com/science/encyclopedias-almanacs-transcripts-and-maps/ibn-fadlan-arab-among-vikings-russia", "note": "الغرض من البعثة والمسار والتواريخ وضياع الجزء الأخير"}]}, {"id": "ab-masudi-muruj", "name": "المسعودي", "years_ce": "نحو 896 – 956م", "city": "بغداد (وتوفي في مصر)", "caliph_era": "عصر المقتدر إلى المطيع (تقدير المحرر)", "field": "تاريخ وجغرافيا", "title": "مؤرخ يركب البحار", "story": "وُلد المسعودي في بغداد وقضى معظم عمره في الأسفار. زار بلاد فارس وأرمينيا وسواحل قزوين وسوريا ومصر وغرب الهند، ويُرجَّح أنه بلغ ساحل شرق أفريقيا. جمع ما رأى وما سمع من التجار والأهالي في كتابه «مروج الذهب»، وقد وسّع فيه التاريخ ليشمل الجغرافيا وأحوال الأمم. ولهذا لُقّب بـ«هيرودوت العرب».", "did": "كتب «مروج الذهب ومعادن الجوهر» ثم «التنبيه والإشراف»، جامعًا التاريخ والجغرافيا وأحوال الأمم في كتاب واحد.", "quiz": {"q": "ما الذي جمعه المسعودي في «مروج الذهب» بصورة غير معتادة في زمنه؟", "o": ["الشعر وحده", "التاريخ والجغرافيا وأحوال الأمم معًا", "الحساب والهندسة فقط"], "a": 1, "e": "وصفه بريتانيكا بأنه أول عربي جمع التاريخ والجغرافيا العلمية في عمل كبير."}, "grade": "B", "caveat": "الخلاف في التفاصيل: عدد فصول مروج الذهب 132 (بريتانيكا) أو 365 في نسخة منقّحة (ويكيبيديا). ولادته نحو 896م أو قبل 893م. بلوغه سريلانكا والصين غير مؤكد. دقة بعض أخباره موضع نقد: ينقل ما سمع دون تمحيص كاف. اتهامه بالاعتزال/التشيع مختلف فيه فلا يُذكر.", "sources": [{"title": "Al-Masudi (Wikipedia)", "url": "https://en.wikipedia.org/wiki/Al-Masudi", "note": "الرحلات، مروج الذهب، التنبيه والإشراف، الخلاف في مذهبه"}, {"title": "al-Masudi (Britannica)", "url": "https://www.britannica.com/biography/al-Masudi", "note": "الكتب، المنهج، لقب هيرودوت العرب، نقد الدقة"}]}, {"id": "ab-ibn-khurdadhbih-masalik", "name": "ابن خرداذبه", "years_ce": "نحو 820 أو 825 – نحو 913م", "city": "بغداد وسامراء والجبال", "caliph_era": "عصر الواثق إلى المعتمد (تقدير المحرر)", "field": "جغرافيا إدارية", "title": "مدير البريد الذي رسم الطرق", "story": "كان ابن خرداذبه مسؤولًا عن البريد والاستخبارات في إقليم الجبال، ثم عمل في سامراء وبغداد. من وظيفته عرف الطرق والمحطات والمسافات بالفراسخ. جمع ذلك في «المسالك والممالك»، وهو أقدم كتاب عربي باقٍ في الجغرافيا الإدارية. وأخذ عنه جغرافيون لاحقون كثيرون.", "did": "ألّف «المسالك والممالك»: طرق البريد والمسافات وخراج الولايات وألقاب الحكام.", "quiz": {"q": "ما وظيفة ابن خرداذبه التي أفادته في تأليف كتابه؟", "o": ["قاضٍ للقضاة", "قائد أسطول", "مدير البريد والاستخبارات"], "a": 2, "e": "عمل مديرًا لديوان البريد في الجبال ثم في سامراء وبغداد."}, "grade": "B", "caveat": "تاريخ تأليف الكتاب مختلف فيه: الطبعة الأولى نحو 846م (232هـ) في سامراء حسب إيرانيكا، وويكيبيديا تذكر نحو 870م وطبعة ثانية 885م؛ والنص المطبوع مختصر يخلط الطبعتين. ميلاده 820 أو 825م. سيرته مجموعة من إشارات متفرقة.", "sources": [{"title": "Ebn Kordadbeh (Encyclopaedia Iranica)", "url": "https://iranicaonline.org/articles/ebn-kordadbeh", "note": "البريد، المسالك والممالك، الطبعتان، الأهمية"}, {"title": "Ibn Khordadbeh (Wikipedia)", "url": "https://en.wikipedia.org/wiki/Ibn_Khordadbeh", "note": "النشأة، المنصب، الكتاب، الخلاف في التواريخ"}]}, {"id": "ab-yaqubi-buldan", "name": "اليعقوبي", "years_ce": "توفي 897 أو 898م", "city": "بغداد (نشأ في أرمينيا وخراسان)", "caliph_era": "عصر المعتمد (تقدير المحرر)", "field": "تاريخ وجغرافيا", "title": "رحلة من أرمينيا إلى المغرب", "story": "عاش اليعقوبي في أرمينيا وخراسان تحت رعاية الطاهريين حتى سنة 873م. ثم سافر إلى الهند وبلاد المغرب، وانتهى به المقام في مصر حيث توفي سنة 897م. كتب «تاريخ اليعقوبي» وهو تاريخ عالمي، وكتاب «البلدان» وفيه أوصاف مدن ومسالك وضرائب. اعتمد في كتبه على المشاهدة وعلى سؤال أقاربه عمّا لم يرَه بنفسه.", "did": "ألّف «كتاب البلدان» وصف فيه مدنًا وأقاليم من العراق إلى المغرب مع الطبوغرافيا والخراج، و«التاريخ» العالمي.", "quiz": {"q": "في أي بلد انتهى المقام باليعقوبي وتوفي؟", "o": ["مصر", "الأندلس", "الصين"], "a": 0, "e": "المصادر تذكر وفاته في مصر سنة 897 أو 898م."}, "grade": "B", "caveat": "سنة الميلاد غير معروفة. وفاته 897/898م. تاريخ تأليف «البلدان» غير محدد في المصدرين، وجزء كبير منه مفقود. يُنبّه على ميله الشيعي في التاريخ عند الاستشهاد به. وجود تواريخ تفصيلية عن إقامته في الهند والمغرب غير مذكور.", "sources": [{"title": "al-Yaqubi (Britannica)", "url": "https://www.britannica.com/biography/al-Yaqubi", "note": "التنقل، الكتابان، الميل الشيعي، فقد جزء من البلدان"}, {"title": "al-Ya'qubi (Wikipedia)", "url": "https://en.wikipedia.org/wiki/Al-Ya%27qubi", "note": "وفاته في 897/8، منهجه في المشاهدة والمقابلة"}]}, {"id": "ab-jahiz-hayawan", "name": "الجاحظ", "years_ce": "نحو 776 – 868/869م", "city": "البصرة", "caliph_era": "من الرشيد إلى المعتز (تقدير المحرر)", "field": "أدب وعلم حيوان", "title": "كتاب الحيوان: مكتبة في سبعة أجزاء", "story": "كان الجاحظ أديب البصرة وصاحب أسلوب مرح غزير. ألّف «كتاب الحيوان» في سبعة أجزاء، وجعل الحيوان بوابة إلى الحكايات والأمثال ووصف أكثر من ثلاثمئة وخمسين نوعًا. وتحدث فيه عن ترابط الكائنات وأثر البيئة فيها. ولقبه «الجاحظ» يعني بارز العينين.", "did": "صنّف «كتاب الحيوان» الذي جمع ملاحظات عن سلوك الحيوان وبيئته مع الأدب والأمثال، وأسهم في تطوير النثر العربي.", "quiz": {"q": "كم جزءًا في «كتاب الحيوان» للجاحظ بحسب المصادر؟", "o": ["جزءان", "سبعة أجزاء", "اثنا عشر جزءًا"], "a": 1, "e": "ويكيبيديا تصفه بأنه مجموعة من سبعة مجلدات."}, "grade": "A", "caveat": "القصة اقتصرت على ما اتفق عليه المصدران. أما ادعاء أنه سبق داروين في الانتخاب الطبيعي فمبالغ فيه (إطاره خلقي ويؤمن بالتولد الذاتي)، وقد سُجّل في rejected. بريتانيكا ترى الكتاب أدبيًا أكثر منه علمًا بالمعنى الدقيق. قصة موته بسقوط الكتب تقليد متأخر غير ثابت. سنة ميلاده نحو 776م ووفاته ديسمبر 868 أو يناير 869م.", "sources": [{"title": "Al-Jahiz (Wikipedia)", "url": "https://en.wikipedia.org/wiki/Al-Jahiz", "note": "الحيوان في سبعة مجلدات، ما يُنسب إليه من أفكار بيئية والنقد، اللقب"}, {"title": "Kitab al-Hayawan (Britannica)", "url": "https://www.britannica.com/topic/Kitab-al-Hayawan", "note": "وحدة الطبيعة، الطابع الأدبي، الأثر في النثر العربي"}]}, {"id": "ab-muqaddasi-ahsan", "name": "المقدسي (البشاري)", "years_ce": "نحو 945 – بين 990 و1000م", "city": "القدس", "caliph_era": "العصر العباسي الثاني (تقدير المحرر)", "field": "جغرافيا", "title": "رحّالة يقسّم الدنيا إلى أربعة عشر إقليمًا", "story": "وُلد المقدسي في القدس، وحجّ في العشرين من عمره تقريبًا، ثم قرر أن يتعلم الجغرافيا بالسفر. جاب العالم الإسلامي نحو عشرين سنة. وألّف سنة 985م «أحسن التقاسيم في معرفة الأقاليم» ومعه قسّم بلاد الإسلام إلى أربعة عشر إقليمًا. وصف المدن والتجارة والمكاييل والمعادن والعادات، وجعل كلامه من مشاهدته.", "did": "وضع «أحسن التقاسيم» بمنهج ميداني: تقسيم إلى أقاليم، ووصف المدن الكبرى ثم الأصغر، مع أحوال السكان والتجارة.", "quiz": {"q": "إلى كم إقليمًا قسّم المقدسي بلاد الإسلام في كتابه؟", "o": ["سبعة", "أربعة عشر", "اثني عشر"], "a": 1, "e": "قسّمها إلى أربعة عشر إقليمًا."}, "grade": "B", "caveat": "المصدران يتفقان على 985م والتقسيم إلى 14 إقليمًا، لكن الصفحتين تعتمدان على دراسة واحدة غالبًا (باسل كولنز) فهما غير مستقلتين تمامًا. الميلاد نحو 945–946م والوفاة بين نحو 990 و1000م. مدة الرحلة نحو عشرين سنة بحسب المصدر (لا 14). تاريخ النسخة المنقّحة (بعد ثلاث سنوات أو 378هـ). ادعاؤه 36 اسمًا من كلامه هو.", "sources": [{"title": "Al-Muqaddasi: The Geographer from Palestine (Muslim Heritage)", "url": "https://muslimheritage.com/al-muqaddasi-the-geographer-from-palestine/", "note": "التواريخ، الرحلة، 14 إقليمًا، 985م"}, {"title": "al-Muqaddasi (Encyclopedia.com)", "url": "https://encyclopedia.com/history/news-wires-white-papers-and-books/shams-al-din-abu-abd-allah-muhammad-al-muqaddasi", "note": "منهجه، وصف الأقاليم، تحديد الكتابة في شيراز 985م"}]}, {"id": "ab-tabari-tarikh", "name": "الطبري", "years_ce": "نحو 838/839 – 923م", "city": "آمل في طبرستان ثم بغداد", "caliph_era": "من المعتصم إلى المقتدر (تقدير المحرر)", "field": "تاريخ", "title": "تاريخ العالم سنةً بعد سنة", "story": "وُلد الطبري في آمل بطبرستان وعاش في بغداد وتوفي فيها. ألّف «تاريخ الرسل والملوك» الذي يبدأ من بدء الخلق وينتهي سنة 915م. رتّبه على السنين، وأورد الروايات بأسانيدها وكثيرًا ما ذكر أكثر من رواية للحدث الواحد. وقد ترجمته جامعة ولاية نيويورك إلى الإنجليزية في نحو أربعين مجلدًا.", "did": "صنّف «تاريخ الرسل والملوك» على الحوليات مع إسناد الأخبار وعرض الروايات المتعارضة.", "quiz": {"q": "كيف رتّب الطبري كتاب التاريخ؟", "o": ["حسب أسماء المدن", "على السنين (حوليات)", "حسب الحروف الهجائية"], "a": 1, "e": "الكتاب مرتب سنةً بعد سنة وهو من التاريخ الحولي."}, "grade": "A", "caveat": "الميلاد 838 أو 839م. عدد المجلدات يختلف بحسب الطبعة (13 في ليدن، 10 في القاهرة، 39 مع فهرس في ترجمة SUNY). الكتاب يركز على فارس والعراق ويقلّ في غيرها. هو مصدر عن روايات لا تُقبل كلها على ظاهرها.", "sources": [{"title": "History of the Prophets and Kings (Wikipedia)", "url": "https://en.wikipedia.org/wiki/Tarikh-e-Tabari", "note": "المنهج الحولي والإسناد، النهاية 915م، الطبعات والترجمة"}, {"title": "al-Tabari (Britannica)", "url": "https://www.britannica.com/print/article/579654", "note": "الحياة والميلاد في آمل والوفاة في بغداد وأهمية الكتابين"}]}, {"id": "ab-asmai-basra", "name": "الأصمعي", "years_ce": "نحو 740 – 828 أو 833م", "city": "البصرة", "caliph_era": "عصر هارون الرشيد (قصر الرشيد)", "field": "لغة وأدب", "title": "راوية البصرة وجامع الشعر", "story": "الأصمعي من أعلام مدرسة البصرة اللغوية، وتتلمذ على أبي عمرو بن العلاء. اتصل بالخليفة هارون الرشيد وعلّم ولديه الأمين والمأمون. جمع «الأصمعيات»، وهي مختارات من الشعر القديم، ويُعرف بحرصه على صحة الرواية. نُسبت إليه نحو ستين مؤلفًا في الحيوان والنبات والعادات.", "did": "جمع «الأصمعيات» وألّف في اللغة والنبات والحيوان، وأعدّ تلاميذه دواوين شعراء الجاهلية على المبادئ التي وضعها.", "quiz": {"q": "ماذا جمع الأصمعي في «الأصمعيات»؟", "o": ["أخبار الفتوحات", "جداول فلكية", "مختارات من الشعر القديم"], "a": 2, "e": "الأصمعيات مختارات شعرية مشهورة."}, "grade": "A", "caveat": "الوفاة 828 أو 833م. صفحة Muslim Heritage تقول إنه رائد في دراسة تشريح الحيوان ولم أعتمدها (غير مؤيدة في بريتانيكا). لا تُنسب إليه نوادر طريفة هنا لعدم توثيقها في المصدرين.", "sources": [{"title": "al-Asmai (Britannica)", "url": "https://www.britannica.com/biography/al-Asmai", "note": "الميلاد والوفاة، بلاط الرشيد، الأصمعيات، 60 مؤلفًا"}, {"title": "Al-Asmai (Muslim Heritage)", "url": "https://muslimheritage.com/people/scholars/al-asmai/", "note": "تواريخ 740 و828/833، الأصمعيات، مدرسة البصرة"}]}, {"id": "ab-dinawari-nabat", "name": "أبو حنيفة الدينوري", "years_ce": "توفي 895م تقريبًا (بين 894 و903م)", "city": "دينور (غرب إيران) والعراق", "caliph_era": "عصر المعتمد (تقدير المحرر)", "field": "نبات ولغة وتاريخ", "title": "الرجل الذي كتب «كتاب النبات»", "story": "وُلد الدينوري في بلدة دينور غرب إيران، وحضر مجالس اللغويين في العراق. ألّف نحو خمسة عشر كتابًا في الفلك والحساب والجبر والشعر والتاريخ. وأشهرها «كتاب النبات» الذي يُعدّ أساس علم النبات العربي. ما بقي منه يصف أكثر من ستمئة نبات، ويربط النبات بالطقس والتربة. وكتب أيضًا «الأخبار الطوال» وهو تاريخ من منظور فارسي.", "did": "ألّف «كتاب النبات»: معجم نباتي ودراسات عن نباتات لها استعمالات، اعتمد فيه على المصادر المكتوبة وعلى الأعراب وعلى ملاحظته.", "quiz": {"q": "ما أشهر كتاب للدينوري في العلوم؟", "o": ["كتاب النبات", "كتاب المناظر", "كتاب الحيل"], "a": 0, "e": "كتاب النبات يُعدّ مؤسّسًا لعلم النبات العربي."}, "grade": "A", "caveat": "سنة الميلاد مجهولة (نحو 815 أو 828م تقدير) والوفاة بين 894 و903م. الكتاب ناقص: بقي الجزآن الثالث والخامس وأجزاء مستعادة من النقول. رقم 637 نباتًا ورد عند ويكيبيديا وحدها. أصله فارسي أو كردي بحسب المصادر. اتهم المسعودي ابن قتيبة بالنقل منه، وهو اتهام لا حقيقة مثبتة.", "sources": [{"title": "Abu Hanifa Dinawari (Wikipedia)", "url": "https://en.wikipedia.org/wiki/Abu_Hanifa_Dinawari", "note": "كتاب النبات، 637 نباتًا، الأخبار الطوال"}, {"title": "Dinavari (Encyclopaedia Iranica)", "url": "https://www.iranicaonline.org/articles/dinavari", "note": "الوفاة بين 281 و290هـ، مؤلفاته، تحرير كتاب النبات"}]}, {"id": "ab-ibn-durayd-jamhara", "name": "ابن دريد", "years_ce": "نحو 837/838 – 933م", "city": "البصرة ثم عُمان وفارس وبغداد", "caliph_era": "من المعتصم إلى المقتدر (تقدير المحرر)", "field": "لغة ومعجمات", "title": "معجم أملاه من ذاكرته", "story": "نشأ ابن دريد في البصرة، وهرب منها سنة 871م أيام ثورة الزنج إلى عُمان، ثم استقر في بغداد سنة 920م وأعطاه الخليفة المقتدر راتبًا. ألّف «جمهرة اللغة» وهي ثاني المعاجم شهرةً بعد «العين». ورتّب فيها المواد على حروف المعجم، واعتمد على الذاكرة في أجزاء كتبها. وهو شاعر، وألّف «الاشتقاق» في أصول الأسماء.", "did": "ألّف «جمهرة اللغة» ترتيب أقرب إلى الألفبائي بدل ترتيب المخارج، وكتاب «الاشتقاق».", "quiz": {"q": "أي معجم سبق الجمهرة ورتّب الحروف على المخارج؟", "o": ["الصحاح للجوهري", "لسان العرب", "العين للخليل"], "a": 2, "e": "الجمهرة تلت «العين» في الشهرة وغيّرت ترتيبه."}, "grade": "B", "caveat": "ولادته 837 أو 838م. علاقة الجمهرة بكتاب «العين» محل جدل: اتهمه نفطويه بالانتحال من الخليل. أجزاء من الجمهرة أُمليت من الذاكرة فوقعت فيها أخطاء. «المقصورة» مذكورة في ويكيبيديا ولم تؤكدها بريتانيكا. ممارسته الطب قيل ولم يثبت. صفحة Muslim Heritage عنه مأخوذة من ويكيبيديا فلم أعدّها مصدرًا مستقلًا.", "sources": [{"title": "Ibn Duraid (Wikipedia)", "url": "https://en.wikipedia.org/wiki/Ibn_Duraid", "note": "الجمهرة، الترتيب، الإملاء من الذاكرة، المقصورة، الاتهام بالانتحال"}, {"title": "Ibn Durayd (Britannica)", "url": "https://www.britannica.com/print/article/280738", "note": "هروبه إلى عُمان سنة 871، بغداد 920، الجمهرة والاشتقاق"}]}];

  if(revealed)e.w=0;else{e.w++;if(e.w>=2&&e.l<5){e.l++;e.w=0;}}

function award(key,lvl,hints,wrong,revealed){
  var base=[3,5,8,12,16][Math.max(0,Math.min(4,lvl-1))];
  var pts=revealed?1:Math.max(1,base-hints)+(hints===0?1:0)+Math.min(3,wrong);
  grit.add(key,pts);lvUpdate(key.replace(/\d+$/,""),revealed);
  if(DAILY)DAILY.res[DAILY.i]=revealed?0:1;
  if(revealed)streak=0;else streak++;
  return pts;
}

}
function winFx(msg,pts,box){

  ASND.win();burst(box||msg);

  if(streak===3||streak===5||streak===10){ASND.cheer();extra=" 🔥 "+streak+" متتالية!";}
  ASND.say(streak===3?"ثلاثة متتالية، استمر":pick(SAYW));
  msg.textContent=pick(ENC)+" +"+pts+" عزيمة"+extra;refreshGrit();setStreakLabel();
}
function wrongFx(msg,wrap,wrong){
  msg.className="msg bad";msg.textContent=pick(TRY)+(wrong>=3?" (الحل متاح الآن من زر التلميح.)":"");

/* --- المتاهة --- */
function aMaze(lvl){lvl=lvl||curLvl("maze");
  var wrap=aShell("المتاهة",aMenu);
  var cols=[7,9,11,9,11][lvl-1],R=[3,2,1,2,1][lvl-1],hasKey=lvl>=4;
  var W=Math.min(window.innerWidth-28,420),cell=Math.floor(W/cols);
  var availH=Math.max(240,window.innerHeight-350);
  var rows=Math.max(8,Math.min(18,Math.floor(availH/cell)));
  var cv=h("canvas",{id:"mz","aria-label":"متاهة"});cv.width=cell*cols;cv.height=cell*rows;
  var ctx=cv.getContext("2d");
  var msg=h("div",{class:"msg","aria-live":"polite"}),stat=h("div",{class:"stat"});
  var wl=[],x,y,seen=[];
  for(y=0;y<rows;y++){wl[y]=[];seen[y]=[];for(x=0;x<cols;x++){wl[y][x]={n:1,e:1,s:1,w:1};seen[y][x]=0;}}
  var D={n:[0,-1,"s"],s:[0,1,"n"],e:[1,0,"w"],w:[-1,0,"e"]},stack=[[0,0]];seen[0][0]=1;
  while(stack.length){
    var c=stack[stack.length-1],opts=[];
    for(var k in D){var nx=c[0]+D[k][0],ny=c[1]+D[k][1];if(nx>=0&&ny>=0&&nx<cols&&ny<rows&&!seen[ny][nx])opts.push(k);}
    if(!opts.length){stack.pop();continue;}
    var d=pick(opts),n2=[c[0]+D[d][0],c[1]+D[d][1]];
    wl[c[1]][c[0]][d]=0;wl[n2[1]][n2[0]][D[d][2]]=0;seen[n2[1]][n2[0]]=1;stack.push(n2);
  }
  var P={x:0,y:0},EX={x:cols-1,y:rows-1},KEY=null,gotKey=!hasKey,vis={"0,0":1},steps=0,hints=0,path=[],won=false,pathTimer=0,lastBump=0;
  function bfs(from,to){
    var q=[from],prev={},key=function(a,b){return a+","+b;};prev[key(from[0],from[1])]=null;var dist={};dist[key(from[0],from[1])]=0;
    while(q.length){
      var a=q.shift();if(a[0]===to[0]&&a[1]===to[1])break;
      for(var k in D){if(wl[a[1]][a[0]][k])continue;var nx=a[0]+D[k][0],ny=a[1]+D[k][1],kk=key(nx,ny);if(prev[kk]!==undefined)continue;prev[kk]=a;dist[kk]=dist[key(a[0],a[1])]+1;q.push([nx,ny]);}
    }
    var out=[],cur=to;
    while(cur&&(cur[0]!==from[0]||cur[1]!==from[1])){out.unshift(cur);cur=prev[key(cur[0],cur[1])];}
    return {path:out,dist:dist};
  }
  if(hasKey){
    var info=bfs([0,0],[EX.x,EX.y]),all=[],mx=0,kk;
    for(kk in info.dist)if(info.dist[kk]>mx)mx=info.dist[kk];
    for(y=0;y<rows;y++)for(x=0;x<cols;x++){var dd=bfs([0,0],[x,y]).dist[x+","+y];if(dd>=mx*.35&&dd<=mx*.8&&!(x===EX.x&&y===EX.y))all.push([x,y]);}
    KEY=pick(all.length?all:[[Math.floor(cols/2),Math.floor(rows/2)]]);
  }
  function near(a,b){return Math.abs(a-P.x)+Math.abs(b-P.y)<=R;}
  function status(){stat.textContent="الخطوات: "+steps+(hasKey?(gotKey?"  ·  🗝 معك المفتاح":"  ·  🗝 ابحث عن المفتاح"):"");}
  function draw(){
    ctx.fillStyle="#0e1530";ctx.fillRect(0,0,cv.width,cv.height);
    for(var yy=0;yy<rows;yy++)for(var xx=0;xx<cols;xx++){
      var nr=near(xx,yy),was=vis[xx+","+yy];
      if(!nr&&!was)continue;
      var px=xx*cell,py=yy*cell;
      ctx.fillStyle=nr?"#1a2652":"#121a3b";ctx.fillRect(px,py,cell,cell);
      ctx.strokeStyle=nr?"#e8d9a8":"#5b6694";ctx.lineWidth=2;ctx.beginPath();
      var w=wl[yy][xx];
      if(w.n){ctx.moveTo(px,py);ctx.lineTo(px+cell,py);}
      if(w.s){ctx.moveTo(px,py+cell);ctx.lineTo(px+cell,py+cell);}
      if(w.w){ctx.moveTo(px,py);ctx.lineTo(px,py+cell);}
      if(w.e){ctx.moveTo(px+cell,py);ctx.lineTo(px+cell,py+cell);}
      ctx.stroke();
    }
    var exNear=near(EX.x,EX.y);
    if(lvl<3||(lvl===4)||exNear){
      var ex=EX.x*cell+cell*.2,ey=EX.y*cell+cell*.2,es=cell*.6;
      if(gotKey){ctx.fillStyle=exNear?"#3fc1b0":"rgba(63,193,176,.4)";ctx.fillRect(ex,ey,es,es);}
      else{ctx.strokeStyle=exNear?"#3fc1b0":"rgba(63,193,176,.4)";ctx.lineWidth=2;ctx.setLineDash([4,3]);ctx.strokeRect(ex,ey,es,es);ctx.setLineDash([]);}
    }
    if(KEY&&!gotKey&&near(KEY[0],KEY[1])){
      ctx.save();ctx.translate(KEY[0]*cell+cell/2,KEY[1]*cell+cell/2);ctx.rotate(.785);ctx.fillStyle="#f1d47a";ctx.fillRect(-cell*.18,-cell*.18,cell*.36,cell*.36);ctx.restore();
    }

    path.forEach(function(p){ctx.beginPath();ctx.arc(p[0]*cell+cell/2,p[1]*cell+cell/2,cell*.1,0,6.3);ctx.fill();});
    ctx.fillStyle="#e8b54a";ctx.beginPath();ctx.arc(P.x*cell+cell/2,P.y*cell+cell/2,cell*.3,0,6.3);ctx.fill();
  }

      if(!gotKey){ASND.bump();msg.className="msg bad";msg.textContent="هذا هو الباب، لكنه مغلق. ابحث عن المفتاح أولًا.";return;}

    }
  }
  var dp=h("div",{class:"dpad"});
  [["u","n","▲","أعلى"],["l","w","◀","يسار"],["dn","s","▼","أسفل"],["r","e","▶","يمين"]].forEach(function(a){
    var b=h("button",{type:"button",class:a[0],"aria-label":a[3],text:a[2]});b.addEventListener("click",function(){mv(a[1]);});dp.appendChild(b);
  });
  var sx=0,sy=0;
  cv.addEventListener("touchstart",function(e){var t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;},{passive:true});
  cv.addEventListener("touchend",function(e){var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;mv(Math.abs(dx)>Math.abs(dy)?(dx>0?"e":"w"):(dy>0?"s":"n"));},{passive:true});
  function key(e){var m={ArrowUp:"n",ArrowDown:"s",ArrowLeft:"w",ArrowRight:"e"}[e.key];if(m){e.preventDefault();mv(m);}}
  document.addEventListener("keydown",key);
  aCleanup=function(){document.removeEventListener("keydown",key);clearTimeout(pathTimer);};
  var hb=h("button",{type:"button",class:"sm",text:"💡 تلميح"});
  hb.addEventListener("click",function(){
    if(won)return;hints++;
    var tgt=gotKey?[EX.x,EX.y]:KEY,p=bfs([P.x,P.y],tgt).path,dx=tgt[0]-P.x,dy=tgt[1]-P.y,what=gotKey?"الخروج":"المفتاح";
    if(hints===1)hintFx(msg,"إشارة: "+what+" نحو "+(dy>0?"الأسفل":dy<0?"الأعلى":"")+(dx!==0&&dy!==0?" و":"")+(dx>0?"اليمين":dx<0?"اليسار":"")+"، لكن الطريق قد يلتفّ.");
    else if(hints===2){path=p.slice(0,6);hintFx(msg,"دليل: النقاط الخضراء تبيّن الخطوات القريبة.");draw();}
    else{path=p;hintFx(msg,"الطريق ظاهر لثوانٍ… احفظ مساره.");draw();clearTimeout(pathTimer);pathTimer=setTimeout(function(){path=[];draw();},4000);}
  });
  var nb=mkNew(function(){aMaze();},"🔄 متاهة جديدة",true);
  wrap.appendChild(h("p",{class:"note",style:"margin:0 0 8px",text:hasKey?"ابحث عن المفتاح (المربع الذهبي) ثم اذهب إلى الباب. حرّك بالسحب أو بالأزرار.":"حرّك اللاعب بالسحب على اللوحة أو بالأزرار. تذكّر ما كشفتَه."}));
  wrap.appendChild(cv);wrap.appendChild(stat);wrap.appendChild(msg);wrap.appendChild(dp);wrap.appendChild(h("div",{class:"row"},[hb,nb]));
  status();draw();

/* --- الشفرة: قيصر + مرآة --- */
var ALPHA="ابتثجحخدذرزسشصضطظعغفقكلمنهوي".split("");
function shiftTxt(s,n){return s.split("").map(function(ch){var i=ALPHA.indexOf(ch);return i<0?ch:ALPHA[((i+n)%28+28)%28];}).join("");}
function mirTxt(s){return s.split("").map(function(ch){var i=ALPHA.indexOf(ch);return i<0?ch:ALPHA[27-i];}).join("");}
var CPH=[
 [["العلم نور",1,"عبارة قصيرة عن العلم."],["الصبر مفتاح الفرج",3,"مثل مشهور عن الصبر."],["الوقت كالسيف",2,"مثل مشهور عن الوقت."],["الجار قبل الدار",4,"مثل مشهور عن الجار."]],
 [["من جد وجد",5,"مثل عن الجدّ والاجتهاد."],["خير الكلام ما قل ودل",7,"مثل عن الإيجاز."],["من زرع حصد",6,"مثل عن الزرع والحصاد."]],
 [["الاتقان سر النجاح والصبر مفتاحه",11,"عبارتان عن الإتقان والصبر."],["الصديق وقت الضيق",13,"مثل عن الصديق."],["العقل السليم في الجسم السليم",9,"قول مشهور عن الصحة."]],
 [["الصبر مفتاح الفرج",0,"المرآة: كل حرف يُستبدل بنظيره من آخر الأبجدية (الألف ↔ الياء)."],["العلم نور",0,"المرآة تقلب الأبجدية: الألف ↔ الياء، الباء ↔ الواو …"],["الوقت كالسيف",0,"فعّل المرآة ولا تغيّر الإزاحة."]],
 [["الاتقان سر النجاح والصبر مفتاحه",8,"شفرة مركّبة: مرآة ثم إزاحة. فعّل المرآة وجرّب الإزاحة."],["من جد وجد ومن زرع حصد",12,"مرآة وإزاحة معًا؛ ابدأ بتفعيل المرآة."],["العقل السليم في الجسم السليم",15,"مرآة وإزاحة؛ جرّبهما معًا."]]
];
function aCipher(lvl){lvl=lvl||curLvl("cipher");
  var wrap=aShell("الشفرة",aMenu);

  var sv=h("b",{text:"0"});

  function stp(n){return function(){if(done)return;s=((s+n)%28+28)%28;ASND.tap();upd();};}
  var pl=h("button",{type:"button","aria-label":"زيادة",text:"+"}),mi=h("button",{type:"button","aria-label":"إنقاص",text:"−"});

  ok.addEventListener("click",function(){

    else{wrong++;wrongFx(msg,wrap,wrong);}
  });
  var hb=h("button",{type:"button",class:"sm",text:"💡 تلميح"});
  hb.addEventListener("click",function(){
    if(done)return;
    if(hints===0){hints=1;hintFx(msg,"لا تقرأ الحروف الغريبة، بل حرّك القرص وراقب هل تظهر كلمات تعرفها.");}
    else if(hints===1){hints=2;hintFx(msg,P[2]);}

  wrap.appendChild(c1);
  wrap.appendChild(h("div",{class:"shift"},[mi,h("div",{style:"text-align:center"},[h("span",{class:"note",style:"display:block;margin:0",text:"الإزاحة"}),sv]),pl]));
  if(lvl>=4)wrap.appendChild(h("div",{class:"row"},[mb]));

/* --- الأنماط: مولِّدات بقواعد عشوائية --- */
var PG={
 arith:function(big){var up=RNG()<.6,d=rnd(2,big?12:7),a=up?rnd(1,20):rnd(40,90),sg=up?1:-1,s=[];for(var i=0;i<4;i++)s.push(a+sg*d*i);return {s:s,a:a+sg*d*4,h1:"انظر إلى الفرق بين كل رقمين متجاورين.",h2:"الفرق ثابت: "+(up?"+":"−")+d+"."};},
 geo:function(){var r=pick([2,3]),a=rnd(1,4),s=[];for(var i=0;i<4;i++)s.push(a*Math.pow(r,i));return {s:s,a:a*Math.pow(r,4),h1:"الفروق ليست ثابتة. قارن كل رقم بالذي قبله بالقسمة.",h2:"كل رقم = سابقه × "+r+"."};},
 grow:function(){var a=rnd(1,8),s=[a],d=1;for(var i=1;i<5;i++){s.push(s[i-1]+d);d++;}return {s:s,a:s[4]+5,h1:"الفروق نفسها تكوّن نمطًا.",h2:"الفروق: 1، 2، 3، 4 … فالتالي +5."};},
 fib:function(){var a=rnd(1,4),b=rnd(1,5),s=[a,b];for(var i=2;i<6;i++)s.push(s[i-1]+s[i-2]);return {s:s.slice(0,5),a:s[5],h1:"جرّب جمع رقمين متجاورين.",h2:"كل رقم = مجموع الرقمين اللذين قبله."};},

/* سودوكو */
function aSudoku(lvl){
  lvl=lvl||curLvl("sudoku");
  var wrap=aShell("سودوكو",aMenu);
  var cfg=[[4,2,2,6],[4,2,2,9],[6,2,3,14],[6,2,3,20],[9,3,3,40]][lvl-1],n=cfg[0],br=cfg[1],bc=cfg[2],rem=cfg[3];
  var g=[],i;for(i=0;i<n*n;i++)g[i]=0;
  function ok(p,v){var r=Math.floor(p/n),c=p%n,k;for(k=0;k<n;k++){if(g[r*n+k]===v||g[k*n+c]===v)return false;}var r0=r-r%br,c0=c-c%bc,rr,cc;for(rr=0;rr<br;rr++)for(cc=0;cc<bc;cc++)if(g[(r0+rr)*n+c0+cc]===v)return false;return true;}
  var steps=0;function fill(p){if(p===n*n)return true;if(++steps>60000)return false;var vs=[],k;for(k=1;k<=n;k++)vs.push(k);vs=shuffle(vs);for(k=0;k<vs.length;k++){if(ok(p,vs[k])){g[p]=vs[k];if(fill(p+1))return true;g[p]=0;}}return false;}
  var tries=0;do{for(i=0;i<n*n;i++)g[i]=0;steps=0;tries++;}while(!fill(0)&&tries<50);
  var sol=g.slice(),cur=sol.slice(),fixed=[],holes=shuffle(sol.map(function(_,k){return k;})).slice(0,rem);
  for(i=0;i<n*n;i++)fixed[i]=holes.indexOf(i)<0;
  holes.forEach(function(k){cur[k]=0;});
  var msg=h("div",{class:"msg","aria-live":"polite"}),wrong=0,hints=0,done=false,selc=-1;
  var W=Math.min(window.innerWidth-28,n===9?378:340),cs=Math.floor(W/n);
  var grid=h("div",{class:"sdk",style:"grid-template-columns:repeat("+n+","+cs+"px)"}),btns=[];
  function conflicts(){var bad={},k,r,c,m;for(k=0;k<n*n;k++){if(!cur[k])continue;r=Math.floor(k/n);c=k%n;for(m=0;m<n*n;m++){if(m===k||cur[m]!==cur[k])continue;var r2=Math.floor(m/n),c2=m%n;if(r2===r||c2===c||(Math.floor(r2/br)===Math.floor(r/br)&&Math.floor(c2/bc)===Math.floor(c/bc))){bad[k]=1;}}}return bad;}
  function paint(){var bad=conflicts();btns.forEach(function(b,k){b.textContent=cur[k]?String(cur[k]):"";b.className="sc"+(fixed[k]?" fx":"")+(k===selc?" sel":"")+(bad[k]?" bad":"")+(((Math.floor(Math.floor(k/n)/br)+Math.floor((k%n)/bc))%2)?" alt":"");});}
  for(i=0;i<n*n;i++){(function(k){var b=h("button",{type:"button","aria-label":"خانة "+(k+1)});b.style.cssText="width:"+cs+"px;height:"+cs+"px;font-size:"+Math.floor(cs*.55)+"px";b.addEventListener("click",function(){if(done||fixed[k])return;selc=k;ASND.tap();paint();});btns.push(b);grid.appendChild(b);})(i);}
  var pad=h("div",{class:"chips"});
  for(i=1;i<=n;i++){(function(v){var b=h("button",{type:"button",class:"chip",text:String(v)});b.addEventListener("click",function(){if(done||selc<0)return;cur[selc]=v;ASND.tick();paint();});pad.appendChild(b);})(i);}
  var er=h("button",{type:"button",class:"chip op",text:"⌫","aria-label":"مسح"});er.addEventListener("click",function(){if(done||selc<0)return;cur[selc]=0;ASND.tap();paint();});pad.appendChild(er);
  function check(){
    if(done)return;var bad=conflicts(),empty=cur.filter(function(v){return !v;}).length;
    if(Object.keys(bad).length){wrong++;wrongFx(msg,wrap,wrong);return;}
    if(empty){hintFx(msg,"لا تعارض حتى الآن، لكن بقيت "+empty+" خانات فارغة.");return;}
    done=true;var pts=award("sudoku"+lvl,lvl,hints,wrong,false);winFx(msg,pts,grid);
  }
  var ok2=h("button",{type:"button",class:"sm pri",text:"✔ تحقّق"});ok2.addEventListener("click",check);
  var hb=h("button",{type:"button",class:"sm",text:"💡 تلميح"});
  hb.addEventListener("click",function(){
    if(done)return;
    if(hints===0){hints=1;hintFx(msg,"كل صف وكل عمود وكل مربع صغير يحوي الأرقام من 1 إلى "+n+" مرة واحدة فقط. ابدأ بالصف الأكثر امتلاءً.");}
    else if(hints===1||wrong<3){hints=2;var e=cur.map(function(v,k){return v?-1:k;}).filter(function(k){return k>=0;});if(e.length){var k=pick(e);cur[k]=sol[k];fixed[k]=true;paint();}hintFx(msg,"كتبتُ لك رقمًا في إحدى الخانات.");}
    else{hints=3;done=true;for(var q=0;q<n*n;q++){cur[q]=sol[q];fixed[q]=true;}paint();var pts=award("sudoku"+lvl,lvl,hints,wrong,true);revealFx(msg,"هذا هو الحل. +"+pts+" عزيمة. جرّب لغزًا جديدًا.");}
  });
  var nb=mkNew(function(){aSudoku();},"🔄 لغز جديد");
  wrap.appendChild(h("p",{class:"note",style:"margin:0",text:"اضغط خانة فارغة ثم اختر الرقم. لا يتكرر رقم في صف ولا عمود ولا مربع."}));
  wrap.appendChild(grid);wrap.appendChild(pad);wrap.appendChild(msg);wrap.appendChild(h("div",{class:"row"},[hb,ok2,nb]));paint();
}

/* كاسر الشفرة (ماستر مايند) */
function aCode(lvl){
  lvl=lvl||curLvl("code");
  var wrap=aShell("كاسر الشفرة",aMenu);
  var cfg=[[3,5,false,8],[4,6,false,10],[4,6,true,10],[5,7,false,12],[5,8,true,12]][lvl-1],len=cfg[0],mx=cfg[1],rep=cfg[2],maxG=cfg[3];
  var pool=[],i;for(i=1;i<=mx;i++)pool.push(i);
  var secret=[];if(rep){for(i=0;i<len;i++)secret.push(pick(pool));}else secret=shuffle(pool).slice(0,len);
  var guess=[],tries=0,hints=0,done=false,known=[];
  var msg=h("div",{class:"msg","aria-live":"polite"}),hist=h("div",{class:"hist"}),slots=h("div",{class:"eq",style:"margin:10px 0"});
  function drawSlots(){while(slots.firstChild)slots.removeChild(slots.firstChild);for(var k=0;k<len;k++){var s=h("i",{class:"cs",text:guess[k]!==undefined?String(guess[k]):(known[k]!==undefined?"·"+known[k]:"؟")});slots.appendChild(s);}}
  var pad=h("div",{class:"chips"});
  pool.forEach(function(v){var b=h("button",{type:"button",class:"chip",text:String(v)});b.addEventListener("click",function(){if(done||guess.length>=len)return;guess.push(v);ASND.tap();drawSlots();});pad.appendChild(b);});
  var bk=h("button",{type:"button",class:"chip op",text:"⌫","aria-label":"حذف"});bk.addEventListener("click",function(){if(done)return;guess.pop();ASND.tap();drawSlots();});pad.appendChild(bk);
  function score(g){var ex=0,cm=0,sc={},gc={},k;for(k=0;k<len;k++){if(g[k]===secret[k])ex++;else{sc[secret[k]]=(sc[secret[k]]||0)+1;gc[g[k]]=(gc[g[k]]||0)+1;}}for(k in gc)cm+=Math.min(gc[k],sc[k]||0);return [ex,cm];}
  function submit(){
    if(done)return;if(guess.length<len){hintFx(msg,"أكمل خانات التخمين أولًا ("+len+" أرقام).");return;}
    tries++;var r=score(guess);
    hist.insertBefore(h("div",{class:"hrow",dir:"ltr"},[h("span",{class:"hg",text:guess.join(" ")}),h("span",{class:"hs",text:"● "+r[0]+"   ○ "+r[1]})]),hist.firstChild);
    if(r[0]===len){done=true;var pts=award("code"+lvl,lvl,hints,Math.max(0,3-Math.floor(tries/3)),false);winFx(msg,pts,slots);msg.textContent+=" بعد "+tries+" محاولات.";}
    else if(tries>=maxG){done=true;var pts2=award("code"+lvl,lvl,hints,0,true);revealFx(msg,"انتهت المحاولات. الشفرة كانت: "+secret.join(" ")+". +"+pts2+" عزيمة. كل محاولة علّمتك شيئًا.");}
    else{msg.className="msg";msg.textContent="● رقم صحيح في مكانه، ○ رقم صحيح في غير مكانه. تبقّى "+(maxG-tries)+" محاولات.";if(r[0]===0&&r[1]===0)ASND.wrong();else ASND.ok();}
    guess=[];drawSlots();
  }
  var ok2=h("button",{type:"button",class:"sm pri",text:"✔ جرّب"});ok2.addEventListener("click",submit);
  var hb=h("button",{type:"button",class:"sm",text:"💡 تلميح"});
  hb.addEventListener("click",function(){
    if(done)return;
    if(hints===0){hints=1;var miss=pool.filter(function(v){return secret.indexOf(v)<0;});hintFx(msg,miss.length?"الرقم "+pick(miss)+" غير موجود في الشفرة.":"كل الأرقام المعروضة مستعملة في الشفرة.");}
    else if(hints===1){hints=2;var p=rnd(0,len-1);known[p]=secret[p];hintFx(msg,"الخانة رقم "+(p+1)+" في الشفرة هي "+secret[p]+".");drawSlots();}
    else if(tries>=3){hints=3;done=true;var pts3=award("code"+lvl,lvl,hints,0,true);revealFx(msg,"الشفرة: "+secret.join(" ")+". +"+pts3+" عزيمة.");}
    else hintFx(msg,"جرّب ثلاث محاولات على الأقل ليظهر الحل.");
  });

/* --- أسئلة سريعة للمسابقات --- */
function quickQ(d){
  var t=d<2?0:pick(d<5?[0,1,2]:[1,2,3]),a,b,c;
  if(t===0){a=rnd(3,12+d*3);b=rnd(2,9+d*2);if(RNG()<.5)return {q:a+" + "+b+" = ؟",a:a+b};if(b>a){c=a;a=b;b=c;}return {q:a+" − "+b+" = ؟",a:a-b};}
  if(t===1){a=rnd(2,6+Math.min(d,6));b=rnd(2,9+Math.min(d,4));return {q:a+" × "+b+" = ؟",a:a*b};}
  if(t===2){var pool=[PG.arith,PG.geo,PG.grow,PG.fib,PG.sqk,PG.quad],S=pool[rnd(0,Math.min(pool.length-1,Math.floor(d/2)))]();return {q:S.s.join(" ،  ")+" ،  ؟",a:S.a};}
  a=rnd(2,9);b=rnd(2,9);c=rnd(2,6);if(RNG()<.5)return {q:"( "+a+" + "+b+" ) × "+c+" = ؟",a:(a+b)*c};return {q:a+" × "+b+" − "+c+" = ؟",a:a*b-c};
}
function qUI(wrap,onSubmit){

  var ok2=h("button",{type:"button",class:"sm pri",text:"✔"}),cur=null,msg=h("div",{class:"msg","aria-live":"polite"});
  function submit(){if(!cur)return;var v=parseInt(inp.value.replace(/[٠-٩]/g,function(d){return "٠١٢٣٤٥٦٧٨٩".indexOf(d);}),10);if(isNaN(v))return;var q=cur;inp.value="";onSubmit(v===q.a,q);}
  inp.addEventListener("keydown",function(e){if(e.key==="Enter")submit();});ok2.addEventListener("click",submit);
  var row=h("div",{class:"row"},[ok2]);
  wrap.appendChild(qd);wrap.appendChild(inp);wrap.appendChild(row);wrap.appendChild(msg);
  return {show:function(q){cur=q;qd.textContent=q.q;try{inp.focus();}catch(e){}},msg:msg,stop:function(){cur=null;inp.disabled=true;ok2.disabled=true;},box:qd,input:inp};
