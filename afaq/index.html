<style>
:root{--bg:#0b1020;--card:#171f3a;--line:#2b376a;--tx:#f3eee2;--mu:#aab1c8;--gold:#e8b54a;--teal:#3fc1b0;--rose:#e8788a;--ok:#5fcf8a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",system-ui,sans-serif;line-height:1.7;font-size:16px;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
/* الردهة */
#hub{min-height:100dvh;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
#hub h1{font-size:1.5rem;color:var(--gold);text-align:center}
#hub .sub{color:var(--mu);text-align:center;font-size:.92rem;margin:4px 0 16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}

.door{position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card);text-align:right;display:block;width:100%;aspect-ratio:9/14}
.door img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.door .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(5,8,18,.95) 0%,rgba(5,8,18,.2) 55%,transparent 100%)}
.door .tx{position:absolute;inset:auto 0 0 0;padding:10px 12px}
.door b{display:block;font-size:1.05rem}
.door span{display:block;font-size:.75rem;color:var(--mu);line-height:1.4}
.door .done{position:absolute;top:8px;left:8px;background:var(--ok);color:#06210f;border-radius:999px;font-size:.7rem;font-weight:800;padding:1px 9px}
.note{margin-top:18px;font-size:.8rem;color:var(--mu);text-align:center}
/* المسرح */
#stage{position:fixed;inset:0;background:#000;display:none;z-index:10;overflow:hidden}
#stage.on{display:block}
.layer{position:absolute;inset:0}
.layer img,.layer video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#0b1020}
.pan img{animation:pan 22s ease-in-out infinite alternate}
@keyframes pan{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.2) translate(-3%,-2%)}}

.veil{position:absolute;inset:0;background:linear-gradient(to top,rgba(4,6,14,.92) 0%,rgba(4,6,14,.35) 45%,rgba(4,6,14,.25) 100%);pointer-events:none}
.top{position:absolute;top:0;inset-inline:0;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 8px;z-index:3}
.ib{width:42px;height:42px;border-radius:999px;background:rgba(10,14,30,.6);border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;font-size:1.1rem}
.dots{flex:1;display:flex;gap:6px;justify-content:center}
.dots i{width:28px;height:5px;border-radius:9px;background:rgba(255,255,255,.3)}
.dots i.on{background:var(--gold)}
.dots i.d{background:var(--teal)}
.panel.scroll{max-height:82dvh;overflow-y:auto}
.panel{position:absolute;inset-inline:0;bottom:0;z-index:3;padding:14px 16px calc(18px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.who{display:flex;gap:10px;align-items:flex-end}

.opts{display:flex;flex-direction:column;gap:8px}

.load{position:absolute;inset:0;display:grid;place-items:center;z-index:2;color:var(--mu);background:rgba(8,12,26,.7)}
.skip{position:absolute;z-index:4;inset-inline-start:14px;bottom:calc(16px + env(safe-area-inset-bottom));background:rgba(10,14,30,.7);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 16px;font-size:.9rem}

.vtap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;padding:14px 22px;border:0;border-radius:999px;background:rgba(255,255,255,.92);color:#0b1020;font:600 16px system-ui,sans-serif}
.earth{transform-origin:50% 60%}
.real{position:absolute;top:calc(58px + env(safe-area-inset-top));inset-inline-start:12px;width:min(54vw,236px);z-index:4;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.35);background:#000;box-shadow:0 6px 20px rgba(0,0,0,.45)}

/* ساحة الألغاز */

#ans{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0e1530;color:var(--tx);font-size:1.25rem;text-align:center;direction:ltr}

.pt{position:fixed;width:9px;height:9px;border-radius:50%;z-index:30;pointer-events:none;transition:transform .8s cubic-bezier(.2,.7,.3,1),opacity .8s ease-out;opacity:1}

/* رحلة الراوي (nr) */
.nrnar{border-right:3px solid #d6b25e;background:rgba(214,178,94,.07);border-radius:0 12px 12px 0;padding:10px 14px;margin:8px 0 12px}
.nrnar p{margin:0 0 6px;line-height:1.9;font-size:.98rem}.nrnar p:last-child{margin:0}
.nrsvg{max-width:340px;margin:6px auto;background:#0e1530;border:1px solid var(--line);border-radius:14px;padding:4px}
.nrsvg svg{width:100%;height:auto;display:block}
.nrgauge{position:relative;height:14px;border-radius:8px;background:rgba(255,255,255,.12);margin:12px 0 4px;overflow:hidden;direction:ltr}
.nrgauge i{display:block;height:100%;background:linear-gradient(to right,#3fc1b0,#d6b25e)}
.nrgauge b{position:absolute;top:0;bottom:0;width:3px;background:#fff}
.nrread{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;color:var(--mu);margin:4px 0}.nrread span{color:var(--gold);font-weight:700}
.nrcam g.nrc{cursor:pointer}.nrcam g.nrc:focus{outline:none}.nrcam g.nrc:focus rect.nrhit{stroke:#fff}
.nrst{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0;font-size:1.08rem;line-height:2;text-align:center}
.nrcount{font-size:.8rem;color:var(--mu);text-align:center}
.nrwhy{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:.92rem;line-height:1.9}
.nrtag{display:inline-block;border-radius:999px;padding:0 10px;font-size:.78rem;font-weight:800;margin-left:6px}
.nrtag.t{background:#5fcf8a;color:#06210f}.nrtag.i{background:#e8788a;color:#2a0710}.nrtag.u{background:#e8b54a;color:#2a1c00}
.nrwhy small{display:block;color:var(--mu);margin-top:4px}
.nrtl{list-style:none;margin:8px 0;padding:0 14px 0 0;border-right:2px solid #d6b25e}
.nrtl li{position:relative;padding:6px 14px 6px 0;line-height:1.7}
.nrtl li::before{content:"";position:absolute;right:-8px;top:14px;width:12px;height:12px;border-radius:50%;background:#d6b25e}
.nrtl li b{display:block}.nrtl li span{font-size:.82rem;color:var(--teal)}
/* دروب الرحّالة (ex) */
.exmapw,.exroutew{max-width:420px;margin:6px auto;background:#141a33;border:1px solid var(--line);border-radius:14px;padding:6px}
.exmap,.exroute{width:100%;height:auto;display:block;direction:ltr}
.exlm{cursor:pointer;outline:none}.exlm:focus rect{stroke:#fff;stroke-width:1.5}
.exring{stroke:#fff;stroke-width:3;stroke-dasharray:5 4;animation:exp 1s ease-in-out infinite}
@keyframes exp{50%{opacity:.35}}
.exleg{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;margin:4px 0}
.exli{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 10px 2px 8px;font-size:.82rem}
.exq{font-size:1.02rem;line-height:1.8;margin:6px 0 8px;font-weight:700}
.exedge{stroke:#5a679c;stroke-width:3;stroke-linecap:round}.exedge.on{stroke:#e8b54a;stroke-width:5}
.exwbg{fill:#10162c;stroke:#3a4778;stroke-width:1}.exw{font-size:12px;font-weight:800;fill:#f3eee2}
.exnode{cursor:pointer;outline:none}.exdot{fill:#2b376a;stroke:#aab1c8;stroke-width:2}
.exdot.st{stroke:#e8b54a;stroke-width:3}.exdot.ds{stroke:#3fc1b0;stroke-width:3}
.exnode.on .exdot{fill:#e8b54a}.exnode.cur .exdot{fill:#fff}.exnode:focus .exdot{stroke:#fff}
.exnode.exhint .exdot{stroke:#5fcf8a;stroke-width:5;animation:exp 1s ease-in-out infinite}
.exnm{font-size:11px;fill:#f3eee2;font-weight:700;stroke:#141a33;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
.exbud{display:flex;justify-content:space-between;gap:8px;font-size:.92rem;color:var(--gold);margin:8px 0 0;font-weight:700}
.exbagtop{margin:0}
.exbag{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}
.exitem{display:flex;flex-direction:column;gap:2px;text-align:right;padding:10px 12px;border-radius:14px;background:rgba(23,31,58,.94);border:1px solid var(--line);min-height:62px}
.exitem b{font-size:.98rem}.exitem span,.exitem small{font-size:.76rem;color:var(--mu)}.exitem small{color:var(--teal)}
.exitem.pick{border-color:var(--gold);background:rgba(232,181,74,.16)}
.exchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.exchip{font-size:.74rem;border:1px solid var(--teal);color:var(--teal);border-radius:999px;padding:1px 10px}
.exst{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:8px 0}
/* مكتب المحقق (dt) */
.dt-plot{background:var(--card);border:1px solid var(--line);border-right:3px solid #d6b25e;border-radius:14px;padding:10px 12px;margin:4px 0 8px}
.dt-plot p{margin:6px 0 0;line-height:1.8;font-size:.92rem}
.dt-tag{display:inline-block;font-size:.72rem;font-weight:800;background:#d6b25e;color:#1a1405;border-radius:999px;padding:0 10px}
.dt-moral{margin:10px 0 2px;padding:10px 12px;border-radius:12px;background:rgba(95,207,138,.1);border:1px solid var(--ok);line-height:1.8;font-size:.9rem}
.dt-clues{margin:6px 0 10px}
.dt-clues .st{line-height:1.7;font-size:.9rem;padding:7px 10px;margin:4px 0}
.dt-clues .st.dt-ok{border-color:var(--ok);background:rgba(95,207,138,.1)}
.dt-clues .st.dt-liar{border-color:var(--rose);background:rgba(232,120,138,.12)}
/* شبكة المنطق */
.dt-gridw{display:grid;gap:4px;direction:rtl;margin:8px 0;align-items:stretch}
.dt-gh{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.7rem;color:var(--mu);min-width:0;text-align:center;line-height:1.3}
.dt-gh i{font-style:normal;font-size:1.15rem}
.dt-gh small{font-size:.62rem;color:var(--tx);white-space:nowrap}
.dt-grp{color:#d6b25e;font-weight:800;border-bottom:1px solid var(--line);padding-bottom:2px;font-size:.74rem}
.dt-gh.dt-row{align-items:flex-start;font-size:.82rem;color:var(--tx);font-weight:700;padding-inline-start:2px}
.dt-c{min-height:44px;border-radius:10px;border:1px solid var(--line);background:#0e1530;color:var(--tx);font-size:1.15rem;font-weight:800;padding:0}
.dt-c.n{color:var(--rose);background:rgba(232,120,138,.1);border-color:rgba(232,120,138,.5)}
.dt-c.a{color:rgba(232,120,138,.4)}
.dt-c.y{color:var(--ok);background:rgba(95,207,138,.14);border-color:var(--ok)}
.dt-c.flash{animation:dtfl .9s ease 2}
@keyframes dtfl{50%{box-shadow:0 0 0 3px #d6b25e}}
/* البصمة */
.dt-cmp{display:flex;gap:8px;margin:6px 0}
.dt-cmp figure{flex:1;margin:0;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;text-align:center}
.dt-cmp figcaption{font-size:.78rem;color:#d6b25e;font-weight:800;margin-bottom:4px}
.dt-pan{width:100%}
.dt-pr{width:100%;height:auto;display:block}
.dt-mk{animation:dtmk 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dtmk{50%{transform:scale(1.35);opacity:.6}}
.dt-th{display:flex;gap:8px;margin:6px 0}
.dt-t{flex:1;min-width:0;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem}
.dt-t svg{width:100%;height:auto;display:block}
.dt-t.sel{border-color:#d6b25e}
.dt-t.off{opacity:.45}
.dt-t[disabled]:not(.off){opacity:.7}
/* تسلسل الأدلة */
.dt-cap{font-size:.76rem;color:var(--mu);text-align:center;margin:6px 0 2px}
.dt-slots{display:flex;gap:6px;direction:rtl;margin:4px 0 8px}
.dt-sl{flex:1;min-width:0;aspect-ratio:1/1;max-height:72px;border-radius:12px;border:2px dashed #d6b25e;background:rgba(214,178,94,.07);color:#d6b25e;font-size:1.1rem;padding:2px;display:flex;align-items:center;justify-content:center}
.dt-sl.f{border-style:solid;background:#0e1530}
.dt-sl svg{width:100%;height:100%}
.dt-pool{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;direction:rtl}
.dt-sc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;line-height:1.4}
.dt-sc svg{width:56px;height:56px}
.dt-sc.u,.dt-sc[disabled]{opacity:.4}
@media (prefers-reduced-motion:reduce){.dt-mk,.dt-c.flash{animation:none}}
/* بيت الحكمة: الرازي وجابر (bb) */
.bbbox{margin:6px 0}
.bbcase{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0 6px}.bbcase b{color:var(--gold)}
.bbtag{display:inline-block;border-radius:999px;padding:0 10px;font-size:.78rem;font-weight:800}
.bbtag.u{background:#e8b54a;color:#2a1c00}
.bbtabw{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin:6px 0}
.bbtabw>b{display:block;color:var(--gold);font-size:.9rem;margin-bottom:6px}
.bbtabw small{display:block;color:var(--mu);font-size:.74rem;line-height:1.6;margin-top:4px}
.bbtab{display:grid;grid-template-columns:1fr 1.2fr 1.2fr;gap:4px}
.bbtab span{background:rgba(255,255,255,.05);border-radius:8px;padding:3px 6px;font-size:.78rem;line-height:1.45}
.bbtab span.hd{background:rgba(232,181,74,.18);color:var(--gold);font-weight:800}
.bbobs{list-style:none;margin:6px 0;padding:0 14px 0 0;border-right:2px solid var(--gold)}
.bbobs li{padding:6px 10px 8px 0;line-height:1.7}
.bbobs li b{display:block;color:var(--teal);font-size:.85rem}
.bbobs li span{display:block;font-size:.97rem}
.bbobs li span::before{content:"• ";color:var(--gold)}
.bbnar{border-right:3px solid #d6b25e;background:rgba(214,178,94,.07);border-radius:0 12px 12px 0;padding:10px 14px;margin:8px 0;line-height:1.9;font-size:.95rem}
.bbmeats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.bbmeat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.bbmeat b{display:block;font-size:.9rem;margin-bottom:6px}.bbmeat small{display:block;min-height:2.4em;color:var(--mu);font-size:.8rem;line-height:1.4;margin:4px 0}
.bbmeat button{width:100%}
.bbbar{height:12px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden;direction:ltr;margin:4px 0 8px}
.bbbar i{display:block;height:100%;width:0;background:linear-gradient(to right,#3fc1b0,#5fcf8a);transition:width .25s}
.bbmeat .bbbar i,.bbbar.red i{background:linear-gradient(to right,#e8b54a,#e8788a)}
.bbapp{display:grid;gap:8px;margin:8px 0}
.bbslot{text-align:right;background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:10px 14px;color:inherit}
.bbslot b{display:block;color:var(--gold)}.bbslot span{display:block;font-size:.88rem;color:var(--mu);line-height:1.6}
.bbslot.sel{border-color:var(--gold);background:rgba(232,181,74,.1)}
.bbslot.ok{border:2px solid var(--ok);border-style:solid;background:rgba(95,207,138,.1)}
.bbparts .opt.sel{border-color:var(--gold);background:rgba(232,181,74,.15)}
.bbscale{position:relative;height:16px;border-radius:8px;background:rgba(255,255,255,.1);margin:6px 0 0;overflow:hidden}
.bbscale .band{position:absolute;top:0;bottom:0;background:rgba(232,181,74,.55);border-radius:6px;transition:opacity .3s}.bbscale .band.off{opacity:0}
.bbscale .mark{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:#fff;border-radius:2px}
.bbl{display:block;color:var(--mu);font-size:.8rem;margin-top:6px}
.bbst{min-height:2.4em;color:var(--teal);font-size:.95rem;line-height:1.6;margin:6px 0}
/* بيت الحكمة: محطتا bc */
.bc-head{display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line);border-right:3px solid #d6b25e;border-radius:14px;padding:10px 12px;margin:6px 0}
.bc-head b{color:#d6b25e;font-size:1.05rem}.bc-head span{font-size:.82rem;color:var(--mu)}
.bc-stat{background:#0e1530;border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin:6px 0}
.bc-stat p{margin:5px 0;line-height:1.7;font-size:.9rem}
.bc-obs{color:var(--mu)}.bc-mean{color:#d6b25e;font-weight:700}
.bc-bar{height:8px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden;margin:8px 0 4px}
.bc-bar i{display:block;height:100%;width:0;background:linear-gradient(to left,var(--gold),var(--teal));transition:width .25s}
.bc-res{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin:6px 0}
.bc-res p{margin:5px 0;line-height:1.7;font-size:.92rem}.bc-diff{color:var(--teal)}
.bc-cav{font-size:.8rem;color:var(--mu);line-height:1.7}
.bc-two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.bc-col{display:flex;flex-direction:column;gap:8px}
.bc-it{text-align:center;font-size:.92rem;padding:12px 8px;min-height:52px}
.bc-it.bc-ok{border-color:var(--ok);background:rgba(95,207,138,.12);opacity:1}
.bc-logs{margin:6px 0}
.bc-log{background:var(--card);border:1px solid var(--line);border-right:3px solid var(--ok);border-radius:12px;padding:8px 12px;margin:6px 0;font-size:.85rem;line-height:1.8}
.bc-q{line-height:1.9;font-size:1rem;margin:8px 0}
.bc-exp{background:rgba(95,207,138,.1);border:1px solid var(--ok);border-radius:12px;padding:8px 12px;margin:8px 0;font-size:.9rem;line-height:1.8}
/* بيت الحكمة: الخوارزمي والكندي (ba) */
.bacnt{font-size:.82rem;color:var(--mu);text-align:center;margin:6px 0 4px;line-height:1.7}
.baeq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0;text-align:center;font-size:1rem;line-height:1.8;color:var(--gold);direction:rtl}
.basc{max-width:380px;margin:6px auto 0}
.basc .bad{display:block;line-height:0}.bakdeco{width:100%;height:auto;display:block}
.babeam{transform-box:fill-box;transform-origin:center}
.basc.wob .babeam{animation:bawob .5s ease}
@keyframes bawob{0%{transform:rotate(0)}30%{transform:rotate(-3deg)}65%{transform:rotate(2deg)}100%{transform:rotate(0)}}
.bapans{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:-4px}
.bapan{min-height:128px;border:2px solid var(--line);border-top:0;border-radius:0 0 70px 70px/0 0 34px 34px;background:rgba(43,55,106,.28);padding:8px 6px 14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px}
.baempty{color:var(--mu);font-size:.8rem;opacity:.7;padding:20px 0}
.bag{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 8px;min-width:84px;min-height:58px;border-radius:12px;border:2px solid transparent;background:rgba(10,14,30,.45);color:var(--tx)}
.bag.sel{border-color:var(--gold);background:rgba(232,181,74,.14)}
.bag.hl{box-shadow:0 0 0 3px var(--teal)}
.bag[disabled]{opacity:1;cursor:default}
.bavis{display:flex;gap:4px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:30px}
.bal{font-size:.78rem;color:var(--mu)}
.baq{font-style:normal;display:inline-grid;place-items:center;width:28px;height:30px;border-radius:12px 12px 9px 9px;background:#a97b3a;border:2px solid #5c3f12;color:#fff;font-weight:800;font-size:1rem}
.baz{font-style:normal;display:inline-grid;place-items:center;min-width:38px;height:28px;padding:0 6px;border-radius:5px;background:#4fd1a5;border:2px solid #1d6e55;color:#06210f;font-weight:800;font-size:1.05rem}
.bax{font-style:normal;font-weight:800;color:var(--gold);font-size:.9rem}
.bag.neg .baq{background:transparent;border:2px dashed #e8788a;color:#e8788a}
.bag.neg .baz{background:transparent;border:2px dashed #e8788a;color:#e8788a}
.bag.neg .bal{color:#e8788a}
.balog{list-style:decimal;margin:8px 0 0;padding:0 24px;font-size:.88rem;line-height:1.8;color:var(--mu)}
.bachk{font-size:.9rem;line-height:1.8;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0}
.row .sm[disabled]{opacity:.45}
/* الكندي */
.bakq{margin-top:6px}
.bat{display:flex;flex-wrap:wrap;gap:10px 12px;justify-content:flex-start;margin:10px 0;direction:rtl}
.baw2{display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px;border-radius:10px;border:1px solid transparent}
.baw2.hl{animation:bahl 1.6s ease}
@keyframes bahl{0%,100%{border-color:transparent}20%,70%{border-color:var(--teal);background:rgba(63,193,176,.12)}}
.bacells{display:flex;gap:2px;direction:rtl}
.bacell{display:flex;flex-direction:column;align-items:center;justify-content:center;width:25px;min-height:44px;border-radius:7px;background:rgba(23,31,58,.94);border:1px solid var(--line);padding:2px 0;gap:1px}
.bacell .bas{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;font-size:.88rem;color:var(--mu);line-height:1.1}
.bacell .bap{font-size:1.05rem;min-height:1.5rem;color:var(--mu);line-height:1.5}
.bacell.sel{border-color:var(--gold);background:rgba(232,181,74,.18)}
.bacell.sel .bas{color:var(--gold)}
.bacell.ok{border-color:var(--ok);background:rgba(95,207,138,.1)}
.bacell.ok .bas{color:var(--mu);opacity:.6}.bacell.ok .bap{color:var(--ok);font-weight:700}
.baj{font-size:1rem;min-height:1.7rem;line-height:1.7;color:var(--gold);font-weight:700}
.bah{margin:8px 0 4px}
.babars{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-start;direction:rtl;margin:4px 0}
.babar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:31px;padding:3px 0;border-radius:8px;border:1px solid transparent;gap:2px}
.babar .bac{font-size:.7rem;color:var(--mu);line-height:1}
.babar .baba{display:block;width:16px;border-radius:3px 3px 0 0;background:#8fbcd4}
.babar .bas{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;font-size:.85rem;line-height:1.1}
.babar .bap{font-size:.95rem;color:var(--mu);min-height:1.3rem;line-height:1.3}
.babar.sel{border-color:var(--gold);background:rgba(232,181,74,.14)}
.babar.ok .baba{background:var(--ok)}.babar.ok .bap{color:var(--ok);font-weight:700}
.bareff{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.85rem;color:var(--mu);margin:6px 0}
.bareff .bar1{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:7px;border:1px solid var(--line);color:var(--gold);font-size:1rem}
.bakeys{position:sticky;bottom:-24px;z-index:2;background:var(--bg);border-top:1px solid var(--line);padding:6px 0 26px;margin-top:6px}
.bakb{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;direction:rtl}
.bak{height:37px;border-radius:9px;background:var(--card);border:1px solid var(--line);font-size:1.15rem}
.bak:disabled{opacity:.3}.bak.used{opacity:.3;text-decoration:line-through}
.baplain{font-size:1.1rem;line-height:2;color:var(--tx)}

.bamr{display:flex;gap:8px;align-items:center;margin-bottom:6px}.bamr .msg{flex:1;margin:0;min-height:2.6em;font-size:.88rem;line-height:1.5}
.bahb{flex:0 0 auto;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05)}
.liblist{display:flex;flex-direction:column;gap:8px;margin:10px 0}.libitem{display:block;text-align:right;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.04)}
.libitem b{display:block;color:var(--gold)}.libitem span{font-size:.8rem;opacity:.75}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chips .chip.on{background:var(--gold);color:#1a1405}

.stctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}.strate{background:#101a2a;color:inherit;border:1px solid var(--line);border-radius:10px;padding:6px}

function playNarr(key,cb){ // cb: {end(), fail(), blocked()}
  stopNarr();
  var url=B+AUD[key]+".mp3";
  function start(withFx){
    var a=new Audio();a.preload="auto";if(withFx)a.crossOrigin="anonymous";a.src=url;a.muted=S.muted;N.a=a;
    var ok=false;
    if(withFx){
      try{
        var Ctx=window.AudioContext||window.webkitAudioContext;
        if(Ctx){
          var ctx=new Ctx();N.ctx=ctx;
          var src=ctx.createMediaElementSource(a);
          var dry=ctx.createGain();dry.gain.value=0.9;
          var conv=ctx.createConvolver();conv.buffer=makeIR(ctx);
          var wet=ctx.createGain();wet.gain.value=0.3;
          var dl=ctx.createDelay(1);dl.delayTime.value=0.26;
          var fb=ctx.createGain();fb.gain.value=0.28;
          var eo=ctx.createGain();eo.gain.value=0.2;
          src.connect(dry);dry.connect(ctx.destination);
          src.connect(conv);conv.connect(wet);wet.connect(ctx.destination);
          src.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(eo);eo.connect(ctx.destination);
          ok=true;
        }
      }catch(e){ok=false;}
    }
    a.onended=function(){cb.end();};
    a.onerror=function(){
      if(withFx){stopNarr();start(false);}else{cb.fail();}
    };
    var pr=a.play();
    if(N.ctx&&N.ctx.state==="suspended")N.ctx.resume();
    if(pr&&pr.catch)pr.catch(function(){if(N.a===a)cb.blocked();});
  }

}

/* ===== مؤثرات صوتية مولَّدة داخل التطبيق (بلا موسيقى ولا ملفات) ===== */
var SFX=(function(){
  var ctx=null,master=null,nb=null,voices=[],ambV=null,K=1;
  function init(){
    if(ctx)return ctx.state!=="closed";
    try{
      var C=window.AudioContext||window.webkitAudioContext;if(!C)return false;
      ctx=new C();master=ctx.createGain();master.gain.value=S.muted?0:1;var cp=ctx.createDynamicsCompressor();master.connect(cp);cp.connect(ctx.destination);
      var n=ctx.sampleRate*2,b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0),l=0;
      for(var i=0;i<n;i++){var w=Math.random()*2-1;l=(l+0.02*w)/1.02;d[i]=l*11;} // ضجيج بني
      nb=b;
    }catch(e){ctx=null;return false;}
    return true;
  }
  function wake(){if(ctx&&ctx.state==="suspended")try{ctx.resume();}catch(e){}}
  function noise(){var s=ctx.createBufferSource();s.buffer=nb;s.loop=true;return s;}
  function env(g,t,pts){g.gain.setValueAtTime(pts[0][1],t+pts[0][0]*K);for(var i=1;i<pts.length;i++)g.gain.linearRampToValueAtTime(pts[i][1],t+pts[i][0]*K);}
  // دوي مستمر منخفض (محرك/مقصورة)
  function rumble(dur,pts,freq){dur*=K;
    var t=ctx.currentTime,s=noise(),f=ctx.createBiquadFilter(),g=ctx.createGain();
    f.type="lowpass";f.frequency.value=freq||180;g.gain.value=0;
    env(g,t,pts);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+0.5);
    voices.push(g);return g;
  }
  // اهتزاز دون-صوتي خفيف
  function sub(dur,vol){dur*=K;
    var t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
    o.type="sine";o.frequency.setValueAtTime(38,t);o.frequency.linearRampToValueAtTime(58,t+dur);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+dur*0.6);g.gain.linearRampToValueAtTime(0,t+dur);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.1);voices.push(g);
  }
  // مرور سريع (whoosh)
  function whoosh(at,dur,f0,f1,vol){at*=K;dur*=K;
    var t=ctx.currentTime+at,s=noise(),f=ctx.createBiquadFilter(),g=ctx.createGain();
    f.type="bandpass";f.Q.value=0.9;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+dur*0.4);g.gain.linearRampToValueAtTime(0,t+dur);
    s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+0.1);
  }
  // فحيح باب/ضغط هواء
  function hiss(at,dur,vol){at*=K;dur*=K;
    var t=ctx.currentTime+at,s=noise(),f=ctx.createBiquadFilter(),g=ctx.createGain();
    f.type="highpass";f.frequency.value=2200;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.05);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+0.1);
  }
  // طرقة/إغلاق معدني
  function thud(at,vol){at*=K;
    var t=ctx.currentTime+at,o=ctx.createOscillator(),g=ctx.createGain();
    o.type="sine";o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(40,t+0.18);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.22);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+0.25);
    var s=noise(),f=ctx.createBiquadFilter(),g2=ctx.createGain();f.type="bandpass";f.frequency.value=900;
    g2.gain.setValueAtTime(vol*0.5,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.08);
    s.connect(f);f.connect(g2);g2.connect(master);s.start(t);s.stop(t+0.1);
  }
  // نبرة لوحة التحكم
  function beep(at,f,vol){at*=K;
    var t=ctx.currentTime+at,o=ctx.createOscillator(),g=ctx.createGain();
    o.type="sine";o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.001,t+0.14);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+0.16);
  }
  function fadeVoices(sec){
    var t=ctx.currentTime;
    voices.forEach(function(g){try{g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(g.gain.value,t);g.gain.linearRampToValueAtTime(0,t+sec);}catch(e){}});
    voices=[];
  }
  var CUES=[
    function(){fadeVoices(0.3);thud(0.1,0.5);hiss(0.4,1.2,0.12);thud(2.2,0.35);rumble(5,[[0,0],[1.5,0.05],[5,0.1]],140);},                       // 1 الصعود
    function(){fadeVoices(0.5);rumble(5.2,[[0,0.1],[3,0.35],[5,0.6]],200);sub(5,0.35);whoosh(3.2,1.8,300,1800,0.2);},                           // 2 انطلاق المركبة
    function(){fadeVoices(0.4);rumble(5.2,[[0,0.6],[2,0.75],[5,0.55]],260);sub(5,0.3);whoosh(0.8,1.6,400,2600,0.35);whoosh(3.3,1.7,2400,500,0.3);}, // 3 خارجية
    function(){fadeVoices(0.4);rumble(5.2,[[0,0.5],[5,0.45]],240);whoosh(0,5,900,1600,0.18);whoosh(2.5,2,2000,600,0.22);},                      // 4 علوية
    function(){fadeVoices(0.4);rumble(5.2,[[0,0.4],[2.5,0.5],[5,0.35]],170);sub(5,0.2);beep(1.0,1480,0.05);beep(3.2,1240,0.05);},               // 5 وجه
    function(){fadeVoices(0.4);rumble(5.2,[[0,0.45],[5,0.7]],230);whoosh(0.2,4.8,300,3000,0.3);},                                              // 6 منظوره
    function(){fadeVoices(0.8);rumble(5.2,[[0,0.35],[3,0.12],[5,0.06]],150);hiss(3.2,1.3,0.12);thud(4.5,0.3);beep(2.2,1320,0.04);},            // 7 الممر
    function(){fadeVoices(0.8);rumble(5.2,[[0,0.05],[2,0.09],[5,0.09]],130);beep(1.4,1760,0.035);},                                             // 8 غرفة قراءة
    function(){fadeVoices(0.8);rumble(5.2,[[0,0.09],[5,0.09]],130);beep(2.6,1480,0.03);}                                                       // 9 غرفة قراءة
  ];

    cue:function(i){if(!init())return;wake();K=(VDUR[i]||5)/5;(CUES[[0,1,2,3][i]]||function(){})();},

    mute:function(m){if(master)master.gain.value=m?0:1;}
  };

/* ---------- أدوات خاصة بالوحدة (تقبل دالة عشوائية r لتُختبر مستقلةً) ---------- */
function dtRi(r,a,b){return a+Math.floor(r()*(b-a+1));}
function dtPk(r,a){return a[Math.floor(r()*a.length)];}
function dtSh(r,a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function dtLv(key){var l=1;try{l=curLvl(key);}catch(e){}return Math.max(1,Math.min(5,l||1));}
function dtPermsN(n){if(n===1)return [[0]];var out=[];dtPermsN(n-1).forEach(function(p){for(var i=0;i<n;i++){var q=p.slice();q.splice(i,0,n-1);out.push(q);}});return out;}
var DT_P3=dtPermsN(3),DT_PN={};
function dtPN(n){return DT_PN[n]||(DT_PN[n]=dtPermsN(n));}
var DT_NAMES=["يوسف","سلمان","عمر","خالد","ماجد","فيصل","هاني","وليد"];

/* =====================================================================
   (أ) شبكة المنطق: 3 أشخاص × 3 صفات (جدول واحد أو جدولان في المراحل الأعمق)
   ===================================================================== */
var DT_ITEMS=[{n:"المحفظة",i:"👛"},{n:"النظارة",i:"👓"},{n:"الدفتر",i:"📓"},{n:"القلم",i:"✏️"},{n:"المفتاح",i:"🔑"}];
var DT_SEATS=[{s:"الباب",p:"عند الباب"},{s:"النافذة",p:"قرب النافذة"},{s:"الطاولة",p:"على طاولة القراءة"},{s:"الركن",p:"في الركن الهادئ"},{s:"الرفوف",p:"قرب الرفوف"}];
/* K = عدد الجداول (صفات)، kinds = أنواع الأدلة المسموحة، min = أقل عدد أدلة بعد حذف الزائد */
var DT_GL=[{K:1,kinds:["pos","neg","neg"],min:2},{K:1,kinds:["neg","either"],min:3},{K:2,kinds:["pos","neg","neg","either"],min:4},{K:2,kinds:["neg","either"],min:5},{K:2,kinds:["neg","neg","either"],min:6}];

function dtAssigns(K){if(DT_ASG[K])return DT_ASG[K];var o=[];DT_P3.forEach(function(a){if(K===1)o.push([a]);else DT_P3.forEach(function(b){o.push([a,b]);});});return (DT_ASG[K]=o);}
/* الكيان: فئة c (0 شخص، 1 غرض، 2 مكان) وفهرس i. S[k][p] = قيمة الفئة k+1 عند الشخص p */
function dtPersonOf(S,c,i){if(c===0)return i;var pm=S[c-1];for(var p=0;p<3;p++)if(pm[p]===i)return p;return -1;}

function dtGridClue(S,K,kinds,r){
  var c=dtRi(r,0,K),i=dtRi(r,0,2),t;do{t=dtRi(r,0,K);}while(t===c);
  var p=dtPersonOf(S,c,i),x=dtPartner(S,t,p),kind=dtPk(r,kinds),y;
  do{y=dtRi(r,0,2);}while(y===x);
  if(kind==="pos")return {c:c,i:i,t:t,set:[x],neg:false};
  if(kind==="neg")return {c:c,i:i,t:t,set:[y],neg:true};
  return {c:c,i:i,t:t,set:dtSh(r,[x,y]),neg:false};
}
/* يولّد لغزًا بحلّ وحيد مضمون (يُتحقق بالعدّ الشامل لكل التعيينات الممكنة) */
function dtGridGen(lv,r){
  var L=DT_GL[lv-1],A=dtAssigns(L.K),att,k,S,cl,alive,g,q;
  for(att=0;att<2000;att++){
    S=[];for(k=0;k<L.K;k++)S.push(DT_P3[dtRi(r,0,5)]);
    cl=[];alive=A;g=0;
    while(alive.length>1&&g<90&&cl.length<12){
      g++;var c=dtGridClue(S,L.K,L.kinds,r),key=JSON.stringify(c);
      if(cl.some(function(x){return JSON.stringify(x)===key;}))continue;
      var na=alive.filter(function(a){return dtEv(c,a);});
      if(na.length===alive.length)continue;
      cl.push(c);alive=na;
    }
    if(alive.length!==1)continue;
    for(q=cl.length-1;q>=0;q--){var rest=cl.filter(function(_,j){return j!==q;});if(dtCount(rest,A)===1)cl=rest;}
    if(cl.length<L.min||cl.length>8)continue;
    return {K:L.K,sol:S,clues:dtSh(r,cl),lv:lv,fb:false};
  }
  S=[];for(k=0;k<L.K;k++)S.push(DT_P3[dtRi(r,0,5)]);
  cl=[];for(k=1;k<=L.K;k++){cl.push({c:0,i:0,t:k,set:[S[k-1][0]],neg:false});cl.push({c:0,i:1,t:k,set:[S[k-1][1]],neg:false});}

function dtGridText(cl,nm,it,st){
  function sub(c,i){return c===0?nm[i]:c===1?"صاحب "+it[i].n:"الجالس "+st[i].p;}
  function lst(arr,f){return arr.map(f).join(" أو ");}
  var pr;
  if(cl.t===0)pr=(cl.neg?"ليس ":"هو ")+lst(cl.set,function(x){return nm[x];});
  else if(cl.t===1)pr=(cl.neg?"ليس ":"هو ")+"صاحب "+lst(cl.set,function(x){return it[x].n;});
  else pr=(cl.neg?"لم يجلس ":"جلس ")+lst(cl.set,function(x){return st[x].p;});
  return sub(cl.c,cl.i)+" "+pr+".";
}

/* =====================================================================
   (ب) طابِق البصمة: أنماط حلقية مولَّدة (6 حلقات × 12 خلية)، الخلية: 0 فجوة، 1 عادية، 2 مُزاحة
   ===================================================================== */
var DT_RR=[16,28,40,52,64,76],DT_NC=72;
var DT_PL=[{a:4,b:6,h:0,none:0},{a:3,b:4,h:0,none:.6},{a:2,b:3,h:3,none:.7,hp:.5},{a:2,b:2,h:3,none:.7,hp:1},{a:1,b:2,h:4,none:.7,hp:1}];
function dtCellA(ri,si){return si*30+(ri%2)*15;}
function dtPt(r,a){var t=a*Math.PI/180;return (100+r*Math.cos(t)).toFixed(1)+" "+(100+r*Math.sin(t)).toFixed(1);}
function dtArcD(r,a0,a1){return "M"+dtPt(r,a0)+"A"+r+" "+r+" 0 0 1 "+dtPt(r,a1);}
function dtCC(idx,st){var ri=Math.floor(idx/12),si=idx%12,r=DT_RR[ri]+(st===2?4.5:0),a=(dtCellA(ri,si)+15)*Math.PI/180;return [100+r*Math.cos(a),100+r*Math.sin(a)];}
function dtMkCells(r){var c=[];for(var i=0;i<DT_NC;i++){var x=r();c.push(x<.16?0:x<.84?1:2);}return c;}
function dtHidSet(r,hh){var hid=[],i;for(i=0;i<DT_NC;i++)hid.push(false);if(!hh)return hid;var w0=dtRi(r,0,23)*15,wl=hh*30;
  for(i=0;i<DT_NC;i++){var ca=(dtCellA(Math.floor(i/12),i%12)+15)%360;if(((ca-w0+720)%360)<wl)hid[i]=true;}return hid;}
function dtFlip(cells,idxs,r){var c=cells.slice();idxs.forEach(function(i){var o=[0,1,2].filter(function(v){return v!==c[i];});c[i]=dtPk(r,o);});return c;}
function dtPrintGen(lv,r){
  var P=DT_PL[lv-1],none=(P.none&&r()<P.none)?dtRi(r,0,2):-1,rounds=[],q=0,guard=0;
  while(q<3&&guard++<500){
    var ev=dtMkCells(r),hid=dtHidSet(r,(P.h&&r()<(P.hp||1))?P.h:0),vis=[],hd=[],i,j;
    for(i=0;i<DT_NC;i++)(hid[i]?hd:vis).push(i);
    var ans=q===none?-1:dtRi(r,0,2),sus=[];
    for(j=0;j<3;j++){
      var c;
      if(j===ans)c=ev.slice();else c=dtFlip(ev,dtSh(r,vis).slice(0,dtRi(r,P.a,P.b)),r);
      if(hd.length)c=dtFlip(c,dtSh(r,hd).slice(0,dtRi(r,1,3)),r);
      sus.push(c);
    }
    var ks=sus.map(function(x){return x.join("");});
    if(ks[0]===ks[1]||ks[0]===ks[2]||ks[1]===ks[2])continue;
    rounds.push({ev:ev,hid:hid,sus:sus,ans:ans});q++;
  }
  return {lv:lv,rounds:rounds,none:none};
}
/* يرسم البصمة؛ hid: خلايا ممسوحة (لا تُقارن)، mark: فهرس خلية لإبرازها. يعيد وسم الفتح فقط */

    if(hid&&hid[i]){s+='<path d="'+dtArcD(r+2.25,a-2,a+32)+'" stroke="#2a3366" stroke-width="9" fill="none"/>';continue;}

/* ===== بيت الحكمة: محطتا الخوارزمي والكندي (بادئة ba) ===== */
/* محطتان تعيدان تمثيل منهجين حقيقيين من العصر العباسي. ARAFAT ALRAJHI © 2026 */

/* ---------- أدوات خاصة بالوحدة (تقبل دالة عشوائية r لتُختبر مستقلةً) ---------- */
function baLv(k){var l=1;try{l=curLvl(k);}catch(e){}return Math.max(1,Math.min(5,l||1));}
function baRi(r,a,b){return a+Math.floor(r()*(b-a+1));}
function baPk(r,a){return a[Math.floor(r()*a.length)];}
function baSh(r,a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function baClr(el){while(el.firstChild)el.removeChild(el.firstChild);}
function baPulse(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);}

/* =====================================================================
   (أ) الخوارزمي: ميزان الجبر
   الحالة st = [[أكياس الكفة الأولى، أعداد الكفة الأولى],[أكياس الثانية، أعداد الثانية]]
   القيمة السالبة = «ناقص». لا عملية تُنتج قيمة أكثر سلبية، فلا طريق مسدود.
   ===================================================================== */
function baCp(st){return [[st[0][0],st[0][1]],[st[1][0],st[1][1]]];}
function baCanJabr(st,s,t){return st[s][t]<0;}
function baCanMuq(st,s,t){return st[s][t]>0&&st[1-s][t]>0;}
function baDoJabr(st,s,t){var n=baCp(st),a=-st[s][t];n[0][t]+=a;n[1][t]+=a;return n;}
function baDoMuq(st,s,t){var n=baCp(st),m=Math.min(st[s][t],st[1-s][t]);n[0][t]-=m;n[1][t]-=m;return n;}
function baSolved(st){for(var s=0;s<2;s++)if(st[s][0]===1&&st[s][1]===0&&st[1-s][0]===0&&st[1-s][1]>0)return true;return false;}
/* أفضل خطوة تالية (للتلميح) */
function baMove(st){
  var s,t;
  for(t=0;t<2;t++)for(s=0;s<2;s++)if(baCanJabr(st,s,t))return {op:"j",s:s,t:t};
  for(t=0;t<2;t++)for(s=0;s<2;s++)if(baCanMuq(st,s,t))return {op:"m",s:s,t:t};
  return null;
}
function baSteps(st){var n=0,m;while(!baSolved(st)){m=baMove(st);if(!m||n>20)return -1;st=m.op==="j"?baDoJabr(st,m.s,m.t):baDoMuq(st,m.s,m.t);n++;}return n;}
/* عبارات لفظية */
function baPh(t,m){
  if(t===0)return m===1?"كيس":m===2?"كيسان":m+" أكياس";
  return m===1?"وزنة":m===2?"وزنتان":m<=10?m+" وزنات":m+" وزنة";
}
function baPhObj(t,m){ /* حالة النصب بعد «أضفنا/حذفنا» */
  if(t===0)return m===1?"كيسًا":m===2?"كيسين":m+" أكياس";
  return m===1?"وزنة":m===2?"وزنتين":m<=10?m+" وزنات":m+" وزنة";
}
function baSideTxt(v){
  var b=v[0],n=v[1];
  if(b===0&&n===0)return "لا شيء";
  if(b===0)return (n<0?"ناقص ":"")+Math.abs(n);
  if(n===0)return (b<0?"ناقص ":"")+baPh(0,Math.abs(b));
  if(b>0)return baPh(0,b)+(n>0?" و"+n:" ناقص "+(-n));
  return n+" ناقص "+baPh(0,-b);
}
function baEqTxt(st){return baSideTxt(st[0])+"  تعدل  "+baSideTxt(st[1]);}

/* مولِّد: x هو وزن الكيس. الفرق بين أكياس الكفتين = 1 دائمًا، فيكفي الجبر والمقابلة (بلا قسمة). */
function baGen(lv,r){
  var att,x,o,xs,xo,nx,no,B,C,c,k,st;
  for(att=0;att<200;att++){
    o=baRi(r,0,1);
    if(lv===1){
      x=baRi(r,2,9);c=baRi(r,1,2);xs=c+1;xo=c;B=baRi(r,1,5);nx=B;no=B+x;
    }else if(lv===2){
      c=baRi(r,0,1);xs=c+1;xo=c;B=baRi(r,1,6);no=baRi(r,1,8);nx=-B;x=no+B;
    }else if(lv===3){
      c=baRi(r,1,2);xs=c+1;xo=c;k=baRi(r,0,1);
      if(k===0){B=baRi(r,1,6);no=baRi(r,1,8);nx=-B;x=no+B;}
      else{B=baRi(r,3,8);C=baRi(r,1,B-2);nx=-B;no=-C;x=B-C;}
    }else if(lv===4){
      k=baRi(r,0,2);
      if(k===0){xs=0;xo=-1;nx=baRi(r,1,8);x=baRi(r,2,9);no=nx+x;}
      else if(k===1){c=baRi(r,1,2);xs=c+1;xo=c;B=baRi(r,1,6);no=baRi(r,1,8);nx=-B;x=no+B;}
      else{xs=1;xo=0;B=baRi(r,1,6);no=baRi(r,1,8);nx=-B;x=no+B;}
    }else{
      k=baRi(r,0,2);
      if(k===0){xs=-1;xo=-2;nx=baRi(r,1,6);x=baRi(r,2,9);no=nx+x;}
      else if(k===1){xs=0;xo=-1;nx=baRi(r,1,9);x=baRi(r,2,12);no=nx+x;}
      else{xs=2;xo=1;B=baRi(r,3,8);C=baRi(r,1,B-2);nx=-B;no=-C;x=B-C;}
    }
    if(x<2||x>14)continue;
    if(o===0)st=[[xs,nx],[xo,no]];else st=[[xo,no],[xs,nx]];
    if((xs*x+nx)!==(xo*x+no))continue;
    if(baSolved(st))continue;
    k=baSteps(st);
    if(k<(lv>=3?2:1)||k>6)continue;
    return {st:st,x:x,steps:k};
  }
  return {st:[[2,3],[1,8]],x:5,steps:2};
}

/* عدّ حروف الهيكل (بلا فراغات) */
function baCount(plain){var c={},n=0,i,k;for(i=0;i<plain.length;i++){if(plain.charAt(i)===" ")continue;k=baSk(plain.charAt(i));c[k]=(c[k]||0)+1;n++;}return {c:c,n:n};}
/* شرط الكفاية: أكثر حرفين تكرارًا هما الألف واللام (بالتحديد)، والثالث أقل منهما، وعدد الحروف المختلفة كافٍ.
   فيعمل جدول التكرار فعلًا، وما بقي يُستخرج من أشكال الكلمات. */
function baFreqOk(plain){
  var r=baCount(plain),e=[],k;for(k in r.c)e.push([k,r.c[k]]);
  e.sort(function(a,b){return b[1]-a[1];});
  if(e.length<8||r.n<16)return false;
  if(!((e[0][0]==="ا"&&e[1][0]==="ل")||(e[0][0]==="ل"&&e[1][0]==="ا")))return false;
  return e[2][1]<e[1][1];
}
/* معجم الكلمات (بالهيكل) من البنك نفسه: يمثّل ما يعرفه القارئ من العربية */
var BA_LEX=null;
function baLex(){if(BA_LEX)return BA_LEX;var seen={},L=[];BA_RAW.forEach(function(p){p.split(" ").forEach(function(w){var k=w.split("").map(baSk).join("");if(!seen[k]){seen[k]=1;L.push(k);}});});BA_LEX=L;return L;}
/* هل يكفي التحليل للحل؟ نفترض أن العدّ كشف الألف واللام، ثم نطبّق قاعدة واحدة فقط:
   كلمة لا يطابق شكلَها (الحروف المعروفة وطولها وتكرار حروفها) إلا كلمة واحدة في المعجم تُكشف حروفها. */
function baDeduce(plain){
  var lex=baLex(),words=plain.split(" ").map(function(w){return w.split("").map(baSk);}),known={"ا":"ا","ل":"ل"},used={"ا":1,"ل":1},ch=true,all=true,i,w;
  function cands(cw){
    var out=[];
    lex.forEach(function(lw){
      if(lw.length!==cw.length)return;
      var tmp={},inv={},ok=true,j,s,l;
      for(j=0;j<cw.length&&ok;j++){
        s=cw.charAt?cw.charAt(j):cw[j];l=lw.charAt(j);
        if(known[s]!==undefined){if(known[s]!==l)ok=false;}
        else{if(used[l])ok=false;else if(tmp[s]!==undefined&&tmp[s]!==l)ok=false;else if(inv[l]!==undefined&&inv[l]!==s)ok=false;else{tmp[s]=l;inv[l]=s;}}
      }
      if(ok)out.push(tmp);
    });
    return out;
  }
  while(ch){
    ch=false;
    for(i=0;i<words.length;i++){
      w=words[i];
      if(w.every(function(s){return known[s]!==undefined;}))continue;
      var cs=cands(w),first=cs.length?JSON.stringify(cs[0]):"",uniq=cs.length>0&&cs.every(function(c){return JSON.stringify(c)===first;});
      if(uniq){for(var s2 in cs[0]){known[s2]=cs[0][s2];used[cs[0][s2]]=1;}ch=true;}
    }
  }
  words.forEach(function(w){w.forEach(function(s){if(known[s]===undefined)all=false;});});
  return all;
}
function baInitAL(plain){return plain.split(" ").filter(function(w){return baSk(w.charAt(0))==="ا"&&baSk(w.charAt(1))==="ل";}).length;}
function baCharsOk(p){for(var i=0;i<p.length;i++){var c=p.charAt(i);if(c!==" "&&BA_ABJ.indexOf(baSk(c))<0)return false;}return true;}
var BA_BANK=BA_RAW.filter(function(p){return baCharsOk(p)&&baFreqOk(p)&&baInitAL(p)>=1&&baDeduce(p);});
var BA_RNG=[[16,30],[26,38],[34,46],[44,58],[52,70]];
function baKGen(lv,r){
  var rg=BA_RNG[lv-1],pool=BA_BANK.filter(function(p){var n=baCount(p).n;return n>=rg[0]&&n<=rg[1];});
  if(!pool.length){var mid=(rg[0]+rg[1])/2;pool=BA_BANK.slice().sort(function(a,b){return Math.abs(baCount(a).n-mid)-Math.abs(baCount(b).n-mid);}).slice(0,3);}
  var plain=baPk(r,pool),sy=baSh(r,BA_SYMS),map={},inv={},i;
  for(i=0;i<BA_ABJ.length;i++){map[BA_ABJ[i]]=sy[i];inv[sy[i]]=BA_ABJ[i];}
  var words=plain.split(" ").map(function(w){var cs=[];for(var j=0;j<w.length;j++){var k=baSk(w.charAt(j));cs.push({o:w.charAt(j),k:k,c:map[k]});}return {w:w,cs:cs};});
  var counts={},first={},pos=0;
  words.forEach(function(w){w.cs.forEach(function(c){counts[c.c]=(counts[c.c]||0)+1;if(first[c.c]===undefined)first[c.c]=pos;pos++;});});
  var order=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a]||first[a]-first[b];});
  return {plain:plain,words:words,map:map,inv:inv,counts:counts,order:order,lv:lv,n:baCount(plain).n};
}

var BANK=[{"id": "ab-thabit-ibn-qurra", "name": "ثابت بن قرة", "years_ce": "836–901م (توفي 18 فبراير 901م بحسب MacTutor)", "city": "حرّان ثم بغداد", "caliph_era": "المعتضد بالله (279–289هـ / 892–902م)", "field": "رياضيات وفلك وميكانيكا وترجمة", "title": "ثابت بن قرة: أعدادٌ تتحابّ", "story": "وُلد ثابت في حرّان لأسرة صابئية، وكانت لغته الأولى السريانية، وأتقن اليونانية والعربية. جاء إلى بغداد فتعلّم الرياضيات والطب، وصار منجّمًا في بلاط الخليفة المعتضد. أحبّ الأعداد حبًّا خاصًّا، حتى وضع قاعدة لصنع أزواج من الأعداد «المتحابّة» التي يساوي مجموعُ قواسم أحدها العددَ الآخر. ويُنسب إليه أنه أول من وجد الزوج 17296 و18416.", "did": "وضع قاعدة لإيجاد الأعداد المتحابة: إذا كانت الأعداد الأولية p(n-1) وp(n) وq(n) أولية، حيث p(n)=3·2^n−1 وq(n)=9·2^(2n−1)−1، فإن العددين 2^n·p(n-1)·p(n) و2^n·q(n) متحابّان. وراجع ترجمة حنين بن إسحاق لكتاب «الأصول» لإقليدس، وعليها قامت النسخ العربية اللاحقة، وكتب في الميزان القبّاني (القرسطون) وفي الفلك.", "quiz": {"q": "ما الزوج من الأعداد المتحابّة الذي يُنسب إلى ثابت بن قرة أنه أول من وجده؟", "o": ["6 و28", "17296 و18416", "10 و20"], "a": 1, "e": "6 و28 عددان تامّان لا متحابّان، أما 17296 و18416 فهما الزوج الذي ينسبه المصدران إلى ثابت، بصيغة «يُنسب» لا الجزم."}, "grade": "A", "caveat": "نسبة الأولوية في الزوج 17296/18416 جاءت بصيغة تحفظ في المصدرين (reputedly / probably first). تاريخ الميلاد 836م بلا يوم؛ والتواريخ الهجرية محوّلة تقريبيًا من عندنا (لا في المصدر). كونه تلميذ محمد بن موسى ورد في MacTutor وحده. اعتقاده بتذبذب الاعتدالين خطأ بحسب المصدرين، ولم نُدخله في القصة. يُراجع الانتماء الصابئي بحساسية في الصياغة النهائية. الصيغة الرياضية كُتبت بالشكل المعروف (q=9·2^(2n−1)−1) لأن تلخيص الصفحة المسترجع جاء مشوّه الأس، فيجب مطابقتها بصريًا مع MacTutor قبل النشر.", "sources": [{"title": "MacTutor: Al-Sabi Thabit ibn Qurra al-Harrani", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Thabit/", "note": "فُتح: التواريخ، المعتضد، القاعدة والصيغة، ترجمة الأصول"}, {"title": "Encyclopedia.com: Thabit ibn Qurra", "url": "https://www.encyclopedia.com/science/encyclopedias-almanacs-transcripts-and-maps/thabit-ibn-qurra", "note": "فُتح: التواريخ، حرّان، reputedly أول من وجد الزوج، مراجعة ترجمة الأصول، خطأ الاعتدالين"}]}, {"id": "ab-al-battani", "name": "أبو عبد الله محمد بن جابر البتّاني", "years_ce": "نحو 858–929م", "city": "حرّان ثم الرقة (على الفرات)", "caliph_era": "أواخر العصر العباسي الثاني (المعتمد إلى المقتدر تقريبًا)", "field": "فلك ومثلثات", "title": "راصد الرقة الذي صحّح بطليموس", "story": "ترك البتّاني أثره من مدينة الرقة على الفرات، فقد رصد السماء نحو أربعين عامًا، وأقدم رصد مؤرَّخ له يعود إلى سنة 877م. حدّد ميل دائرة البروج بنحو 23°35′، وهو قريب جدًا من القيمة الحديثة، وجاء طول السنة الشمسية عنده أقصر من الحقيقة بنحو دقيقتين فقط. جمع نتائجه في «الزيج» ذي الفصول السبعة والخمسين، وفيه فهرس لنحو 489 نجمًا، وقد ترجم إلى اللاتينية وطُبع في نورمبرغ سنة 1537م. وفي آخر حياته سافر مع وفد من أهل الرقة إلى بغداد، ومات في طريق العودة عند قصر الجصّ قرب سامراء.", "did": "رصد الشمس والقمر والكواكب عقودًا، وطبّق علم المثلثات بدل الاكتفاء بالهندسة وحدها، وراجع نتائج بطليموس العملية فكشف أخطاء في المجسطي، وقد فعل ذلك غالبًا دون تصريح باسم بطليموس.", "quiz": {"q": "في أي مدينة أنجز البتّاني معظم أرصاده الفلكية؟", "o": ["الرقة", "دمشق", "القاهرة"], "a": 0, "e": "انتقلت أسرته إلى الرقة على الفرات، وفيها أجرى معظم أرصاده بحسب دائرة المعارف."}, "grade": "A", "caveat": "سنة الميلاد (نحو 858م) تقديرية. القيمة الدقيقة لطول السنة اختلفت في عرض المصدر الأول (5س48د24ث في موضع، و5س46د24ث في آخر)، والمصدران يتفقان على أنه أقصر من الحقيقة بنحو 2د22ث، فالقصة لا تجزم برقم دقيق. أثره على كوبرنيكوس وكبلر ورد بلا تفصيل في المصدر الثاني فلم نذكره. كونه ابن صانع الآلات جابر بن سنان محتمل لا مؤكد، ولم نذكره. سبب رحلته إلى بغداد (نزاع ضريبي) بصيغة «على الأرجح».", "sources": [{"title": "Encyclopedia.com: Al-Battani", "url": "https://www.encyclopedia.com/people/science-and-technology/astronomy-biographies/al-battani", "note": "فُتح: الرقة، 877م، الزيج 57 فصلًا و489 نجمًا، تصحيح بطليموس، الوفاة عند قصر الجص"}, {"title": "Schools' Observatory: Al-Battani", "url": "https://www.schoolsobservatory.org/learn/history/biographies/al-battani", "note": "فُتح: أكثر من 40 عامًا من الرصد، السنة الشمسية أقصر بنحو دقيقتين و22 ثانية"}]}, {"id": "ab-al-farghani", "name": "أحمد بن محمد بن كثير الفرغاني", "years_ce": "نحو 798–بعد 861م", "city": "فرغانة ثم بغداد ثم مصر", "caliph_era": "المأمون ثم المتوكل", "field": "فلك وهندسة", "title": "الفرغاني: من فرغانة إلى مقياس النيل", "story": "جاء الفرغاني من وادي فرغانة في ما وراء النهر، وعمل ضمن فلكيي بلاط المأمون في بغداد. ألّف «جوامع علم النجوم»، وهو ملخّص وصفي من ثلاثين فصلًا لمجسطي بطليموس، فتُرجم إلى اللاتينية سنة 1135م وبقي مرجعًا في أوروبا قرونًا. وفي زمن المتوكل أشرف على بناء مقياس النيل الكبير في جزيرة الروضة بمصر، وأُنجز نحو سنة 861م.", "did": "صاغ الفلك البطلمي في كتاب سهل مختصر جمع فيه قيم الفلكيين المسلمين قبله ومنها أطوال محيط الأرض وقطرها في رصد المأمون، وأشرف على إنشاء مقياس النيل بالروضة.", "quiz": {"q": "ما طبيعة كتاب «جوامع علم النجوم» للفرغاني؟", "o": ["ملخّص وصفي لمجسطي بطليموس", "كتاب في الطب العملي", "جدول لأوقات المدّ والجزر"], "a": 0, "e": "وصفته دائرة المعارف بأنه ملخّص من ثلاثين فصلًا لمجسطي بطليموس، قليل الرياضيات، وهذا ما ساعد على انتشاره."}, "grade": "B", "caveat": "المصدر الثاني (دليل وسط آسيا) موقع عام لا أكاديمي. خلاف في المصادر: وفاته «بعد 861م» في الأول و798–861م في الثاني؛ مكان ولادته «ربما قُوَى» في الثاني؛ موضع المقياس: الفسطاط في نص الأول والروضة في ببليوغرافيته وفي الثاني. تاريخ الجوامع: بعد 833 وقبل 857م في الأول، ونحو 833م في الثاني. سبب فشل قناة الجعفرية متنازع فيه (نقص عملي أم صلابة الأرض)، فلا ندخله في القصة. الميل الكلي: 23°35′ للمأموني و23°33′ برصده الخاص، تتفاوت المصادر. يُستحسن فتح مصدر ثالث (مثل Biographical Encyclopedia of Astronomers) للترقية إلى A.", "sources": [{"title": "Encyclopedia.com: Al-Farghani", "url": "https://www.encyclopedia.com/science/dictionaries-thesauruses-pictures-and-press-releases/al-farghan", "note": "فُتح: المأمون والمتوكل، الجوامع، الترجمة اللاتينية 1135، مقياس النيل 861م"}, {"title": "Central Asia Guide: Al-Farghani", "url": "https://central-asia.guide/?p=35751", "note": "فُتح: روضة، الجوامع نحو 833م، مصدر عام أضعف"}]}, {"id": "ab-abu-al-wafa-al-buzjani", "name": "أبو الوفاء البوزجاني", "years_ce": "940–997 أو 998م", "city": "بوزجان (قرب نيسابور) ثم بغداد", "caliph_era": "العصر العباسي تحت نفوذ البويهيين (عضد الدولة وشرف الدولة)", "field": "رياضيات وفلك ومثلثات", "title": "أبو الوفاء ورصدٌ مشترك مع البيروني", "story": "وُلد أبو الوفاء في بوزجان قرب نيسابور سنة 940م، وجاء إلى بغداد شابًّا في نحو العشرين. عمل في ظلّ البويهيين، وشارك في رصد في مرصد بغداد الذي أمر شرف الدولة بإنشائه. ألّف «المجسطي» الخاص به، وفيه فصل في المثلثات عرّف فيه الظل وظل التمام والقاطع وقاطع التمام، وكتب كتابًا للحسّاب والكتّاب قيل إنه أول كتاب إسلامي يستعمل الأعداد السالبة. وفي سنة 997م اتفق مع البيروني على رصد خسوف قمري واحد من مدينتين ليعرفا الفرق بين خطي طولهما، فخرجا بنحو ساعة.", "did": "طوّر جداول مثلثية أدقّ مما سبقه، وطبّق المثلثات الكروية على الفلك، وألّف في الإنشاءات الهندسية لأصحاب الحِرَف، وتبادل البيانات الفلكية مع البيروني.", "quiz": {"q": "لماذا اتفق أبو الوفاء والبيروني على رصد الخسوف القمري نفسه من مدينتين في سنة 997م؟", "o": ["لمعرفة الفرق بين خطي طول المدينتين", "لقياس حجم القمر", "لتحديد بداية شهر رمضان"], "a": 0, "e": "ذكر Biographical Encyclopedia of Astronomers أنهما رتّبا رصدًا مشتركًا لحساب فرق الطول بين موقعيهما، فجاء نحو ساعة."}, "grade": "B", "caveat": "المصدر الأول (BEA) كامل؛ والثاني (Springer) ظهرت لنا منه معاينة فقط. الوفاة 997 أو 998م. الانتقال إلى بغداد: عند سن العشرين في BEA، و959م في Springer. لا نجزم بأنه «أول من أدخل الظل»، إذ يذكر DSB في ترجمة النيريزي أن حبشًا ربما سبقه. جدول معادلة الشمس يُنسب إليه في زيج البغدادي بصيغة «منسوب» لا الجزم. التحقق ممكن من نسخة كاملة لمدخل Springer لترقية الدرجة.", "sources": [{"title": "BEA (McGill): Buzjani", "url": "https://islamsci.mcgill.ca/RASI/BEA/Buzjani_BEA.htm", "note": "فُتح: التواريخ، بغداد، البويهيون، المجسطي، الظل، الأعداد السالبة، الرصد المشترك مع البيروني"}, {"title": "Springer: Abu al-Wafa Buzjani (Biographical Encyclopedia of Astronomers)", "url": "https://link.springer.com/referenceworkentry/10.1007/978-1-4020-4425-0_9203", "note": "فُتح (معاينة): 940م، بغداد 959، جداول أدق، الزيج الواضح"}]}, {"id": "ab-al-sufi", "name": "عبد الرحمن بن عمر الصوفي", "years_ce": "903–986م (بحسب ويكيبيديا)", "city": "الريّ وأصفهان وشيراز", "caliph_era": "العصر العباسي تحت نفوذ البويهيين (عضد الدولة)", "field": "فلك", "title": "الصوفي والسحابة الصغيرة", "story": "عاش الصوفي في بلاط عضد الدولة البويهي في أصفهان، وكتب هناك «كتاب صور الكواكب الثابتة» نحو سنة 964م. قارن فيه كوكبات بطليموس بما يسمّيه العرب من نجوم وأسماء، ثم رسم كل كوكبة مرتين: مرة كما تُرى على الكرة السماوية من الخارج، ومرة كما تُرى في السماء من الأرض. ولاحظ قرب نجم في فم السمكة بقعة ضبابية سمّاها «سحابة صغيرة»، وهي في الغالب مجرة المرأة المسلسلة، وتُعدّ أقدم إشارة مكتوبة إلى مجرة غير درب التبانة.", "did": "راجع أرصاد بطليموس للنجوم الثابتة، وأضاف نجومًا لم يذكرها، ودوّن الأسماء العربية التقليدية للنجوم، وصنع مع الكتاب صورًا لكل كوكبة بمنظورين.", "quiz": {"q": "ماذا وصف الصوفي بأنه «سحابة صغيرة» قرب كوكبة المرأة المسلسلة؟", "o": ["مجرة المرأة المسلسلة", "مذنّبًا عابرًا", "سحابة في الغلاف الجوي"], "a": 0, "e": "تذكر المصادر أنه أول من دوّن ملاحظة مكتوبة عن مجرة غير درب التبانة، وهي أندروميدا في الغالب."}, "grade": "B", "caveat": "المصدر الأول (Public Domain Review) لا يذكر تاريخ ميلاده ووفاته ولا سنة 964 صراحة، بل يقول بعد نحو ثلاث سنوات من زيارة أصفهان سنة 349هـ (960م)؛ التواريخ 903–986م و964م من ويكيبيديا (مصدر غير محكّم). صيغة «أول من» مقيدة بما كُتب لا بما رُصد. ويكيبيديا ترى زعم رؤية سحابة ماجلان الكبرى سوء فهم، فلم نذكره. الأرصاد الأصلية ضاعت، والمخطوطة المصوّرة في المصدر الأول نسخة متأخرة نحو 1430م. يُحتاج مصدر أكاديمي ثالث (BEA أو موسوعة الإسلام) لترقية الدرجة إلى A.", "sources": [{"title": "Public Domain Review: Behold the Nebulous Smear (Al-Sufi's Book of Fixed Stars)", "url": "https://publicdomainreview.org/collection/fixed-stars/", "note": "فُتح: عضد الدولة، أصفهان 349هـ، رسم الكوكبة بمنظورين، السحابة وأندروميدا"}, {"title": "Wikipedia: Abd al-Rahman al-Sufi", "url": "https://en.wikipedia.org/wiki/Abd_al-Rahman_al-Sufi", "note": "فُتح: 903–986م، الريّ، 964م، 48 كوكبة، تحفظات عن سحابة ماجلان"}]}, {"id": "ab-habash-al-hasib", "name": "حبش الحاسب المروزي (أحمد بن عبد الله)", "years_ce": "نشِط نحو 815–868م؛ تواريخ الميلاد والوفاة مجهولة", "city": "بغداد ثم سامرّاء (وربما دمشق)", "caliph_era": "المأمون ثم من بعده حتى زمن سامرّاء", "field": "فلك ومثلثات وآلات رصد", "title": "حبش الحاسب: ثلاثة أزياج وعمر طويل", "story": "ينسب لقبه «المروزي» إلى مرو على الأرجح، وعمل حاسبًا وراصدًا في بغداد زمن المأمون ثم في سامرّاء بعد أن صارت عاصمة سنة 838م. ألّف ثلاثة أزياج: الأول على طريقة السند هند وأزياج الخوارزمي، والثاني «زيج الشاه»، والثالث بطلمي هو «الزيج الممتحن» الذي وصل إلينا، وفيه جداول مثلثية مساعدة. وكتب في الآلات كالأسطرلاب «البطيخي» والكرة السماوية والأسطرلاب الكروي، وفي قياس الأرض في «كتاب الأجرام والأبعاد». وتذكر المصادر القديمة أنه عاش قرنًا كاملًا.", "did": "صنع جداول فلكية ومثلثية ورصد منذ نحو 829–830م، وكتب في الأسطرلاب والكرة السماوية وذات الحلق وفي تحديد القبلة، وشارك في برنامج رصد المأمون المعروف بـ«الممتحن».", "quiz": {"q": "كم زيجًا (جدولًا فلكيًا) ألّف حبش الحاسب بحسب ما يعرف الباحثون اليوم؟", "o": ["اثنان", "ثلاثة", "عشرة"], "a": 1, "e": "ذكر Biographical Encyclopedia of Astronomers ثلاثة أزياج، ولم يصل منها إلا الزيج البطلمي الممتحن."}, "grade": "B", "caveat": "سيرته غير محسومة: لا تاريخ ولادة ولا وفاة، وتقدير 796–894م مبني على استنتاج من قيمة ميل رصدها بنو موسى سنة 868–869م. عمره المئوي من ابن النديم. ويكيبيديا تنسب إليه أول جداول للظل وظل التمام نحو 860م وقياسات لمحيط الأرض بالأميال، والمصدر الأول (BEA) لا يؤيدها، فلم نُدخل أيًّا منها. «أول من» غير مستعملة. اسم «حبش» ورد في ويكيبيديا احتمالًا لسمار البشرة ولم يتأكد، فلا يُذكر. بقاء أعماله مخطوطات غير منشورة.", "sources": [{"title": "Biographical Encyclopedia of Astronomers via ISMI: Habash al-Hasib", "url": "https://ismi.mpiwg-berlin.mpg.de/biography/Habash_al-Hasib_BEA.htm", "note": "فُتح: الأزياج الثلاثة، الفترات، الأجرام والأبعاد، الآلات، تقدير الحياة"}, {"title": "Wikipedia: Habash al-Hasib", "url": "https://en.wikipedia.org/wiki/Habash_al-Hasib", "note": "فُتح: مرو، سامرّاء، رصد 825–835م، خسوف 829م؛ ادعاءات 'الأوائل' غير مؤيدة في BEA"}]}, {"id": "ab-yahya-ibn-abi-mansur", "name": "يحيى بن أبي منصور", "years_ce": "نشِط نحو 820م، وتوفي نحو 830م قرب حلب", "city": "بغداد", "caliph_era": "المأمون (198–218هـ / 813–833م)", "field": "فلك ورصد", "title": "يحيى بن أبي منصور وجدول «الممتحن»", "story": "كان يحيى من أسرة فارسية عُرفت بعلم النجوم، وخدم أولًا الوزير الفضل بن سهل، ثم دخل خدمة المأمون بعد مقتل الفضل سنة 818م وأسلم. وفي سنة 828م أشرف على فريق رصد في حي الشمّاسية ببغداد، لامتحان جداول بطليموس بالرصد الفعلي. استمر الرصد أقل من سنة ونصف، وجُمعت نتائجه في «الزيج الممتحن» أي المختبَر المتحقَّق منه. وقد خرج الفريق بقيم أدقّ، منها ميل دائرة البروج 23°33′، ومات يحيى قرب حلب سنة 830م في حملة المأمون على طرسوس.", "did": "قاد رصد الشمس والقمر في الشمّاسية للتحقق من المجسطي والجداول الميسّرة، وأخرج الزيج الممتحن، وعلّم بني موسى بحسب المصدرين.", "quiz": {"q": "ماذا تعني كلمة «الممتحن» في اسم زيج يحيى بن أبي منصور؟", "o": ["المختبَر المتحقَّق منه بالرصد", "المخطوط السرّي", "الخريطة البحرية"], "a": 0, "e": "ذكر BEA أن الاسم يعني «verified»، أي أن جداوله امتُحنت بالرصد."}, "grade": "A", "caveat": "خلاف في مكان رصد دمشق: دائرة المعارف تقول إن مرصد دير مرّان بدمشق كان برئاسة حبش، وBEA يقول إن رصد دمشق 831–832م قاده المروروذي بعد وفاة يحيى؛ لذلك لا ندرج دمشق في قصة يحيى. تأليف الزيج: غير واضح هل كتبه يحيى وحده أم الفريق (BEA). قيمة الميل 23°33′ ينفرد بها يحيى وحبش بحسب BEA. جدول معادلة الشمس قد لا يكون أصليًّا. تاريخ الوفاة نحو 830م متفق عليه في المصدرين. الرقم المنشور للمخطوط: Escorial 1927 في الأول و927 في الثاني، تفصيل لا يمس القصة.", "sources": [{"title": "Encyclopedia.com: Yahya ibn Abi Mansur", "url": "https://encyclopedia.com/science/dictionaries-thesauruses-pictures-and-press-releases/yahya-ibn-abi-mansur", "note": "فُتح: خدمة الفضل ثم المأمون، فريق 828م، الشمّاسية، الممتحن"}, {"title": "BEA (McGill): Yahya ibn Abi Mansur", "url": "https://islamsci.mcgill.ca/RASI/BEA/Yahya_ibn_Abi_Mansur_BEA.htm", "note": "فُتح: رصد 828–829م أقل من سنة ونصف، ميل 23°33′، وفاته 830م"}]}, {"id": "ab-al-hajjaj-ibn-matar", "name": "الحجّاج بن يوسف بن مَطَر", "years_ce": "نشِط نحو 786–830م", "city": "بغداد", "caliph_era": "هارون الرشيد ثم المأمون", "field": "ترجمة وهندسة", "title": "الحجّاج: أول من نقل «الأصول» إلى العربية", "story": "لا يُعرف عن حياة الحجّاج إلا القليل، لكن أثره في الرياضيات كبير. ترجم كتاب «الأصول» لإقليدس من اليونانية إلى العربية مرتين: الأولى في أوائل القرن التاسع للوزير يحيى بن خالد زمن هارون الرشيد، والثانية في العشرينيات للخليفة المأمون وكانت أحكم وأوجز. وعلى ترجمته الثانية بنى النيريزي شرحه المشهور لإقليدس.", "did": "ترجم «الأصول» مرتين، وكانت ترجمته الثانية مرجعًا لشراح لاحقين كالنيريزي، وترجم المجسطي بحسب بعض المصادر.", "quiz": {"q": "لمن أُعدّت الترجمة الأولى لكتاب «الأصول» التي أنجزها الحجّاج بن مطر؟", "o": ["الوزير يحيى بن خالد في عهد هارون الرشيد", "الخليفة المعتضد", "ابن سينا"], "a": 0, "e": "ذكر BEA أن وزير هارون الرشيد يحيى بن خالد هو من كلّفه بالترجمة الأولى، وأن الثانية أُعدّت للمأمون."}, "grade": "A", "caveat": "حياته الشخصية مجهولة تقريبًا. ترجمة المجسطي «نحو 829م» وردت في ويكيبيديا فقط، وBEA يقول إن تاريخها وراعيها مجهولان، فيحسن حذفها عند النشر أو وسمها «غير مثبتة». تواريخ 786–833م (ويكيبيديا) و786–830م (BEA) تقريبية. ترجمته الأولى اعتمدت على مخطوطة يونانية واحدة على الأرجح. المصدر الثالث (MacTutor عن النيريزي) يؤكد أن شرح النيريزي مبني على ترجمته الثانية.", "sources": [{"title": "BEA (McGill): Hajjaj ibn Yusuf ibn Matar", "url": "https://islamsci.mcgill.ca/RASI/BEA/Hajjaj_ibn_Yusuf_ibn_Matar_BEA.htm", "note": "فُتح: ترجمتا الأصول، يحيى بن خالد، المأمون، الاحتياط في المجسطي"}, {"title": "MacTutor: Al-Nayrizi", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Al-Nayrizi/", "note": "فُتح: شرح النيريزي منقّح عن ترجمة الحجاج الثانية"}, {"title": "Wikipedia: Al-Hajjaj ibn Yusuf ibn Matar", "url": "https://en.wikipedia.org/wiki/Al-%E1%B8%A4ajj%C4%81j_ibn_Y%C5%ABsuf_ibn_Ma%E1%B9%ADar", "note": "فُتح: مصدر مساند فقط؛ ترجمة المجسطي نحو 829م"}]}, {"id": "ab-al-jawhari-mathematician", "name": "العباس بن سعيد الجوهري", "years_ce": "نحو 800–860م (تقريبي)", "city": "بغداد", "caliph_era": "المأمون", "field": "هندسة وفلك", "title": "الجوهري ومحاولة إثبات مسلّمة التوازي", "story": "عمل العباس بن سعيد الجوهري في بغداد في خدمة المأمون وكان من أهل بيت الحكمة، وأسهم في أرصاد الشمس والقمر والكواكب بين 829 و830م. وكلّف المأمون بتوفير آلات الرصد في دمشق سنة 832–833م، فاختار لصنعها خالد بن عبد الملك المروروذي. وكتب شرحًا على «الأصول» لإقليدس ذكره ابن النديم في «الفهرست»، وفيه نحو خمسين قضية زائدة على إقليدس. وحاول فيه إثبات المسلّمة الخامسة (التوازي)، ولاحظ الطوسي بعد قرون أن البرهان لا يصح.", "did": "رصد في بغداد، وصحّح بيانات الشمس والقمر في الزيج الممتحن، وكتب شرحًا للأصول فيه إضافات، وحاول برهنة مسلّمة التوازي.", "quiz": {"q": "أي مسلّمة من مسلّمات إقليدس حاول الجوهري إثباتها في شرحه؟", "o": ["المسلّمة الأولى: رسم مستقيم بين نقطتين", "المسلّمة الخامسة: التوازي", "نظرية فيثاغورس"], "a": 1, "e": "المسلّمة الخامسة هي مسلّمة التوازي، وقد بيّن الطوسي لاحقًا أن برهان الجوهري لا يصح، وهذا جزء من قصة تطوّر الهندسة."}, "grade": "A", "caveat": "الشرح لا يصلنا إلا في إشارات وشذرات. تواريخ الميلاد والوفاة ومكانهما تقريبية، ومكان الوفاة «ربما بغداد». ربط الزيج بـ«الممتحن» بصيغة «الأرجح». عبارة «أول محاولة عربية معروفة» وردت في MacTutor بصيغة «في حدود علم الكاتب» فلا نجزم بالأولية. BEA لا يؤكد أنه رصد بنفسه في دمشق. نص كتاب الأصول للجوهري ضاع، فكل ذكر لمحتوى الإضافات تقريبي.", "sources": [{"title": "MacTutor: Al-Abbas ibn Said Al-Jawhari", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Al-Jawhari/", "note": "فُتح: التواريخ، المأمون، 829–830م، شرح الأصول، المسلّمة الخامسة، الطوسي"}, {"title": "BEA via ISMI: Jawhari", "url": "https://ismi.mpiwg-berlin.mpg.de/biography/Jawhari_BEA.htm", "note": "فُتح: أرصاد 829–830م، آلات دمشق 832–833م، المروروذي، الممتحن"}]}, {"id": "ab-ibrahim-ibn-sinan", "name": "إبراهيم بن سنان بن ثابت بن قرة", "years_ce": "نحو 908–946م (توفي وعمره 38 سنة)", "city": "بغداد", "caliph_era": "المقتدر ثم من بعده", "field": "هندسة ومزاول", "title": "إبراهيم بن سنان: عبقري مات في الثامنة والثلاثين", "story": "هو حفيد ثابت بن قرة وابن سنان طبيب الخليفة المقتدر. ولد في بغداد نحو 908م ومات فيها سنة 946م وعمره ثمانٍ وثلاثون سنة فقط. ومع ذلك ترك أعمالًا أصلية، منها «قياس القطع المكافئ» بطريقة جديدة اعتمدت على ثلاث مبرهنات وبرهان مباشر. وكتب «في آلات الأظلال» وفيه أول طريقة عامة لتصميم المزاول الشمسية المستوية في أي اتجاه.", "did": "قدّم تربيعًا أصيلًا للقطع المكافئ، وأول معالجة عامة لتصميم المزاول الأفقية والمائلة، وبرهن أن بعض خطوط الساعات ليست مستقيمة وكان جده قد ذكر ذلك دون برهان.", "quiz": {"q": "ماذا يعالج كتاب إبراهيم بن سنان «في آلات الأظلال»؟", "o": ["تصميم المزاول الشمسية على أسطح مستوية مختلفة", "علاج الأمراض بالأعشاب", "قياس عمق البحار"], "a": 0, "e": "ذكر المصدر أنه أول طريقة عامة لتصميم مزاول مستوية في أي اتجاه."}, "grade": "B", "caveat": "المصدران (DSB عبر MacTutor، ونص Encyclopedia.com) يبدوان من أصل واحد هو Complete Dictionary of Scientific Biography، فلا يُعدّان مستقلّين؛ لذلك الدرجة B لا A. مكان الولادة بعلامة استفهام في المصدر. نص «في آلات الأظلال» وصلنا جزئيًّا (الكتاب الأول وجزء من الثاني). رسالة الأسطرلاب منسوبة له بخلاف. نتائج المزاول غير المستوية معروفة من سيرته الذاتية فقط. لم نذكر الاضطهاد والتحول الديني لأسرته لحساسيته وعدم وضوحه. إن وُجد مصدر مستقل فيُرقّى.", "sources": [{"title": "DSB (MacTutor PDF): Ibrahim ibn Sinan", "url": "https://mathshistory.st-andrews.ac.uk/DSB/Sinan.pdf", "note": "فُتح: التواريخ، العائلة، القطع المكافئ، آلات الأظلال"}, {"title": "Encyclopedia.com: Ibrahim Ibn Sinan Ibn Thabit Ibn Qurra", "url": "https://www.encyclopedia.com/doc/1G2-2830905786.html", "note": "فُتح: 908–946م، أعمال، شكوك. (أما الرابط 1G2-2830902123 فهو لشخص آخر ولم يُستعمل)"}]}, {"id": "ab-al-quhi", "name": "أبو سهل ويجن بن رستم القوهي (الكوهي)", "years_ce": "نحو 940–1000م (تقديري؛ ونشاطه 970–1000م بحسب DSB)", "city": "بغداد (أصله من طبرستان على الأرجح)", "caliph_era": "العصر العباسي تحت نفوذ البويهيين (عضد الدولة وشرف الدولة)", "field": "هندسة وفلك وآلات", "title": "القوهي والبركار التام", "story": "عاش القوهي في بغداد في ظل ثلاثة أمراء بويهيين، وكان من أمهر صنّاع الآلات والهندسة. ابتكر «البركار التام»، وهو بركار تتغير إحدى ساقيه، ليرسم به الخطوط المستقيمة والدوائر والقطوع المخروطية. وحلّ مسألة قطع كرة بمستوٍ بنسبة حجمين معلومة بقطع زائد مع قطع مكافئ. ويذكر MacTutor أنه أدار مرصد بغداد الذي افتُتح في يونيو 988م. ولم يسلم من الخطأ، فإحدى مبرهناته عن مراكز الثقل خاطئة، وقادت إلى قيمة غير صحيحة لنسبة محيط الدائرة هي 28/9.", "did": "اخترع البركار التام لرسم القطوع المخروطية، وكتب في الأسطرلاب وفي حجم المجسّم المكافئ، وله أكثر من ثلاثين رسالة بحسب DSB، وحلّ مسائل تؤدي إلى معادلات تربيعية وتكعيبية بتقاطع قطوع.", "quiz": {"q": "ما الأداة التي ابتكرها القوهي ليرسم بها القطوع المخروطية؟", "o": ["البركار التام", "الساعة المائية", "المنقلة"], "a": 0, "e": "ذكر المصدران أن «البركار التام» ساقه متغيرة الطول، ويرسم القطوع المخروطية وغيرها."}, "grade": "B", "caveat": "تواريخ الميلاد والوفاة تقريبية جدًا: نحو 940–1000م في MacTutor، ونحو 970–1000م (نشاط) في DSB. مرصد 988م ورد في MacTutor وحده، وDSB لا يؤكده؛ ويؤيده جزئيًّا BEA عن البوزجاني بذكر قوهي صانع آلات ومرصد بغداد لشرف الدولة. الاسمان القوهي/الكوهي. أصله من طبرستان استنتاج من لقبه. غير مؤكد أن «البركار التام» و«في البركار الكامل» عملان مختلفان. لا يُنسب إليه هنا خطأ π إلا بصيغة المصادر المتحفظة.", "sources": [{"title": "MacTutor: Abu Sahl Waijan ibn Rustam al-Quhi", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Al-Quhi/", "note": "فُتح: الأصل، بغداد، المرصد 988م، البركار التام، مسألة الكرة، خطأ مبرهنة مركز الثقل"}, {"title": "Encyclopedia.com: Quhi (or Al-Kuhi)", "url": "https://www.encyclopedia.com/science/dictionaries-thesauruses-pictures-and-press-releases/quhi-or-al-kuhi-abu-sahl-wayjan-ibn-rustam-al", "note": "فُتح: الرعاة البويهيون، أعماله، البركار، π=28/9"}, {"title": "BEA (McGill): Buzjani (للإشارة إلى الكوهي صانع الآلات والمرصد)", "url": "https://islamsci.mcgill.ca/RASI/BEA/Buzjani_BEA.htm", "note": "فُتح: مرصد بغداد لشرف الدولة، الكوهي صانع آلات مشهور"}]}, {"id": "ab-al-nayrizi", "name": "أبو العباس الفضل بن حاتم النيريزي", "years_ce": "نشِط نحو 897م، وتوفي نحو 922م (تقريبي)", "city": "بغداد (من نيريز بفارس على الأرجح)", "caliph_era": "المعتضد بالله ثم المكتفي", "field": "هندسة وفلك", "title": "النيريزي الذي صار «أناريتيوس» في أوروبا", "story": "نسبته إلى نيريز قرب شيراز، وعمل في بغداد على الأرجح في عهد المعتضد. أشهر ما بقي له شرحه على «الأصول» لإقليدس، المبني على ترجمة الحجّاج الثانية، وقد نقله جيرارد الكريموني إلى اللاتينية فعُرف مؤلفه هناك باسم «أناريتيوس». كتب للمعتضد رسالة في آلات لقياس المسافات والارتفاعات وأعماق الآبار وعرض الأنهار، ورسالة في الأسطرلاب الكروي، ورسالة في القبلة استعمل فيها ما يعادل الظل في المثلثات.", "did": "شرح الأصول وحفظ فيه نصوصًا يونانية ضاعت أصولها كشرح هيرون، وصنّف في الأسطرلاب الكروي وآلات المساحة والقبلة.", "quiz": {"q": "ما الاسم اللاتيني الذي عُرف به النيريزي في أوروبا؟", "o": ["أناريتيوس", "ألبتاجنيوس", "أفيسينا"], "a": 0, "e": "ذكر DSB أن اسم «Anaritius» في الترجمة اللاتينية لشرحه هو أصل الصيغة اللاتينية لاسمه."}, "grade": "A", "caveat": "التواريخ متضاربة: DSB يعطي نشاطه نحو 897م ووفاته نحو 922م، وMacTutor يعطي في الجدول 865–922م وفي العنوان 875–940م. بلده وانتقاله إلى بغداد استنتاج من لقبه وإهداءاته. رعاية المعتضد «على الأرجح». شروحه الفلكية مفقودة وتُعرف من الببليوغرافيين. هوية «أغانيس» الذي ينقل عنه برهان التوازي غير محسومة (أغابيوس أرجح). المخطوطة العربية ناقصة والنسخة اللاتينية تحفظ الجزء الناقص.", "sources": [{"title": "DSB (MacTutor PDF): Al-Nayrizi", "url": "https://mathshistory.st-andrews.ac.uk/DSB/Al-Nayrizi.pdf", "note": "فُتح: التواريخ، المعتضد، شرح الأصول، أناريتيوس، الآلات، القبلة"}, {"title": "MacTutor: Al-Nayrizi", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Al-Nayrizi/", "note": "فُتح: الفهرست، ثمانية أعمال، شرح الأصول مبني على الحجاج الثانية"}]}, {"id": "ab-al-khujandi", "name": "أبو محمود حامد بن الخضر الخجندي", "years_ce": "نحو 940–1000م (تقريبي؛ BEA: نحو 945–1000م)", "city": "الريّ (قرب طهران)، وأصله من خُجَند", "caliph_era": "العصر العباسي تحت نفوذ البويهيين (فخر الدولة 976–997م)", "field": "فلك وآلات رصد", "title": "الخجندي والسُّدس الفخري العملاق", "story": "جاء الخجندي من خُجَند على نهر سيحون، وعمل في الريّ قرب طهران برعاية الأمير البويهي فخر الدولة. بنى سنة 994م آلة رصد ضخمة هي «السُّدس الفخري»، قوسها ستون درجة من دائرة نصف النهار وقطرها نحو 43 مترًا بحسب BEA. استعملها في رصد عبور الشمس قرب الانقلابين الصيفي والشتوي، فقاس ميل دائرة البروج بـ23°32′19″، وحدّد عرض الريّ بدقة نحو دقيقة قوسية. وقد عزا البيروني النقص الصغير في دقة القياس إلى هبوط المبنى بتأثير وزنه.", "did": "صنع آلة رصد ضخمة ذات تدريج أدق من الدقائق، وقاس ميل دائرة البروج وعرض الريّ. وادّعى أن مجموع مكعبين لا يكون مكعبًا لكن برهانه كان خاطئًا بحسب الخازن.", "quiz": {"q": "ما اسم آلة الرصد العملاقة التي بناها الخجندي قرب الريّ؟", "o": ["السدس الفخري", "الأسطرلاب المسطّح", "ذات الحلق"], "a": 0, "e": "ذكر BEA أن الآلة سُميت «السدس الفخري» نسبة إلى فخر الدولة، وقد قاس بها الميل الكلي."}, "grade": "A", "caveat": "تواريخ الولادة تقريبية (نحو 940م عند MacTutor ونحو 945م عند BEA). الأصل من خُجَند مستند إلى كلام الطوسي، وكونه من أمراء المنطقة احتمال. القطر 43 م من BEA فقط، وMacTutor لا يذكر الأبعاد. خلاف: MacTutor يقول إن تدريج الآلة بالثواني، وBEA يقول بتدريج 10 دقائق قوسية؛ فلا نجزم بدقة التدريج. خطأ برهانه في المكعبات ثابت في MacTutor، ولا يصحّ تسميته «نظرية فيرما» دون توضيح. نسبة مبرهنة الجيب إليه مشكوك فيها وغير مذكورة هنا.", "sources": [{"title": "MacTutor: Abu Mahmud Hamid ibn al-Khidr Al-Khujandi", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Al-Khujandi/", "note": "فُتح: خُجند، الريّ، فخر الدولة، السدس 994م، الميل 23°32′19″، خطأ المكعبات"}, {"title": "BEA (McGill): Khujandi", "url": "https://islamsci.mcgill.ca/RASI/BEA/Khujandi_BEA.pdf", "note": "فُتح: السدس الفخري، قوس 60°، قطر نحو 43 م، تفسير البيروني"}]}, {"id": "ab-al-mahani", "name": "أبو عبد الله محمد بن عيسى الماهاني", "years_ce": "نحو 820–880م", "city": "ماهان (كرمان) ثم بغداد", "caliph_era": "من المتوكل إلى المعتمد تقريبًا", "field": "هندسة وجبر وفلك", "title": "الماهاني ومعادلة الكرة التي أعجزته", "story": "ينتسب الماهاني إلى ماهان في كرمان، ويُعرف عن حياته القليل. سجّل ابن يونس أرصاده بين 853 و866م، ومنها خسوفات قمرية، وقد جاء ابتداء ثلاثة منها متأخرًا نحو نصف ساعة عمّا حسبه. وحاول أن يحلّ جبريًّا مسألة أرخميدس: كيف تقطع كرة بمستوٍ ليكون حجما الجزأين بنسبة معلومة؟ فانتهى إلى معادلة تتضمن مكعبًا ومربعًا وعددًا ولم يستطع حلّها، فحلّها بعده الخازن بالقطوع المخروطية. وكتب أيضًا في النسبة والنسب الصمّاء عند إقليدس.", "did": "رصد الخسوفات القمرية، وكتب شروحًا على الكتابين الخامس والعاشر من الأصول، وسعى لحل مسألة كروية أرخميدسية جبريًّا.", "quiz": {"q": "ما المسألة الأرخميدسية التي حاول الماهاني حلها جبريًّا؟", "o": ["قطع كرة بمستوٍ لتكون نسبة حجمي الجزأين معلومة", "تربيع الدائرة", "مضاعفة المكعب بالمسطرة والبركار"], "a": 0, "e": "ذكر MacTutor أنه وقع على معادلة تكعيبية عجز عن حلها، وحلّها بعده جعفر الخازن بالقطوع المخروطية."}, "grade": "B", "caveat": "المصدر الثاني (Encyclopedia.com) موجز جدًّا ولا يذكر الأرصاد والمعادلة التكعيبية، فيستند أكثر القصة إلى MacTutor. تفاصيل منهجه الجبري تصلنا من الخيام لاحقًا لا من نصوصه. أكثر آثاره مفقودة. لم يؤكد المصدر أنه رصد كسوفات شمسية. مكان وفاته ورد في جدول MacTutor (بغداد) دون تفصيل. لا يُسمّى «معادلة الماهاني» لأن المصدر لا يستعمل هذا الاسم.", "sources": [{"title": "MacTutor: Al-Mahani", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Al-Mahani/", "note": "فُتح: 820–880م، ماهان، أرصاد 853–866م، مسألة الكرة، الخازن"}, {"title": "Encyclopedia.com: Al-Mahani", "url": "https://www.encyclopedia.com/science/encyclopedias-almanacs-transcripts-and-maps/al-mahani-also-known-abu-abd-allah-muhammad-ibn-isa", "note": "فُتح: التواريخ، شروح الأصول، مسائل أرخميدس، مصدر مختصر"}]}, {"id": "ab-ibn-masawayh", "name": "يوحنا بن ماسويه", "years_ce": "777–857م (تقريبًا)", "city": "بغداد وسامراء", "caliph_era": "خدم أربعة من الخلفاء العباسيين؛ تذكر المراجع المأمون والمعتصم منهم", "field": "طب وطب العيون", "title": "الطبيب الذي شرّح القردة", "story": "وُلد يوحنا بن ماسويه في أسرة أطباء من جنديسابور، ثم استقر في بغداد. صار طبيبًا خاصًّا لأربعة من الخلفاء، وأدار بيمارستانًا في بغداد. كان له مجلس منتظم يفحص فيه المرضى ويشرح لتلاميذه، ومنهم حنين بن إسحاق. وتذكر بعض المراجع أن الخليفة المعتصم زوّده بقردة ليشرّحها في أبحاثه.", "did": "ألّف رسائل في العيون والحميات والصداع والسوداء والتغذية والجذام وامتحان الأطباء. ويُعدّ كتابه «دَغَل العين» أقدم مصنَّف عربي منهجي في طب العيون وصل إلينا. ترجم كتبًا طبية يونانية إلى السريانية وكتب مؤلفاته بالعربية.", "quiz": {"q": "ما موضوع كتاب يوحنا بن ماسويه «دَغَل العين»؟", "o": ["أمراض العين", "حركة النجوم", "بناء القناطر"], "a": 0, "e": "عنوانه «اضطراب العين»، وهو من أقدم ما وصلنا في طب العيون بالعربية."}, "grade": "B", "caveat": "التواريخ تقريبية (الولادة نحو 777م). أصله وأبوه وأمه مروية عن ابن أبي أصيبعة وابن سينا بصيغة «يُروى». أسماء الخلفاء الأربعة لم أجدها في المصادر التي فتحتها. خبر تشريح القردة وإهداء المعتصم لها ورد في ويكيبيديا (عن مراجع) وفي موسوعة Science and Its Times دون نص أصيل فتحته. موسوعة encyclopedia.com تذكر له 924–1015م وهو خطأ ظاهر يخالف المصدرين الآخرين. اسمه اللاتيني Mesue ينسب إليه كتبًا ليست كلها له، فلا تُنسب إليه كتب اللاتين بلا تدقيق. يلزم تحقق بشري من أصل ابن أبي أصيبعة.", "sources": [{"title": "Masawaiyh — Wikipedia", "url": "https://en.wikipedia.org/wiki/Masawaiyh", "note": "فتحتها: 777–857م تقريبًا، دغل العين، تشريح القردة، تلميذه حنين، وتسرد مراجعها."}, {"title": "NLM — Arabic Medical Manuscripts: biographies (Y), Yuhanna ibn Masawayh", "url": "https://www.nlm.nih.gov/hmd/arabic/bioY.html", "note": "فتحتها: 161–243هـ/777–857م، جنديسابور، طبيب أربعة خلفاء، مجلسه وتلميذه حنين."}, {"title": "Yuhanna ibn Masawaih — Science and Its Times (encyclopedia.com)", "url": "https://www.encyclopedia.com/science/encyclopedias-almanacs-transcripts-and-maps/yuhanna-ibn-masawaih", "note": "فتحتها: تشريح القردة وأكثر من 30 مؤلفًا، لكن تواريخها (924–1015) خاطئة ولا يُعتمد عليها."}]}, {"id": "ab-ali-ibn-rabban-tabari", "name": "علي بن سهل ربّن الطبري", "years_ce": "نحو 778–بعد 864م (تقدير)", "city": "طبرستان ثم سامراء وبغداد", "caliph_era": "أُلّف كتابه نحو 850م (أواخر عهد المتوكل)", "field": "طب", "title": "«فردوس الحكمة»: أول موسوعة طبية في كتاب واحد", "story": "وُلد علي بن ربّن الطبري في أسرة سريانية مسيحية، وأبوه من كبار الموظفين. جمع في نحو سنة 850م معارف الطب اليوناني والهندي والسرياني في كتاب واحد سمّاه «فردوس الحكمة». قسّمه إلى سبعة أنواع ومئات الأبواب تغطي التشريح والتغذية والأمراض والأدوية. ويصفه الباحثون بأنه من أوائل الموسوعات الطبية الجامعة في الإسلام.", "did": "جمع في كتاب واحد الطب (التشريح، الغذاء، الأمراض، الأدوية والسموم) وأضاف أقسامًا في الجنين والنفس والفلك وطب الهند، ونقل عن أبقراط وجالينوس وديسقوريدس وأطباء الهند. حقّق الكتاب محمد زبير صديقي وطُبع في برلين سنة 1928م بعد وفاة المستشرق براون الذي بدأ تحقيقه.", "quiz": {"q": "كم نوعًا (قسمًا كبيرًا) في «فردوس الحكمة» حسب المراجع؟", "o": ["ثلاثة", "سبعة", "اثنا عشر"], "a": 1, "e": "قسّمه مؤلفه إلى سبعة أنواع (أنواع = أقسام كبرى)."}, "grade": "B", "caveat": "مولده ووفاته غير مؤكدين (تقدير 778–779م، ويرى بروكلمان وماير تواريخ أخرى). عدد الأبواب 365 في مصدر و360 في آخر. المراجع تختلف في الراعي: ماذيار بن قارن أثناء التأليف، والمتوكل مُهدى إليه. زمن إسلامه (نحو 850م) وعلاقته بتمام الكتاب غير واضحة. قولهم إنه أستاذ الرازي رفضه الباحث الذي قرأتُه لأن الطبري سبق الرازي؛ فلا يُذكر. هذه الخلافات لا تمس أصل الإنجاز.", "sources": [{"title": "Ali ibn Sahl Rabban al-Tabari — Muslim Heritage", "url": "https://muslimheritage.com/al-tabari-paradise-of-wisdom/", "note": "فتحتها: الأنواع السبعة، 365 بابًا، 850م تقريبًا، أصله المسيحي، رفض كونه أستاذ الرازي، والتحفظات على التواريخ."}, {"title": "Paradise of Wisdom — Wikipedia", "url": "https://en.wikipedia.org/wiki/Paradise_of_Wisdom", "note": "فتحتها: سبعة أنواع و360 بابًا، إهداؤه للمتوكل، المصادر اليونانية، تحقيق صديقي 1928م."}]}, {"id": "ab-sinan-ibn-thabit-exam", "name": "سنان بن ثابت بن قرّة", "years_ce": "نحو 880–943م", "city": "بغداد", "caliph_era": "المقتدر (295–320هـ)، وخدم القاهر والراضي بعده", "field": "طب وتنظيم المهنة", "title": "امتحان الأطباء في بغداد سنة 931م", "story": "في عهد الخليفة المقتدر، تقول الرواية المشهورة إن مريضًا مات بسبب خطأ طبيب. فأمر الخليفة بأن يُمتحن من يزاول الطب في بغداد، وتولى ذلك كبير أطبائه سنان بن ثابت، ابن عالم الرياضيات ثابت بن قرة. وتذكر مراجع حديثة أن أكثر من 860 طبيبًا فُحصوا في السنة الأولى، وأن الممارسين المشهورين استُثنوا. وصار الأمر تقليدًا يشرف عليه المحتسب.", "did": "أشرف على اختبار الأطباء وإعطاء الإذن بالمزاولة، وتذكر موسوعة DSB أنه أدار مستشفيات بغداد وإدارتها الطبية في عهد المقتدر، ويعالج المسلمين وغيرهم.", "quiz": {"q": "من أمر بامتحان الأطباء في بغداد سنة 931م بحسب الرواية؟", "o": ["الخليفة المقتدر", "الخليفة المأمون", "الخليفة الراضي"], "a": 0, "e": "تنسب الرواية الأمر إلى المقتدر وتجعل سنانًا بن ثابت منفِّذه."}, "grade": "B", "caveat": "السبب (وفاة مريض بخطأ طبيب) رواية شائعة؛ دراسة في Hektoen تعدّها غير مؤكدة وتقترح أن لسنان دورًا ومصلحة، وهذا اجتهاد لا حقيقة موثقة. رقم 860 يرد في مصدرين حديثين دون عزو أصيل فتحته (ابن أبي أصيبعة وابن القفطي مذكوران في مراجع لم أقرأ نصها). اختلفت المصادر هل انتهى الامتحان بوفاة المقتدر 932م. أحداث اضطهاد الصابئة وإكراه سنان على الإسلام في عهد القاهر وردت في موسوعة DSB. التاريخ الهجري تقريبي (931م ≈ 319هـ).", "sources": [{"title": "Complete Dictionary of Scientific Biography: Sinan ibn Thabit (encyclopedia.com)", "url": "https://www.encyclopedia.com/science/dictionaries-thesauruses-pictures-and-press-releases/sinan-sinan-ibn-thabit-ibn-qurra-abu-said", "note": "فتحتها: 880–943م، ابن ثابت بن قرة، طبيب المقتدر والقاهر والراضي، امتحان 931م بعد قضية خطأ طبي، مصادره ابن القفطي وابن أبي أصيبعة."}, {"title": "Certifying clinical competence: principles from the caliphate of al-Muqtadir — Hektoen International", "url": "https://hekint.org/2020/03/09/certifying-clinical-competence-principles-from-the-caliphate-of-al-muqtadir/", "note": "فتحتها: أمر المقتدر 931م، دور سنان، شكوك الباحثين في الرواية، توقف الامتحان بعد 932م."}, {"title": "Medical education in medieval Islam — Hektoen International", "url": "https://hekint.org/2017/01/29/medical-education-in-medieval-islam/", "note": "فتحتها: فحص 860 طبيبًا في بغداد سنة 931م مع تحفظ على وجود نظام موحد."}, {"title": "Qatar Medical Journal editorial 2012 (qscience)", "url": "https://www.qscience.com/content/journals/10.5339/qmj.2012.1.4", "note": "فتحتها (الملخص فقط): أكثر من 860 فُحصوا في السنة الأولى، والمحتسب يراقب الصيادلة؛ دون مراجع."}]}, {"id": "ab-adudi-bimaristan", "name": "البيمارستان العضدي", "years_ce": "نحو 981–1258م", "city": "بغداد", "caliph_era": "أسسه عضد الدولة البويهي في خلافة الطائع", "field": "طب ومستشفيات", "title": "مستشفى بغداد الذي صار مدرسة", "story": "في سنة 981م تقريبًا أتم عضد الدولة بناء بيمارستان على أعلى الضفة الغربية لدجلة في بغداد. موّله من أملاكه الخاصة، وكان مدرسة لطلاب الطب يتابعون الأطباء بين المرضى ويحضرون الدروس. ضم أطباء من تخصصات مثل الجراحة والعيون والجبر، وعُرف بسعته وفخامته. وبقي يعمل حتى سقوط بغداد سنة 1258م.", "did": "أنشأ مستشفى تعليميًا بالمعنى الكامل: مرضى وأطباء وطلاب ومكتبة طبية. وظلت دار الدواء فيه تنتج وتعدّل كتب الأدوية، ومنها نسخة معدّلة من «أقرباذين سابور بن سهل» أعدّها أطباؤه.", "quiz": {"q": "ما الذي جعل البيمارستان العضدي أكثر من مجرد مكان لعلاج المرضى؟", "o": ["كان سوقًا للتجار", "كان مدرسة يتعلم فيها طلاب الطب", "كان مرصدًا فلكيًا"], "a": 1, "e": "كان مستشفى تعليميًا يحضر فيه الطلاب الدروس ويتابعون الأطباء."}, "grade": "A", "caveat": "اقتصرتُ على ما اتفقت عليه المراجع: التأسيس نحو 981م على يد عضد الدولة في بغداد، والتعليم، والدمار سنة 1258م. تفاصيل الأعداد (24 طبيبًا ثم 28) وترميم الفيضان 1068م وردت في ويكيبيديا فقط فلم أجزم بها. أُسقطت رواية اختيار الرازي موقع المستشفى بتعليق اللحم (انظر rejected.json).", "sources": [{"title": "Al-'Adudi Hospital — Wikipedia", "url": "https://en.wikipedia.org/wiki/Al-%27Adudi_Hospital", "note": "فتحتها: 981م، عضد الدولة، الموقع، التعليم، 1258م، وتصف رواية الرازي بأنها «يُقال»."}, {"title": "The oldest Bimaristan teaching in Baghdad during the era of Adud al-Dawla —
