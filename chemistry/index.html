<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="محمد الراجحي">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="محمد الراجحي: تطبيق كيمياء تفاعلي: الضوء والذرة، الجدول الدوري، الأيونات والروابط.">
<meta name="theme-color" content="#f6f4fb">
<title>محمد الراجحي</title>
<style>
@property --c{syntax:'<color>';inherits:true;initial-value:#4f46e5}
:root{
  --c:#4f46e5;
  --bg:#f6f4fb;--card:#ffffff;--ink:#1d1b2e;--muted:#66637d;--line:#e3dff0;
  --good:#16965a;--bad:#d93a49;--warn:#e89a00;
  --shadow:0 6px 18px rgba(40,20,90,.09);
  --c2:#ece8ff;
  --c2:color-mix(in srgb,var(--c) 13%,var(--card));
  --cd:color-mix(in srgb,var(--c) 68%,#12002e);
  --ct:color-mix(in srgb,var(--c) 82%,#000);
  transition:--c .5s ease;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11101a;--card:#1c1b2b;--ink:#f1effa;--muted:#a6a3bf;--line:#34324b;
    --good:#3ddc97;--bad:#ff6b78;--warn:#ffc24a;
    --shadow:0 6px 18px rgba(0,0,0,.4);
    --c2:color-mix(in srgb,var(--c) 20%,var(--card));
    --ct:color-mix(in srgb,var(--c) 65%,#fff);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11101a;--card:#1c1b2b;--ink:#f1effa;--muted:#a6a3bf;--line:#34324b;
  --good:#3ddc97;--bad:#ff6b78;--warn:#ffc24a;
  --shadow:0 6px 18px rgba(0,0,0,.4);
  --c2:color-mix(in srgb,var(--c) 20%,var(--card));
  --ct:color-mix(in srgb,var(--c) 65%,#fff);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic","Noto Naskh Arabic","Geeza Pro",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.85;transition:background .3s,color .3s}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--c);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- background fx ---------- */
.bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bgfx span{position:absolute;color:var(--c);opacity:.07;font-weight:800;direction:ltr;white-space:nowrap;animation:drift var(--d,24s) ease-in-out var(--dl,0s) infinite alternate}
@keyframes drift{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-34px) rotate(8deg)}}

/* ---------- layout ---------- */
#app{position:relative;z-index:1;height:100vh;height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto}
.top{display:flex;align-items:center;gap:6px;padding:max(8px,env(safe-area-inset-top)) 16px 4px}
.logo{display:flex;align-items:center;gap:6px;min-height:44px;min-width:0;flex:1;background:none;border:0;padding:0;font-weight:800;font-size:15px;text-align:start}
.logo .lg{font-size:24px;line-height:1;flex:none}
.logo .lt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:linear-gradient(90deg,var(--ct),var(--ink));-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;border-radius:19px;background:var(--card);border:1.5px solid var(--line);font-weight:800;font-size:14px;box-shadow:var(--shadow);white-space:nowrap;flex:none}
.stats b{font-variant-numeric:tabular-nums}
.stats.pop{animation:pop .45s ease}
@keyframes pop{40%{transform:scale(1.18)}}
.ib{position:relative;flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);box-shadow:var(--shadow);font-size:20px;padding:0 10px;font-weight:700}
.ib small{font-size:13px;display:none}
.ib .bdg{position:absolute;top:-5px;inset-inline-start:-5px;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;line-height:20px;text-align:center;padding:0 5px}
.ib .bdg:empty{display:none}
@media(min-width:560px){.ib.wide small{display:inline}}

.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:6px 16px 8px}
.tab{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:60px;padding:6px 4px 9px;border-radius:16px;border:2px solid color-mix(in srgb,var(--tc) 38%,transparent);background:color-mix(in srgb,var(--tc) 11%,var(--card));font-weight:800;font-size:12.5px;line-height:1.35;text-align:center;transition:background .3s,color .3s,transform .2s,box-shadow .3s}
.tab .ti{font-size:21px;line-height:1}
.tab .tp{position:absolute;inset-inline:0;bottom:0;height:4px;background:color-mix(in srgb,var(--tc) 20%,transparent)}
.tab .tp u{display:block;height:100%;width:0;background:var(--tc);transition:width .5s;text-decoration:none;border-radius:0 4px 4px 0}
.tab.on{background:linear-gradient(145deg,var(--tc),color-mix(in srgb,var(--tc) 70%,#12002e));border-color:transparent;color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--tc) 45%,transparent);transform:translateY(-1px)}
.tab.on .tp{background:rgba(255,255,255,.3)}.tab.on .tp u{background:#fff}
@media(min-width:700px){.tab{flex-direction:row;gap:10px;font-size:16px;min-height:56px;padding:6px 12px 9px}.tab .ti{font-size:24px}}

main{min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;touch-action:pan-y}
.wrap{max-width:920px;margin:0 auto;padding:10px 16px 28px}

.bar{display:flex;align-items:center;gap:8px;padding:8px 16px max(10px,env(safe-area-inset-bottom));background:var(--card);border-top:1.5px solid var(--line);box-shadow:0 -6px 18px rgba(30,10,70,.06)}
.nb{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:52px;min-height:52px;padding:0 14px;border-radius:16px;border:2px solid var(--c);font-weight:800;font-size:15px;transition:transform .15s,background .3s,box-shadow .3s}
.nb:active{transform:scale(.95)}
.nb.next{background:var(--c);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--c) 40%,transparent)}
.nb.prev{background:var(--card);color:var(--ct)}
.nb em{font-style:normal;display:none}
.nb.next.wide em,.nb.next.wide{display:inline-flex}
.nb.next.wide{padding:0 12px;font-size:13.5px}
@media(min-width:560px){.nb em{display:inline}}
.mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px}
.cnt{font-size:12px;font-weight:700;color:var(--muted);line-height:1.2}
.segs{display:flex;align-items:center;gap:1.5px;width:100%;height:30px;cursor:pointer}
.segs i{flex:1;height:7px;border-radius:3px;background:var(--line);transition:background .25s,height .25s}
.segs i.d{background:color-mix(in srgb,var(--c) 55%,transparent)}
.segs i.cu{background:var(--c);height:15px}

/* ---------- hero ---------- */
.hero-top{text-align:center;padding:8px 0 14px}
.mol{font-size:56px;line-height:1.1;display:inline-block;animation:floaty 4s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-8px) rotate(6deg)}}
.hero h1{margin:2px 0 0;font-size:clamp(28px,7vw,44px);line-height:1.3;background:linear-gradient(90deg,#8B3DFF,#00A896,#FF7A00);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{margin:4px auto 14px;max-width:34em;color:var(--muted)}
.go{min-height:54px;padding:0 34px;border-radius:18px;border:0;background:linear-gradient(135deg,var(--c),var(--cd));color:#fff;font-weight:800;font-size:19px;box-shadow:0 10px 24px color-mix(in srgb,var(--c) 40%,transparent);transition:transform .15s}
.go:active{transform:scale(.96)}
.hcards{display:grid;gap:12px;margin-top:6px}
@media(min-width:760px){.hcards{grid-template-columns:repeat(3,minmax(0,1fr))}}
.hcard{position:relative;overflow:hidden;text-align:start;border:0;border-radius:24px;padding:18px;min-height:150px;color:#fff;background:linear-gradient(145deg,var(--tc),color-mix(in srgb,var(--tc) 62%,#12002e));box-shadow:0 12px 26px color-mix(in srgb,var(--tc) 35%,transparent);transition:transform .2s}
.hcard:hover{transform:translateY(-3px)}.hcard:active{transform:scale(.98)}
.hcard .hi{position:absolute;inset-inline-end:10px;top:-6px;font-size:84px;line-height:1;opacity:.28}
.hcard .hn1{font-size:13px;font-weight:700;opacity:.9}
.hcard .ht{font-size:21px;font-weight:800;line-height:1.4;margin:2px 0 4px}
.hcard .hs{font-size:14px;opacity:.95}
.hcard .hb{height:8px;border-radius:4px;background:rgba(255,255,255,.28);margin:10px 0 4px;overflow:hidden}
.hcard .hb u{display:block;height:100%;background:#fff;border-radius:4px;text-decoration:none}
.sign{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.5px;margin:20px 0 0;direction:ltr}

/* ---------- slide ---------- */
.slide.in-next{animation:inN .38s cubic-bezier(.2,.8,.3,1) both}
.slide.in-prev{animation:inP .38s cubic-bezier(.2,.8,.3,1) both}
.slide.in-fade{animation:inF .4s ease both}
@keyframes inN{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes inP{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inF{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kbadge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--ct);background:var(--c2);padding:2px 12px;border-radius:20px;margin-bottom:2px}
.s-head{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.s-no{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:36px;padding:0 6px;border-radius:12px;background:var(--c);color:#fff;font-weight:800;font-size:15px}
.s-head h2{margin:0;font-size:clamp(20px,5vw,28px);line-height:1.4}
.s-body{min-width:0;overflow-wrap:anywhere}
.s-body img,.s-body svg,.s-body canvas,.s-body video{max-width:100%;height:auto}
.s-body p{margin:.5em 0}
.s-body h3{margin:.9em 0 .3em;color:var(--ct);font-size:1.15em}
.s-body ul,.s-body ol{padding-inline-start:24px;margin:.4em 0}
.s-body li{margin:.2em 0}
.s-body input[type=range]{accent-color:var(--c);max-width:100%}
.s-body sup,.s-body sub{line-height:0}
.s-body>*+*{margin-top:12px}
.s-body>p+p,.s-body>.card+.card{margin-top:12px}
.s-checks{margin-top:18px}
.ck-h{margin:0 0 8px;font-size:17px;color:var(--ct)}
.slide.k-summary{position:relative;padding:16px;border-radius:26px;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,var(--c),#ffb703,var(--c)) border-box;border:3px solid transparent;box-shadow:var(--shadow)}
.slide.k-summary .kbadge{background:linear-gradient(135deg,#ffb703,#ff7a00);color:#2b1700}

/* ---------- content classes ---------- */
.idea{position:relative;overflow:hidden;padding:18px 18px 18px 18px;border-radius:22px;background:linear-gradient(135deg,var(--c),var(--cd));color:#fff;font-size:clamp(18px,4.6vw,23px);font-weight:800;line-height:1.7;box-shadow:0 10px 24px color-mix(in srgb,var(--c) 32%,transparent)}
.idea::after{content:"⚛";position:absolute;inset-inline-end:-6px;bottom:-26px;font-size:96px;opacity:.14;line-height:1}
.idea *{color:inherit}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.card>h3:first-child,.card>h4:first-child{margin-top:0}
.grid2,.grid3{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media(min-width:640px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:840px){.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.analogy{display:flex;align-items:flex-start;gap:12px;padding:14px;border-radius:18px;background:var(--c2);border-inline-start:6px solid var(--c)}
.analogy .ico{flex:none;font-size:34px;line-height:1.2}
.steps{list-style:none;counter-reset:st;padding:0!important;margin:0}
.steps>li{counter-increment:st;position:relative;min-height:38px;padding:4px 50px 8px 0;margin:6px 0}
.steps>li::before{content:counter(st,arabic-indic);position:absolute;inset-inline-start:0;top:2px;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--c),var(--cd));color:#fff;font-weight:800;font-size:18px;line-height:38px;text-align:center;box-shadow:0 4px 10px color-mix(in srgb,var(--c) 38%,transparent)}
.steps>li:not(:last-child)::after{content:"";position:absolute;inset-inline-start:18px;top:42px;bottom:-6px;width:2px;background:color-mix(in srgb,var(--c) 30%,transparent)}
.flip{position:relative;display:grid;cursor:pointer;margin:10px 0;min-height:76px;user-select:none;-webkit-user-select:none}
.flip>.fq,.flip>.fa{grid-area:1/1;padding:14px 16px;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .6s cubic-bezier(.3,.7,.3,1);display:flex;flex-direction:column;justify-content:center}
.flip>.fq{background:var(--card);border:2px dashed var(--c);font-weight:700;transform:perspective(900px) rotateY(0)}
.flip>.fq::after{content:"👆 اضغط لترى الجواب";display:block;margin-top:4px;font-size:12px;font-weight:700;color:var(--ct);opacity:.85}
.flip>.fa{background:linear-gradient(135deg,var(--c),var(--cd));color:#fff;border:2px solid transparent;transform:perspective(900px) rotateY(180deg)}
.flip.on>.fq{transform:perspective(900px) rotateY(-180deg)}
.flip.on>.fa{transform:perspective(900px) rotateY(0)}
.eq{direction:ltr;text-align:center;font-weight:700;font-size:clamp(17px,4.4vw,22px);line-height:1.9;padding:12px 14px;border-radius:16px;background:var(--c2);border:1.5px solid color-mix(in srgb,var(--c) 35%,transparent);overflow-x:auto;overflow-y:hidden}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.note,.warn,.good{padding:12px 14px;border-radius:16px;border-inline-start:6px solid var(--c);background:var(--c2)}
.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,var(--card))}
.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 15%,var(--card))}
.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 10px;border-radius:20px;background:var(--c2);color:var(--ct);font-size:13px;font-weight:800;line-height:1.7;vertical-align:middle}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;padding:0 16px;border-radius:22px;border:2px solid var(--c);background:var(--card);color:var(--ct);font-weight:700;font-size:15px;transition:background .2s,color .2s,transform .15s}
.chip:active{transform:scale(.95)}
.chip.on,.chip[aria-pressed=true]{background:var(--c);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:15px;border:0;background:linear-gradient(135deg,var(--c),var(--cd));color:#fff;font-weight:800;font-size:16px;box-shadow:0 6px 16px color-mix(in srgb,var(--c) 38%,transparent);transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--card);color:var(--ct);border:2px solid var(--c);box-shadow:none}
table.t{width:100%;border-collapse:separate;border-spacing:0;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);font-size:14.5px;line-height:1.6}
table.t th{background:var(--c);color:#fff;font-weight:800;padding:8px 8px;text-align:center}
table.t td{padding:7px 8px;border-top:1px solid var(--line);text-align:center}
table.t tr:nth-child(even) td{background:color-mix(in srgb,var(--c) 6%,var(--card))}
table.t td+td,table.t th+th{border-inline-start:1px solid var(--line)}
@media(max-width:480px){table.t{font-size:13px}table.t th,table.t td{padding:5px 4px}}
.big{font-size:clamp(22px,6vw,32px);font-weight:800;line-height:1.5}
.muted{color:var(--muted)}
.center{text-align:center}

/* ---------- questions ---------- */
.q{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:14px;margin:12px 0;box-shadow:var(--shadow)}
.q .qt{font-weight:800;font-size:17px;line-height:1.7;margin-bottom:10px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:8px 12px;text-align:start;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:600;line-height:1.6;transition:border-color .2s,background .25s,transform .12s,opacity .25s}
.opt:hover{border-color:var(--c)}
.opt:active{transform:scale(.985)}
.opt .lt{flex:none;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--c2);color:var(--ct);font-size:14px}
.opt .ot{min-width:0;flex:1;overflow-wrap:anywhere}
.q.locked .opt{pointer-events:none;cursor:default}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 17%,var(--card))}
.opt.ok .lt{background:var(--good);color:#fff}
.opt.ok::after{content:"✓";font-weight:800;color:var(--good);font-size:20px}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card));animation:shake .4s}
.opt.no .lt{background:var(--bad);color:#fff}
.opt.no::after{content:"✗";font-weight:800;color:var(--bad);font-size:20px}
.opt.dim{opacity:.5}
@keyframes shake{25%{transform:translateX(5px)}75%{transform:translateX(-5px)}}
.why{margin-top:10px;padding:10px 12px;border-radius:14px;border-inline-start:5px solid var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card));animation:inF .35s both}
.q.bad .why{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--card))}
.xpchip{display:inline-block;margin-inline-start:6px;padding:0 8px;border-radius:10px;background:var(--c);color:#fff;font-size:12px;font-weight:800}
.qz-top{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-weight:800;font-size:14px;color:var(--muted)}
.qz-bar{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.qz-bar u{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--cd));border-radius:5px;transition:width .4s;text-decoration:none}
.qz-act{display:flex;justify-content:center;margin-top:10px}
.res{text-align:center;padding:22px 14px;border-radius:24px;background:var(--card);border:1.5px solid var(--line);box-shadow:var(--shadow);animation:inF .4s both}
.stars{font-size:clamp(40px,12vw,58px);line-height:1.3;letter-spacing:4px;direction:ltr}
.stars span{display:inline-block;animation:starpop .6s cubic-bezier(.3,1.6,.5,1) both}
.stars span.off{filter:grayscale(1);opacity:.28}
@keyframes starpop{from{transform:scale(0) rotate(-120deg)}to{transform:scale(1) rotate(0)}}
.res .sc{font-size:30px;font-weight:800;color:var(--ct)}
.res .acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,5,25,.5);display:flex;animation:ovin .25s both}
@keyframes ovin{from{opacity:0}to{opacity:1}}
.drawer{width:min(380px,90vw);height:100%;background:var(--card);display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.3);animation:dr .3s cubic-bezier(.2,.8,.3,1) both}
@keyframes dr{from{transform:translateX(100%)}to{transform:none}}
.dh,.sh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1.5px solid var(--line);background:linear-gradient(135deg,var(--c),var(--cd));color:#fff;font-weight:800;font-size:17px}
.dh b,.sh b{flex:1}
.dh .ib,.sh .ib{background:rgba(255,255,255,.2);color:#fff;border-color:transparent;box-shadow:none}
.dl{list-style:none;margin:0;padding:8px;overflow-y:auto;flex:1}
.di{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:6px 10px;margin:2px 0;border-radius:14px;border:2px solid transparent;background:none;text-align:start;line-height:1.5}
.di:hover{background:var(--c2)}
.di.on{border-color:var(--c);background:var(--c2);font-weight:800}
.di .dn{flex:none;width:32px;height:32px;border-radius:10px;background:var(--line);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.di.on .dn{background:var(--c);color:#fff}
.di .dt{flex:1;min-width:0;font-size:15px}
.di .dc{flex:none;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.di.done .dc{background:var(--good);color:#fff}
.sheet{margin:auto;width:min(640px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--bg);border-radius:24px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.4);animation:inF .3s both}
.sb{overflow-y:auto;padding:6px 14px 16px;flex:1}
.mq{margin-top:12px}
.mq .ml{font-size:12.5px;font-weight:700;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mq.fixed .q{border-color:var(--good)}
.empty{text-align:center;padding:28px 10px;font-size:18px;font-weight:700}
@media(max-width:600px){.ov.sh-ov{align-items:flex-end}.sheet{border-radius:24px 24px 0 0;max-height:90%;margin:auto 0 0}}

.xpb{position:fixed;z-index:80;transform:translateX(-50%);pointer-events:none;background:linear-gradient(135deg,#ffb703,#ff7a00);color:#2b1700;font-weight:800;padding:2px 12px;border-radius:16px;box-shadow:0 6px 16px rgba(255,122,0,.4);animation:xpf 1.2s ease-out both}
@keyframes xpf{0%{opacity:0;transform:translate(-50%,0) scale(.6)}15%{opacity:1;transform:translate(-50%,6px) scale(1.15)}100%{opacity:0;transform:translate(-50%,52px) scale(1)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .bgfx span,.mol{animation:none!important}
}
</style>
</head>
<body>
<div class="bgfx" id="bgfx" aria-hidden="true"></div>
<div id="app">
  <header class="top">
    <button class="logo" id="logo" type="button" aria-label="الرئيسية"><span class="lg">⚗️</span><span class="lt">محمد الراجحي</span></button>
    <div class="stats" id="stats" aria-label="النقاط والنجوم"><span>⚡<b id="xpN">٠</b></span><span>⭐<b id="starN">٠</b></span></div>
    <button class="ib" id="themeBtn" type="button" aria-label="تبديل الوضع الفاتح والداكن">🌙</button>
    <button class="ib wide" id="misBtn" type="button" aria-label="أخطائي">📒<small>أخطائي</small><span class="bdg" id="misN"></span></button>
  </header>
  <nav class="tabs" id="tabs" aria-label="الفصول"></nav>
  <main id="main"><div id="view"></div></main>
  <nav class="bar" id="bar" hidden>
    <button class="nb prev" id="prevB" type="button" aria-label="السابق"><span>▶</span><em>السابق</em></button>
    <div class="mid"><div class="cnt" id="cnt"></div><div class="segs" id="segs" role="group" aria-label="التقدم في الفصل"></div></div>
    <button class="ib" id="menuB" type="button" aria-label="قائمة الشرائح" style="min-height:52px">☰</button>
    <button class="nb next" id="nextB" type="button" aria-label="التالي"><em>التالي</em><span>◀</span></button>
  </nav>
</div>

<div class="ov" id="drawerOv" hidden>
  <aside class="drawer" role="dialog" aria-modal="true" aria-label="قائمة الشرائح">
    <div class="dh"><b id="dTitle"></b><button class="ib" id="dClose" type="button" aria-label="إغلاق">✕</button></div>
    <ol class="dl" id="dList"></ol>
  </aside>
</div>
<div class="ov sh-ov" id="misOv" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-label="أخطائي">
    <div class="sh"><b id="misT">📒 أخطائي</b><button class="ib" id="misClose" type="button" aria-label="إغلاق">✕</button></div>
    <div class="sb" id="misBody"></div>
  </section>
</div>

<script>
(function(){
'use strict';
var CH=[
  {id:'ch1',n:'١',t:'الضوء والذرة',ico:'💡',c:'#8B3DFF'},
  {id:'ch2',n:'٢',t:'الجدول الدوري',ico:'🧪',c:'#00A896'},
  {id:'ch3',n:'٣',t:'الأيونات والروابط',ico:'🧲',c:'#FF7A00'}
];
var HOME_C='#4f46e5';
var chapters={ch1:[],ch2:[],ch3:[]};
var started=false, cur={ch:null,i:0}, curColor=HOME_C;
var KEY='chem-simple-v1', mem={};
var $=function(id){return document.getElementById(id)};
var ar=function(n){return String(n).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d]})};
function h(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}

/* ---------- state / persistence ---------- */
function rd(){try{var v=localStorage.getItem(KEY);if(v)return v}catch(e){}return mem[KEY]||null}
var S={xp:0,done:{},tried:{},mistakes:{},quiz:{},flips:{},dark:null,last:null};
try{var raw=rd();if(raw){var p=JSON.parse(raw);if(p&&typeof p==='object'){for(var k in S){if(p[k]!==undefined)S[k]=p[k]}}}}catch(e){}
function save(){var s;try{s=JSON.stringify(S)}catch(e){return}mem[KEY]=s;try{localStorage.setItem(KEY,s)}catch(e){}}

/* ---------- theme ---------- */
var mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
function isDark(){var t=document.documentElement.getAttribute('data-theme');if(t)return t==='dark';return !!(mq&&mq.matches)}
function applyTheme(){
  var r=document.documentElement;
  if(S.dark===true)r.setAttribute('data-theme','dark');else if(S.dark===false)r.setAttribute('data-theme','light');else r.removeAttribute('data-theme');
  $('themeBtn').textContent=isDark()?'☀️':'🌙';
  var m=document.querySelector('meta[name=theme-color]');if(m)m.content=isDark()?'#11101a':'#f6f4fb';
}

/* ---------- HUD ---------- */
function stars(){var t=0;for(var k in S.quiz)t+=S.quiz[k]||0;return t}
function misCount(){return Object.keys(S.mistakes).length}
function hud(){$('xpN').textContent=ar(S.xp);$('starN').textContent=ar(stars());var m=misCount();$('misN').textContent=m?ar(m):''}
function bubble(n){
  var st=$('stats');st.classList.remove('pop');void st.offsetWidth;st.classList.add('pop');
  var r=st.getBoundingClientRect();
  var b=h('div','xpb',(n>0?'+':'')+ar(n)+' ⚡');
  b.style.left=(r.left+r.width/2)+'px';b.style.top=(r.bottom+2)+'px';
  document.body.appendChild(b);setTimeout(function(){b.remove()},1300);
}
function setColor(c){curColor=c;document.documentElement.style.setProperty('--c',c);$('bgfx').style.setProperty('--c',c)}

/* ---------- registration ---------- */
window.addSlides=function(id,arr){
  if(!chapters[id])return;
  (arr||[]).forEach(function(s){chapters[id].push(s)});
  if(started){updateTabs();if(cur.ch===null)renderHome();else updateBar()}
};

/* ---------- helpers ---------- */
function chIndex(id){for(var i=0;i<CH.length;i++)if(CH[i].id===id)return i;return -1}
function doneCount(id){var n=0,L=chapters[id].length;for(var i=0;i<L;i++)if(S.done[id+':'+i])n++;return n}
function markDone(ch,i){var k=ch+':'+i;if(S.done[k])return;S.done[k]=1;save();updateTabs();paintSegs();if(!$('drawerOv').hidden)buildDrawer()}
function addMis(key,ch,si,title,q){S.mistakes[key]={ch:ch,si:si,t:title,q:{q:q.q,opts:q.opts,a:q.a,why:q.why}};save();hud()}
function delMis(key){if(S.mistakes[key]){delete S.mistakes[key];save();hud()}}

/* ---------- tabs ---------- */
function buildTabs(){
  var box=$('tabs');box.innerHTML='';
  CH.forEach(function(c,k){
    var b=h('button','tab');b.type='button';b.dataset.ch=c.id;b.style.setProperty('--tc',c.c);
    b.setAttribute('role','tab');
    b.innerHTML='<span class="ti">'+c.ico+'</span><span class="tl">'+c.n+' '+c.t+'</span><i class="tp"><u></u></i>';
    b.onclick=function(){goChapter(c.id)};
    box.appendChild(b);
  });
}
function updateTabs(){
  CH.forEach(function(c){
    var b=document.querySelector('.tab[data-ch="'+c.id+'"]');if(!b)return;
    var L=chapters[c.id].length,d=doneCount(c.id);
    b.classList.toggle('on',cur.ch===c.id);b.setAttribute('aria-selected',cur.ch===c.id);
    b.querySelector('u').style.width=(L?Math.round(d/L*100):0)+'%';
  });
}
function goChapter(id){
  if(cur.ch===id)return;
  var l=S.last&&S.last.ch===id?S.last.i:0;
  show(id,l);
}

/* ---------- navigation ---------- */
function show(ch,i){
  var prevKey=cur.ch?chIndex(cur.ch)*1000+cur.i:-1;
  if(!ch||!chapters[ch]){cur={ch:null,i:0};renderHome();return}
  var L=chapters[ch].length;
  i=Math.max(0,Math.min(L?L-1:0,i|0));
  var key=chIndex(ch)*1000+i;
  var anim=prevKey<0?'in-fade':(cur.ch!==ch?(key>prevKey?'in-next':'in-prev'):(key>=prevKey?'in-next':'in-prev'));
  if(cur.ch!==ch)setColor(CH[chIndex(ch)].c);
  cur={ch:ch,i:i};
  S.last={ch:ch,i:i};save();
  renderSlide(anim);
  updateTabs();updateBar();
  $('main').scrollTop=0;
}
function next(){
  if(cur.ch===null){var l=S.last||{ch:'ch1',i:0};show(l.ch,l.i);return}
  var L=chapters[cur.ch].length;
  if(cur.i<L-1)show(cur.ch,cur.i+1);
  else{var k=chIndex(cur.ch);if(k<CH.length-1)show(CH[k+1].id,0);else show(null)}
}
function prev(){
  if(cur.ch===null)return;
  if(cur.i>0)show(cur.ch,cur.i-1);
  else{var k=chIndex(cur.ch);if(k>0){var pid=CH[k-1].id;show(pid,Math.max(0,chapters[pid].length-1))}else show(null)}
}
function updateBar(){
  var bar=$('bar');
  if(cur.ch===null){bar.hidden=true;return}
  bar.hidden=false;
  var L=chapters[cur.ch].length;
  $('cnt').textContent=L?ar(cur.i+1)+' / '+ar(L):'';
  var last=cur.i>=L-1,k=chIndex(cur.ch),nb=$('nextB');
  nb.classList.toggle('wide',last);
  if(last){
    nb.innerHTML=k<CH.length-1?'<em>الفصل التالي ⟵</em>':'<em>🏁 إنهاء</em>';
    nb.setAttribute('aria-label',k<CH.length-1?'الفصل التالي':'إنهاء');
  }else{nb.innerHTML='<em>التالي</em><span>◀</span>';nb.setAttribute('aria-label','التالي')}
  buildSegs();
}
function buildSegs(){
  var box=$('segs');box.innerHTML='';
  var L=chapters[cur.ch].length;
  for(var i=0;i<L;i++)box.appendChild(h('i'));
  paintSegs();
}
function paintSegs(){
  if(cur.ch===null)return;
  var s=$('segs').children;
  for(var i=0;i<s.length;i++){s[i].className=(i===cur.i?'cu':(S.done[cur.ch+':'+i]?'d':''))}
}
$('segs').addEventListener('click',function(e){
  var L=chapters[cur.ch]?chapters[cur.ch].length:0;if(!L)return;
  var r=this.getBoundingClientRect(),f=(r.right-e.clientX)/r.width;
  show(cur.ch,Math.max(0,Math.min(L-1,Math.floor(f*L))));
});

/* ---------- home ---------- */
function renderHome(){
  setColor(HOME_C);
  var v=$('view');v.innerHTML='';
  var w=h('div','wrap hero slide in-fade');
  var resume=!!(S.last&&S.last.ch);
  w.innerHTML='<div class="hero-top"><div class="mol">⚗️</div><h1>كيمياء بسيطة</h1><p class="sub">تعلّم الكيمياء خطوة بخطوة، جرّب بنفسك، واجمع النقاط والنجوم ⭐</p><button class="go" id="goBtn" type="button">'+(resume?'تابع من حيث وقفت ▸':'ابدأ ▸')+'</button></div><div class="hcards"></div><p class="sign">© 2026 جميع الحقوق محفوظة لـ محمد عرفات الراجحي</p>';
  var cards=w.querySelector('.hcards');
  CH.forEach(function(c){
    var L=chapters[c.id].length,d=doneCount(c.id),pc=L?Math.round(d/L*100):0;
    var b=h('button','hcard');b.type='button';b.style.setProperty('--tc',c.c);
    b.innerHTML='<span class="hi">'+c.ico+'</span><div class="hn1">الفصل '+c.n+'</div><div class="ht">'+c.t+'</div><div class="hs">'+ar(L)+' شريحة</div><div class="hb"><u style="width:'+pc+'%"></u></div><div class="hs">'+ar(pc)+'٪ مكتمل</div>';
    b.onclick=function(){var l=S.last&&S.last.ch===c.id?S.last.i:0;show(c.id,l)};
    cards.appendChild(b);
  });
  v.appendChild(w);
  w.querySelector('#goBtn').onclick=function(){next()};
  updateTabs();updateBar();$('main').scrollTop=0;
}

/* ---------- questions ---------- */
var LET=['أ','ب','ج','د','هـ','و'];
function mkQ(q,o){
  var box=h('div','q');
  box.appendChild(h('div','qt',q.q));
  var list=h('div','opts'),why=h('div','why');why.hidden=true;
  (q.opts||[]).forEach(function(t,k){
    var b=h('button','opt','<b class="lt">'+(LET[k]||ar(k+1))+'</b><span class="ot">'+t+'</span>');
    b.type='button';b.onclick=function(){pick(k)};list.appendChild(b);
  });
  box.appendChild(list);box.appendChild(why);
  function pick(k){
    if(box.dataset.done)return;box.dataset.done='1';
    var ok=k===q.a,btns=list.children;
    box.classList.add('locked');box.classList.toggle('bad',!ok);
    for(var j=0;j<btns.length;j++){
      if(j===q.a)btns[j].classList.add('ok');else if(j===k)btns[j].classList.add('no');else btns[j].classList.add('dim');
    }
    var gain=0;
    if(!S.tried[o.key]){S.tried[o.key]=1;if(ok)gain=10}
    if(ok)delMis(o.key);else addMis(o.key,o.ch,o.si,o.title,q);
    save();
    why.hidden=false;
    why.innerHTML=(ok?'✅ <b>أحسنت!</b> ':'❌ <b>الجواب الصحيح: '+(LET[q.a]||'')+'</b> — ')+(q.why||'')+(gain?'<span class="xpchip">+'+ar(gain)+' ⚡</span>':'');
    if(!ok&&o.retry){
      var rb=h('button','chip','🔁 جرّب مرة أخرى');rb.type='button';rb.style.marginTop='8px';
      rb.onclick=function(){var nb=mkQ(q,o);box.replaceWith(nb)};
      why.appendChild(rb);
    }
    if(gain)App.xp(gain);
    if(o.onAnswer)o.onAnswer(ok,box);
  }
  return box;
}

function buildChecks(sl,ch,si,host){
  var n=sl.checks.length,got=0;
  var sec=h('section','s-checks','<h3 class="ck-h">🧠 اختبر فهمك</h3>');
  sl.checks.forEach(function(q,qi){
    sec.appendChild(mkQ(q,{key:ch+':'+si+':c'+qi,ch:ch,si:si,title:sl.title,onAnswer:function(){if(++got>=n)markDone(ch,si)}}));
  });
  host.appendChild(sec);
}

function buildQuiz(sl,ch,si,host){
  var Q=sl.questions||[],N=Q.length,key=ch+':'+si;
  var sec=h('section','s-checks');host.appendChild(sec);
  function start(){
    var idx=0,score=0,wrong=0;
    function ask(){
      sec.innerHTML='';
      var best=S.quiz[key]||0;
      var top=h('div','qz-top','<span>سؤال '+ar(idx+1)+' من '+ar(N)+'</span><div class="qz-bar"><u style="width:'+Math.round(idx/N*100)+'%"></u></div>'+(best?'<span>🏆 '+ar(best)+'⭐</span>':''));
      sec.appendChild(top);
      var act=h('div','qz-act');
      var q=mkQ(Q[idx],{key:key+':q'+idx,ch:ch,si:si,title:sl.title,onAnswer:function(ok){
        if(ok)score++;else wrong++;
        var b=h('button','btn',idx<N-1?'السؤال التالي ◀':'🏁 شاهد النتيجة');b.type='button';
        b.onclick=function(){idx++;if(idx<N)ask();else finish()};
        act.appendChild(b);
        setTimeout(function(){try{b.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}},50);
      }});
      sec.appendChild(q);sec.appendChild(act);
    }
    function finish(){
      var pct=N?score/N:0,st=pct>=.85?3:(pct>=.6?2:1);
      var best=S.quiz[key]||0,bonus=Math.max(0,st-best)*15;
      S.quiz[key]=Math.max(best,st);save();markDone(ch,si);hud();
      if(bonus)App.xp(bonus);
      var msg=st===3?'ممتاز! أنت متمكّن من هذا الدرس 🎉':(st===2?'جيد جداً! راجع الأخطاء وستصل للثلاث نجوم':'بداية جيدة! راجع الدرس وحاول مرة أخرى 💪');
      var sh='';for(var i=0;i<3;i++)sh+='<span class="'+(i<st?'':'off')+'" style="animation-delay:'+(i*.18)+'s">⭐</span>';
      sec.innerHTML='<div class="res"><div class="stars">'+sh+'</div><div class="sc">'+ar(score)+' / '+ar(N)+'</div><p>'+msg+'</p>'+(bonus?'<p><span class="xpchip">+'+ar(bonus)+' ⚡ مكافأة</span></p>':'')+'<div class="acts"></div></div>';
      var acts=sec.querySelector('.acts');
      var again=h('button','btn','🔁 أعد الاختبار');again.type='button';again.onclick=start;acts.appendChild(again);
      if(wrong){var mb=h('button','btn ghost','📒 راجع أخطائي');mb.type='button';mb.onclick=openMis;acts.appendChild(mb)}
    }
    if(!N){sec.innerHTML='<div class="card center muted">لا توجد أسئلة بعد.</div>';return}
    ask();
  }
  start();
}

/* ---------- slide render ---------- */
var KIND={tool:'🧰 جرّب بنفسك',quiz:'📝 اختبار نهاية الدرس',summary:'⭐ ملخص'};
function renderSlide(anim){
  var v=$('view');v.innerHTML='';
  var w=h('div','wrap');
  var list=chapters[cur.ch],sl=list[cur.i];
  if(!sl){
    w.innerHTML='<div class="card center slide in-fade"><div class="big">🚧</div><p>محتوى هذا الفصل قيد الإعداد.</p></div>';
    v.appendChild(w);return;
  }
  var kind=sl.kind||'learn';
  var art=h('article','slide k-'+kind+' '+anim);
  var head='';
  if(KIND[kind])head+='<div class="kbadge">'+KIND[kind]+'</div>';
  head+='<div class="s-head"><span class="s-no">'+ar(cur.i+1)+'</span><h2>'+(sl.title||'')+'</h2></div>';
  art.innerHTML=head+'<div class="s-body">'+(sl.html||'')+'</div>';
  w.appendChild(art);v.appendChild(w);
  var ch=cur.ch,si=cur.i;
  if(sl.questions&&sl.questions.length&&(kind==='quiz'||!(sl.checks&&sl.checks.length))){
    buildQuiz(sl,ch,si,art);
  }else if(sl.checks&&sl.checks.length){
    buildChecks(sl,ch,si,art);
  }else markDone(ch,si);
  if(typeof sl.init==='function'){try{sl.init(art)}catch(e){console.error('init error',ch,si,e)}}
  setupFlips(art,ch,si);
}
function setupFlips(art,ch,si){
  function tab(){var f=art.querySelectorAll('.flip');for(var i=0;i<f.length;i++){if(!f[i].hasAttribute('tabindex')){f[i].tabIndex=0;f[i].setAttribute('role','button')}f[i].setAttribute('aria-pressed',f[i].classList.contains('on'))}}
  tab();
  function toggle(f){
    var on=f.classList.toggle('on');f.setAttribute('aria-pressed',on);
    if(on){var all=art.querySelectorAll('.flip'),idx=Array.prototype.indexOf.call(all,f),k=ch+':'+si+':f'+idx;
      if(!S.flips[k]){S.flips[k]=1;save();App.xp(2)}}
  }
  art.addEventListener('click',function(e){var f=e.target.closest('.flip');if(f&&art.contains(f))toggle(f)});
  art.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('flip')){e.preventDefault();toggle(e.target);}});
  setTimeout(tab,0);
}

/* ---------- drawer / mistakes ---------- */
var lastFocus=null;
function openOv(ov,focusId){lastFocus=document.activeElement;ov.hidden=false;var f=$(focusId);if(f)f.focus()}
function closeOv(ov){if(ov.hidden)return;ov.hidden=true;if(lastFocus&&lastFocus.focus){try{lastFocus.focus()}catch(e){}}}
function buildDrawer(){
  var L=chapters[cur.ch]||[],c=CH[chIndex(cur.ch)];
  $('dTitle').textContent=c?c.ico+' '+c.n+' '+c.t:'';
  var ol=$('dList');ol.innerHTML='';
  L.forEach(function(s,i){
    var li=h('li'),b=h('button','di'+(i===cur.i?' on':'')+(S.done[cur.ch+':'+i]?' done':''));b.type='button';
    var kd=s.kind==='tool'?' 🧰':(s.kind==='quiz'?' 📝':(s.kind==='summary'?' ⭐':''));

function buildGrid(gridEl,opts){ /* opts.maxPeriod , opts.onclick -> returns cells map z->el */

function initChecker(root){

  var cur=0,ans={p:0,g:0,b:''},score=0,done=0,answered=false,i;
  function mk(box,vals,key){
    box.innerHTML='';
    vals.forEach(function(v){
      var b=document.createElement('button');b.type='button';b.className='chip';b.textContent=v;
      b.addEventListener('click',function(){
        if(answered)return;ans[key]=v;
        Array.prototype.forEach.call(box.children,function(x){x.classList.toggle('ch2-on',x===b);});
      });
      box.appendChild(b);
    });
  }
  var P=[1,2,3,4,5,6,7],G=[];for(i=1;i<=18;i++)G.push(i);
  mk(pickP,P,'p');mk(pickG,G,'g');mk(pickB,['s','p','d','f'],'b');
  function nextQ(){
    var prev=cur;
    do{cur=VZ[Math.floor(Math.random()*VZ.length)];}while(cur==prev&&VZ.length>1);
    ans={p:0,g:0,b:''};answered=false;res.innerHTML='';
    Array.prototype.forEach.call(root.querySelectorAll('.ch2-pick .chip'),function(x){x.classList.remove('ch2-on');});
    cfgEl.innerHTML=cfgHtml(cfg(cur));

  }
  chk.addEventListener('click',function(){
    if(answered)return;

    answered=true;chk.disabled=true;

    var okP=ans.p==p[0],okG=ans.g==p[1],okB=ans.b==b,all=okP&&okG&&okB;

      '<ol class="steps"><li>'+st.join('</li><li>')+'</li></ol>'+

    {k:'en',lbl:'الأكثر كهروسالبية',big:true},

  function pick(arr,n){var a=arr.slice(),r=[];while(r.length<n&&a.length){r.push(a.splice(Math.floor(Math.random()*a.length),1)[0]);}return r;}
  var cur=null;
  function gen(){
    var tries=0;
    while(tries++<200){
      var c=CR[Math.floor(Math.random()*CR.length)],M=METRIC[c.k],inPeriod=Math.random()<0.5,set,items;
      if(inPeriod){set=P[Math.floor(Math.random()*P.length)][1];}else{set=GR[Math.floor(Math.random()*GR.length)];}
      items=pick(set,Math.random()<0.5?2:3);if(items.length<2)continue;
      var idx=M.idx,vals=items.map(function(s){return TR[s][idx];});
      if(vals.some(function(v){return v==null;}))continue;
      /* الاتجاه المتوقع حسب الموقع */
      var zs=items.map(function(s){return SYM.indexOf(s)+1;});
      var score_=zs.map(function(z){var p=pos(z);
        /* درجة المتجه: x الدورة نحو اليمين، y الهبوط */
        var gx=p[1]>2?p[1]-10:p[1]; /* العمود المعدل 1..8 */
        return {gx:gx,per:p[0]};});
      var inc; /* اتجاه الزيادة: هل القيمة تزداد مع gx أو per؟ */
      var best=0,bi=0,wi=0,worst=1e9;
      vals.forEach(function(v,i){var vv=c.big?v:-v;if(i==0||vv>best){best=vv;bi=i;}});
      var sorted=vals.slice().sort(function(a,b){return a-b;});
      var gap=(sorted[sorted.length-1]-sorted[0])/(Math.abs(sorted[sorted.length-1])||1);
      if(gap<0.12)continue;
      /* تحقق من توافق البيانات مع الاتجاه: لا نقبل الحالات الشاذة */
      var trendWin=0,tv=-1e9;
      items.forEach(function(s,i){
        var sc;
        var z=zs[i],p=pos(z),gx=p[1]>2?p[1]-10:p[1];
        var rightward=(c.k=='r')?-gx:gx;      /* في الدورة */
        var downward=(c.k=='r')?p[0]:-p[0];    /* في المجموعة */
        sc=inPeriod?rightward:downward;
        if(!c.big)sc=-sc;
        if(sc>tv){tv=sc;trendWin=i;}
      });
      if(trendWin!=bi)continue;
      cur={c:c,M:M,items:items,vals:vals,bi:bi,inPeriod:inPeriod};
      return;
    }
    cur={c:CR[0],M:METRIC.r,items:['Li','F'],vals:[167,42],bi:0,inPeriod:true};
  }
  function why(){
    var c=cur.c,M=cur.M,w=cur.items[cur.bi];
    var dir=cur.inPeriod?(M.per+' في الدورة من اليسار إلى اليمين'):(M.grp+' في المجموعة من أعلى إلى أسفل');
    var r=cur.inPeriod?M.whyP:M.whyG;
    return '<b class="ltr">'+w+'</b> هو '+c.lbl.replace(' (نصف قطراً)','')+' لأن '+M.n+' '+dir+'. '+r+
      '<br><span class="muted ltr">'+cur.items.map(function(s,i){return s+' = '+cur.vals[i]+(cur.M.unit?' '+cur.M.unit:'');}).join(' ، ')+'</span>';
  }
  function render(){
    gen();fb.innerHTML='';nx.style.display='none';opts.innerHTML='';
    var where=cur.inPeriod?'(من الدورة نفسها)':'(من المجموعة نفسها)';
    qEl.innerHTML='أيّ هذه العناصر '+where+' هو <b>'+cur.c.lbl+'</b>؟';
    cur.items.forEach(function(s,i){
      var b=document.createElement('button');b.type='button';b.className='btn ltr';b.style.margin='4px';
      b.textContent=s+' ('+AR[SYM.indexOf(s)]+')';b.style.direction='rtl';
      b.addEventListener('click',function(){
        if(nx.style.display=='block')return;
        tot++;
        var ok=i==cur.bi;
        if(ok){score++;streak++;xp(2);}else streak=0;
        scEl.textContent='النتيجة: '+score+' / '+tot+(streak>1?' — سلسلة '+streak+' 🔥':'');
        fb.innerHTML='<div class="'+(ok?'good':'warn')+'">'+(ok?'صحيح! ':'ليست الإجابة الصحيحة. ')+why()+'</div>';
        nx.style.display='block';
      });
      opts.appendChild(b);
    });
  }
  nx.addEventListener('click',render);
  render();
}

/* 9 علل */
S.push({title:'علّل: التشابه والاستقرار',kind:'learn',
html:'<div class="idea">التشابه في الخواص سببه التكافؤ، والخمول سببه المجال الأخير الممتلئ.</div>'+
'<div class="flip"><div class="fq">علّل: عناصر المجموعة الواحدة متشابهة في خواصها الكيميائية؟</div><div class="fa">لأن لها نفس عدد إلكترونات التكافؤ.</div></div>'+
'<div class="flip"><div class="fq">علّل: الغازات النبيلة مستقرة كيميائياً؟</div><div class="fa">لأن مجال الطاقة الأخير ممتلئ تماماً بالإلكترونات.</div></div>'+
'<div class="analogy"><span class="ico">🏘️</span><div>سكان الحيّ الواحد (نفس التكافؤ) يتصرفون بالطريقة نفسها. أما الغازات النبيلة فهي «مكتفية» ولا تحتاج أن تأخذ أو تعطي أو تشارك.</div></div>'+
'<div class="card"><b>تدريب (بدون النظر إلى الحل):</b> حدّد الدورة والمجموعة والتكافؤ لـ <span class="ltr">Mg, <sub>19</sub>K, <sub>54</sub>Xe, <sub>30</sub>Zn, <sub>21</sub>Sc, <sub>33</sub>As, <sub>17</sub>Cl, N</span> ثم تحقّق في «محقق العنصر» أو «الجدول الحي».</div>',
checks:[
{q:'Xe (54) من أي فئة ومجموعة؟',opts:['s والمجموعة 2','p والمجموعة 18','d والمجموعة 12'],a:1,why:'ينتهي بـ 5s<sup>2</sup>5p<sup>6</sup>: تكافؤ 8 ← 8+10 = 18، فئة p، غاز نبيل.'},
{q:'Zn (30) تكافؤه 4s<sup>2</sup>3d<sup>10</sup>، ومجموعته:',opts:['2','12','10'],a:1,why:'ينتهي بـ d: عدد إلكترونات d + 2 = 10 + 2 = 12.'}]});

/* 10 الحجم الذري */
S.push({title:'الحجم الذري (نصف قطر الذرة)',kind:'learn',
html:'<div class="idea">نصف القطر يقل عبر الدورة، ويزداد نزولاً في المجموعة.</div>'+
'<div class="card"><b>الحجم الذري:</b> مقدار اقتراب ذرة من ذرة أخرى مجاورة لها.<br><b>نصف قطر الذرة للفلزات:</b> نصف المسافة بين نواتين متجاورتين في التركيب البلوري للعنصر.<br><b>للافلزات:</b> نصف المسافة بين نوى الذرات المتطابقة والمتحدة كيميائياً بروابط.</div>'+
'<div class="analogy"><span class="ico">🧲</span><div>في الدورة نفسها تبقى الإلكترونات في الطابق نفسه، لكن النواة تزداد شحنة، فتصبح كمغناطيس أقوى يشدّ الإلكترونات أقرب. أما نزولاً في المجموعة فنضيف طابقاً جديداً، فتكبر الذرة.</div></div>'+
'<div class="flip"><div class="fq">علّل: يقل نصف قطر الذرة من اليسار إلى اليمين في الدورة؟</div><div class="fa">بسبب زيادة عدد إلكترونات التكافؤ في مجال الطاقة الرئيسي الأخير، فتزداد قوة جذب النواة لهذه الإلكترونات فيقل نصف القطر.</div></div>'+
'<div class="flip"><div class="fq">علّل: يزداد نصف قطر الذرة من أعلى إلى أسفل المجموعة؟</div><div class="fa">بسبب زيادة عدد المجالات (المستويات) الرئيسية كلما اتجهنا إلى الأسفل.</div></div>'+
'<div class="card"><b>مثال: أيهما أكبر حجماً Li أم F؟</b><ol class="steps"><li>Li: <span class="ltr">1s<sup>2</sup>2s<sup>1</sup></span> ← الدورة 2، المجموعة 1.</li><li>F: <span class="ltr">1s<sup>2</sup>2s<sup>2</sup>2p<sup>5</sup></span> ← الدورة 2، المجموعة 17.</li><li>في الدورة نفسها يقل الحجم نحو اليمين ← <b>Li أكبر</b>.</li></ol></div>'+
'<div class="card"><b>مثال: Ca أم Be؟</b> كلاهما في المجموعة 2: Be في الدورة 2 وCa في الدورة 4، والحجم يزداد نزولاً ← <b>Ca أكبر</b>.</div>',
checks:[
{q:'كلما اتجهنا إلى الأسفل في المجموعة الواحدة فإن:',opts:['نصف قطر الذرة يقل','نصف قطر الذرة يزداد','طاقة التأين تزداد','الكهروسالبية تزداد'],a:1,why:'يزداد نصف القطر لأن عدد المجالات الرئيسية يزداد.'},
{q:'يزداد نصف القطر نزولاً في المجموعة بسبب:',opts:['زيادة عدد المستويات الرئيسية','زيادة جذب النواة للإلكترونات','زيادة شحنة النواة فقط'],a:0,why:'كل دورة جديدة تضيف مجالاً رئيسياً جديداً أبعد عن النواة.'},
{q:'أيّ العنصرين X<sub>12</sub> و Y<sub>17</sub> أكبر حجماً؟',opts:['X','Y'],a:0,why:'كلاهما في الدورة 3؛ X في المجموعة 2 وY في 17، والحجم يقل نحو اليمين فـ X أكبر.'}]});

/* 11 نصف قطر الأيون */
S.push({title:'نصف قطر الأيون',kind:'learn',
html:'<div class="idea">الأيون الموجب أصغر من ذرته، والأيون السالب أكبر من ذرته.</div>'+
'<div class="card"><b>الأيون:</b> ذرة أو مجموعة ذرات تحمل شحنة موجبة أو سالبة.<br>أمثلة موجبة: <span class="ltr">Na<sup>+</sup>, Al<sup>3+</sup>, NH<sub>4</sub><sup>+</sup></span><br>أمثلة سالبة: <span class="ltr">Cl<sup>−</sup>, S<sup>2−</sup>, SO<sub>4</sub><sup>2−</sup></span></div>'+
'<ol class="steps"><li>الذرة متعادلة: عدد الإلكترونات السالبة = عدد البروتونات الموجبة.</li><li>عندما تفقد الذرة إلكتروناً تتحول إلى <b>أيون موجب صغير الحجم</b>.</li><li>عندما تكتسب الذرة إلكتروناً تتحول إلى <b>أيون سالب كبير الحجم</b>.</li></ol>'+
'<div class="analogy"><span class="ico">⚖️</span><div>عند فقد إلكترون يبقى عدد البروتونات (عدد الجاذبين) كما هو بينما يقل عدد المشدودين فتنكمش الذرة. وعند اكتساب إلكترون يزداد عدد المشدودين فتتنافر الإلكترونات فيكبر الحجم.</div></div>'+
'<table class="t"><tr><th>الجسيم</th><th>العدد الذري</th><th>الإلكترونات</th><th>المقارنة</th></tr><tr><td class="ltr">Na → Na<sup>+</sup></td><td>11</td><td>11 → 10</td><td>Na<sup>+</sup> أصغر</td></tr><tr><td class="ltr">Cl → Cl<sup>−</sup></td><td>17</td><td>17 → 18</td><td>Cl<sup>−</sup> أكبر</td></tr></table>',
checks:[
{q:'عند تكوين الأيونات فإن:',opts:['عدد الإلكترونات يقل دائماً','عدد البروتونات يبقى ثابتاً','عدد البروتونات يزداد','عدد الإلكترونات يبقى ثابتاً'],a:1,why:'التغير يحدث في الإلكترونات فقط، أما البروتونات فثابتة.'},
{q:'الجسيم الأكبر حجماً: <span class="ltr"><sub>19</sub>K , <sub>19</sub>K<sup>+</sup> , <sub>20</sub>Ca<sup>2+</sup></span>',opts:['K','K⁺','Ca²⁺'],a:0,why:'الذرة المتعادلة K أكبر من أيونها الموجب K⁺ لأنه فقد إلكتروناً، وCa²⁺ أصغر منه أيضاً.'},
{q:'عندما تفقد الذرة إلكتروناً تتحول إلى:',opts:['كاتيون','أنيون','ذرة أخرى'],a:0,why:'فقد الإلكترون يعطي أيوناً موجباً (كاتيون).'}]});

/* 12 طاقة التأين + الثمانية */
S.push({title:'طاقة التأين وقاعدة الثمانية',kind:'learn',
html:'<div class="idea">طاقة التأين = الطاقة اللازمة لانتزاع أبعد إلكترون تكافؤ من ذرة في الحالة الغازية.</div>'+
'<div class="analogy"><span class="ico">🔓</span><div>طاقة التأين هي «صعوبة سرقة الإلكترون الأخير». كلما كانت النواة أشدّ جذباً (نحو اليمين في الدورة) صعبت السرقة وزادت الطاقة. وكلما كان الإلكترون بعيداً (نزولاً في المجموعة) سهل أخذه وقلّت الطاقة.</div></div>'+
'<div class="flip"><div class="fq">علّل: تزداد طاقة التأين من اليسار إلى اليمين في الدورة؟</div><div class="fa">يزداد العدد الذري فتزداد قوة جذب النواة للإلكترونات، فنحتاج إلى طاقة كبيرة لانتزاع الإلكترون.</div></div>'+
'<div class="flip"><div class="fq">علّل: تقل طاقة التأين من أعلى إلى أسفل المجموعة؟</div><div class="fa">يزداد العدد الذري وتزداد المستويات الرئيسية فتقل قوة جذب النواة، فنحتاج طاقة قليلة للانتزاع.</div></div>'+
'<div class="card"><b>مثال: Be أم F؟</b> كلاهما في الدورة 2؛ F في أقصى اليمين (المجموعة 17) ← <b>طاقة تأين F أكبر</b>. <br><b>C أم Ge؟</b> كلاهما في المجموعة 14؛ C في الدورة 2 أعلى ← <b>طاقة تأين C أكبر</b>.</div>'+
'<div class="card"><b>قاعدة الثمانية:</b> الذرة تفقد أو تكتسب أو تشارك بالإلكترونات لتحصل على 8 إلكترونات تكافؤ في مجال طاقتها الرئيسي الأخير.</div>'+
'<div class="note">لهذا تُعدّ الغازات النبيلة (ns²np⁶) نموذج الاستقرار الذي تسعى إليه الذرات.</div>',
checks:[
{q:'الطاقة اللازمة لانتزاع إلكترون من ذرة العنصر في الحالة الغازية:',opts:['الكهروسالبية','طاقة التأين','الطاقة المنشطة','طاقة البلورة'],a:1,why:'هذا تعريف طاقة التأين.'},
{q:'الأعلى طاقة تأين فيما يلي: Mg, Cl, Ar, Ne',opts:['Mg','Cl','Ar','Ne'],a:3,why:'Ne في الدورة 2 (أعلى) وهو غاز نبيل في المجموعة 18؛ أما Ar فهو أسفل منه فتقل طاقته، لذا Ne الأعلى.'},
{q:'الذرات التي تسعى لاكتساب أو فقد أو مشاركة إلكترونات لتصل إلى تكافؤ 8 تتبع:',opts:['مبدأ أفباو','مبدأ باولي','قاعدة هند','قاعدة الثمانية'],a:3,why:'هذه قاعدة الثمانية.'}]});

/* 13 الكهروسالبية */
S.push({title:'الكهروسالبية (السالبية الكهربائية)',kind:'learn',
html:'<div class="idea">الكهروسالبية = قابلية ذرة العنصر على جذب الإلكترونات في الرابطة الكيميائية.</div>'+
'<div class="analogy"><span class="ico">🪢</span><div>تخيّل لعبة شدّ الحبل بين ذرتين على إلكترونات الرابطة. الذرة الأكثر كهروسالبية هي الفريق الأقوى. الفلور هو بطل اللعبة.</div></div>'+
'<div class="card"><b>الاتجاه:</b><br>في الدورة: تزداد من اليسار إلى اليمين.<br>في المجموعة: تقل من أعلى إلى أسفل.</div>'+
'<div class="eq">F &gt; O &gt; N &gt; C ≥ H</div>'+
'<div class="card"><b>مثال: Mg أم Cl؟</b> كلاهما في الدورة 3؛ Cl على اليمين (17) ← Cl أكثر كهروسالبية.<br><b>Se أم O؟</b> كلاهما في المجموعة 16؛ O أعلى ← O أكثر كهروسالبية.</div>'+
'<div class="flip"><div class="fq">لماذا يكون الفلور الأكثر كهروسالبية؟</div><div class="fa">لأنه في أقصى يمين الدورة 2 (قرب نهايتها) وأعلى المجموعة 17، فتجذب نواته إلكترونات الرابطة بقوة، ومجاله الأخير يحتاج إلكتروناً واحداً ليكتمل.</div></div>',
checks:[
{q:'أيّ الذرات التالية أكثر سالبية كهربائية؟',opts:['<sub>17</sub>Cl','<sub>35</sub>Br','<sub>9</sub>F','<sub>53</sub>I'],a:2,why:'F في أعلى المجموعة 17 فهو الأكثر كهروسالبية.'},
{q:'مدى قابلية ذرات العنصر على جذب الإلكترونات في الرابطة الكيميائية:',opts:['طاقة التأين','الكهروسالبية','الطاقة المنشطة','طاقة البلورة'],a:1,why:'هذا تعريف الكهروسالبية.'},
{q:'أكثر العناصر كهروسالبية هو عنصر:',opts:['السيزيوم','الفرانسيوم','الفلور','البروم'],a:2,why:'الفلور هو الأعلى كهروسالبية.'}]});
