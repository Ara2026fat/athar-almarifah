window.ELEMENT_STORIES = Object.assign(window.ELEMENT_STORIES||{}, {
55:{ disc:'اكتُشف عام 1860 على يد بونزن وكيرشهوف', name:'من اللاتينية caesius أي أزرق السماء', story:'حين فحص العالمان الألمانيان بونزن وكيرشهوف مياهًا معدنية بالمطياف ظهر خطّان أزرقان لامعان لم يعرفهما أحد، فاستنتجا وجود عنصر جديد. كان السيزيوم أول عنصر يُكتشف بالتحليل الطيفي.', tip:'السيزيوم في المجموعة 1 وله أقل طاقة تأين بين العناصر المستقرة تقريبًا، ولذلك يفقد إلكترونه الخارجي بسهولة بالغة ويتفاعل بعنف مع الماء.', fun:'تُعرَّف الثانية اليوم بعدد اهتزازات ذرة سيزيوم-133 وهو 9,192,631,770 اهتزازة.' },
56:{ disc:'عُزل عام 1808 على يد همفري ديفي بعد أن ميّز شيله أكسيده عام 1774', name:'من اليونانية barys أي ثقيل', story:'لاحظ الكيميائي السويدي شيله عام 1774 أن خامًا ثقيلًا غريبًا يحوي أكسيدًا جديدًا، وبعد 34 عامًا نجح ديفي في عزل الفلز نفسه بالتحليل الكهربائي. يُعطي الباريوم عند حرق أملاحه لهبًا أخضر جميلًا.', tip:'الباريوم من فلزات المجموعة 2 ويظهر لونه الأخضر في اختبار اللهب لأن إلكتروناته تنتقل بين مستويات الطاقة وتُصدر ضوءًا بطول موجي مميز.', fun:'كبريتات الباريوم ' + C('BaSO<sub>4</sub>') + ' لا تذوب في الماء، ولذلك يشربها المرضى بأمان قبل تصوير الجهاز الهضمي بالأشعة السينية.' },
57:{ disc:'اكتُشف عام 1839 على يد كارل موساندر', name:'من اليونانية lanthanein أي يختبئ', story:'وجد العالم السويدي موساندر أن ما ظنّه الناس أكسيدًا واحدًا هو في الحقيقة خليط، فاستخرج منه عنصرًا جديدًا كان مختبئًا فيه، فسمّاه اللانثانوم أي المختبئ. وصار اسمه عنوان سلسلة كاملة من العناصر المتشابهة.', tip:'اللانثانوم يمنح اسمه لعناصر اللانثانيدات وهي عناصر الانتقال الداخلية التي تُملأ فيها المستويات الفرعية 4f، ولذلك تتشابه خواصها كثيرًا.' },
58:{ disc:'اكتُشف عام 1803 على يد برزيليوس وهيزنغر، واكتشفه كلابروث مستقلًا', name:'نسبة إلى الكوكب القزم سيريس', story:'سُمّي السيريوم تيمنًا بالكوكب القزم سيريس الذي اكتُشف قبل سنتين فقط من العنصر. وهو أكثر اللانثانيدات وفرة في القشرة الأرضية، ويدخل في ولاعات الشرارة لأنه يشتعل بالاحتكاك.', tip:'السيريوم يكوّن أيون ' + C('Ce<sup>4+</sup>') + ' إضافة إلى ' + C('Ce<sup>3+</sup>') + '، وهذا يوضح أن بعض اللانثانيدات لها أكثر من حالة تأكسد.' },
59:{ disc:'اكتُشف عام 1885 على يد كارل أوير فون فلسباخ', name:'من اليونانية prasios وdidymos أي التوأم الأخضر', story:'ظنّ العلماء سنوات أن عنصرًا اسمه ديديميوم موجود، حتى فصله النمساوي أوير فون فلسباخ عام 1885 إلى عنصرين اثنين. أحدهما هو البراسيوديميوم الذي تكون أملاحه خضراء اللون.', tip:'يُعد البراسيوديميوم من اللانثانيدات، وتُظهر أيوناته ألوانًا لأن إلكترونات المستوى 4f تنتقل بين مستويات طاقة متقاربة.' },
60:{ disc:'اكتُشف عام 1885 على يد كارل أوير فون فلسباخ', name:'من اليونانية neos وdidymos أي التوأم الجديد', story:'هو التوأم الثاني الذي انفصل عن الديديميوم مع البراسيوديميوم. اليوم يدخل النيوديميوم في أقوى المغانط الدائمة المصنوعة من النيوديميوم والحديد والبورون، وتوجد في سماعات الأذن ومحركات السيارات الكهربائية.', tip:'خصائص النيوديميوم المغناطيسية تعود إلى إلكترونات 4f غير المزدوجة في توزيعه الإلكتروني.' },
61:{ disc:'اكتُشف عام 1945 في مختبر أوك ريدج الأمريكي', name:'نسبة إلى بروميثيوس في الأساطير اليونانية الذي سرق النار', story:'ليس للبروميثيوم نظير مستقر، ولذلك لم يُعثر عليه في الطبيعة إلا بكميات ضئيلة جدًا. حصل عليه ماري وغلندنين وكوريل من نواتج انشطار اليورانيوم، واقترحت غريس كوريل اسمه.', tip:'هو اللانثانيد الوحيد المشع تقريبًا، فهو مثال على أن النواة قد تكون غير مستقرة رغم أن موقع العنصر في الجدول الدوري منتظم.' },
62:{ disc:'اكتُشف عام 1879 على يد لوكوك دي بواسبودران', name:'نسبة إلى معدن السامارسكايت', story:'استخلصه الفرنسي لوكوك دي بواسبودران من معدن السامارسكايت. سُمّي المعدن على اسم المهندس الروسي فاسيلي سامارسكي، فصار السماريوم أول عنصر يُسمّى بصورة غير مباشرة على اسم شخص.', tip:'يستعمل السماريوم في مغانط السماريوم والكوبالت القوية، وهو من اللانثانيدات التي تتشابه في تفاعلاتها لأن إلكتروناتها الخارجية متماثلة.' },
63:{ disc:'اكتُشف عام 1901 على يد أوجين دوماركيه', name:'نسبة إلى قارة أوروبا', story:'عزل الكيميائي الفرنسي دوماركيه اليوروبيوم عام 1901 وسمّاه على اسم أوروبا. يُستعمل في مواد فسفورية تُصدر ضوءًا أحمر في الشاشات والمصابيح.', tip:'لون الضوء الأحمر الصادر منه مثال مباشر على الطيف الذري، إذ تتحرر الطاقة على شكل فوتونات عند عودة الإلكترونات المثارة.' },
64:{ disc:'اكتُشف عام 1880 على يد جان دي مارينياك', name:'نسبة إلى معدن الغادولينيت وعالم الكيمياء الفنلندي يوهان غادولين', story:'سُمّي الغادولينيوم تكريمًا لعالم الكيمياء الفنلندي يوهان غادولين الذي درس المعدن الأول. تُستعمل مركباته اليوم مادة تباين في التصوير بالرنين المغناطيسي لأنها تتأثر بالمجال المغناطيسي.', tip:'الغادولينيوم منتصف سلسلة اللانثانيدات، وتوزيعه الإلكتروني يوضح استقرار المستوى الفرعي 4f نصف الممتلئ.' },
65:{ disc:'اكتُشف عام 1843 على يد كارل موساندر', name:'نسبة إلى قرية إيتربي السويدية', story:'في قرية إيتربي السويدية كان منجم واحد مصدرًا لأربعة عناصر تحمل اسمها: إتريوم وتربيوم وإربيوم وإتربيوم. يُستعمل التربيوم في مواد تُصدر ضوءًا أخضر في الشاشات والمصابيح.', tip:'ألوان الضوء الصادر عن اللانثانيدات مثل التربيوم تعتمد على الانتقالات الإلكترونية المميزة لكل عنصر.' },
66:{ disc:'اكتُشف عام 1886 على يد لوكوك دي بواسبودران', name:'من اليونانية dysprositos أي صعب المنال', story:'استغرق فصل الديسبروسيوم عن شوائبه عشرات المحاولات المتكررة، ولهذا سُمّي صعب المنال. يُستعمل اليوم في المغانط القوية التي تتحمل الحرارة العالية.', tip:'تشابه خواص اللانثانيدات يجعل فصلها صعبًا، وهذا يرجع إلى أن اختلاف الإلكترونات في المستوى 4f الداخلي لا يغيّر الخواص الكيميائية كثيرًا.' },
67:{ disc:'اكتُشف عام 1878 على يد بير تيودور كليف', name:'من الاسم اللاتيني holmia لمدينة ستوكهولم', story:'سمّى الكيميائي السويدي كليف هذا العنصر على اسم مدينته ستوكهولم. وتتميز مغناطيسية الهولميوم بأنها من أعلى القيم بين العناصر.', tip:'الهولميوم من اللانثانيدات، وتتفاعل عناصر هذه السلسلة بتشابه كبير لأنها تفقد عادة ثلاثة إلكترونات لتكوّن أيونات ' + C('+3') + '.' },
68:{ disc:'اكتُشف عام 1843 على يد كارل موساندر', name:'نسبة إلى قرية إيتربي السويدية', story:'هو أحد العناصر الأربعة المستخرجة من معادن قرية إيتربي. يُضاف الإربيوم إلى ألياف زجاجية تعمل مضخمات ضوئية، فتنقل الإنترنت لمسافات طويلة عبر كابلات البحار.', tip:'ينتج الإربيوم ضوءًا بطول موجي محدد عند عودة إلكتروناته من الحالة المثارة، وهو تطبيق عملي للطيف الذري.' },
69:{ disc:'اكتُشف عام 1879 على يد بير تيودور كليف', name:'نسبة إلى ثولي، الاسم القديم لإسكندنافيا', story:'هو من أندر اللانثانيدات في الطبيعة. سمّاه كليف على اسم ثولي، وهو الاسم الذي أطلقه القدماء على أقصى الشمال الأوروبي.', tip:'الثوليوم من اللانثانيدات، وتوزيعه الإلكتروني ينتهي بالمستوى الفرعي 4f، ولذلك يُصنف ضمن الفئة f.' },
70:{ disc:'اكتُشف عام 1878 على يد جان دي مارينياك', name:'نسبة إلى قرية إيتربي السويدية', story:'هو رابع العناصر التي حملت اسم قرية إيتربي، ومعه ثلاثة عناصر أخرى. يستعمل الإتربيوم في الساعات الذرية الدقيقة جدًا وفي بعض الليزرات.', tip:'الإتربيوم يكوّن أيضًا أيون ' + C('Yb<sup>2+</sup>') + ' لأن مستواه الفرعي 4f يقترب من الامتلاء، فهو مثال على استقرار المستويات الممتلئة.' },
71:{ disc:'اكتُشف عام 1907 على يد أوربان وفون فلسباخ وجيمس مستقلين', name:'من لوتيتيا، الاسم القديم لمدينة باريس', story:'توصل ثلاثة علماء في بلدان مختلفة إلى العنصر نفسه تقريبًا في الوقت ذاته. سُمّي اللوتيتيوم على اسم باريس القديمة، وهو آخر عناصر اللانثانيدات.', tip:'اللوتيتيوم ينهي سلسلة اللانثانيدات بملء المستوى 4f تمامًا، ولذلك يعتبره بعضهم أول عنصر من الدورة 6 في الفئة d.' },
72:{ disc:'اكتُشف عام 1923 على يد كوستر وهيفيزي', name:'من hafnia الاسم اللاتيني لمدينة كوبنهاغن', story:'تنبأ نيلز بور بنظريته الذرية أن العنصر 72 يشبه الزركونيوم لا اللانثانيدات، فبحث عنه كوستر وهيفيزي في معادن الزركونيوم في كوبنهاغن ووجداه فعلًا. وتُصنع من الهافنيوم قضبان التحكم في المفاعلات النووية لأنه يمتص النيوترونات جيدًا.', tip:'يشبه الهافنيوم الزركونيوم في الحجم الذري تقريبًا بسبب انكماش اللانثانيدات، ولذلك يصعب الفصل بينهما.' },
73:{ disc:'اكتُشف عام 1802 على يد أندرس إكيبرغ', name:'نسبة إلى تانتالوس في الأساطير اليونانية', story:'سمّاه الكيميائي السويدي إكيبرغ تانتالوم لأن أكسيده لا يذوب في الأحماض حتى مع كثرتها، كأن تانتالوس العطشان الذي يقف في الماء ولا يشرب. ويُستعمل في الغرسات الطبية والمكثفات الإلكترونية.', tip:'الخمول الكيميائي للتانتالوم مثال على أن الفلزات الانتقالية قد تكوّن طبقة أكسيد واقية تحميها.' },
74:{ disc:'عُزل عام 1783 على يد الأخوين خوسيه وفاوستو إلهويار', name:'من السويدية tung sten أي الحجر الثقيل، ورمزه W من wolfram', story:'عزل الأخوان إلهويار الفلز في إسبانيا عام 1783. للتنجستن أعلى درجة انصهار بين جميع الفلزات، نحو 3422 درجة سلزية، ولذلك يُصنع منه فتيل المصباح المتوهج.', tip:'ارتفاع درجة انصهار التنجستن يعود إلى قوة الرابطة الفلزية الناتجة عن مشاركة إلكترونات d وs الكثيرة في بحر الإلكترونات.', fun:'رمزه W مأخوذ من الاسم الألماني wolfram.' },
75:{ disc:'اكتُشف عام 1925 على يد نوداك وتاكه وبيرغ', name:'نسبة إلى نهر الراين (Rhenus)', story:'الرينيوم آخر عنصر مستقر اكتُشف في الطبيعة، فقد وجده الألمان فالتر ونوداك وإيدا تاكه وأوتو بيرغ في الخامات عام 1925. وهو نادر جدًا، لكنه يدخل في سبائك محركات الطائرات النفاثة لقدرته على تحمل الحرارة الشديدة.', tip:'الرينيوم من الفلزات الانتقالية ذات درجة الانصهار العالية جدًا، وله حالات تأكسد متعددة تصل إلى +7.' },
76:{ disc:'اكتُشف عام 1803 على يد سميثسون تينانت', name:'من اليونانية osme أي رائحة', story:'عزل الإنجليزي تينانت الأوزميوم من بقايا خام البلاتين، وسمّاه من رائحة أكسيده النفاذة ' + C('OsO<sub>4</sub>') + '. وهو أكثف عنصر طبيعي معروف، فقطعة صغيرة منه ثقيلة بشكل لافت.', tip:'كثافة الأوزميوم العالية تأتي من كتلته الذرية الكبيرة مع حجم ذري صغير نسبيًا، وهو أمر نموذجي في عناصر الدورة 6 الانتقالية.' },
77:{ disc:'اكتُشف عام 1803 على يد سميثسون تينانت', name:'من إيريس إلهة قوس قزح، لأن أملاحه ملونة', story:'اكتشفه تينانت مع الأوزميوم في بقايا البلاتين، وسمّاه على اسم إيريس لتعدد ألوان مركباته. وفي عام 1980 وجد ألفاريز وفريقه طبقة طينية غنية بالإيريديوم حول العالم، فاقترحوا أن اصطدام نيزك ضخم سبّب انقراض الديناصورات قبل نحو 66 مليون سنة.', tip:'الإيريديوم نادر في القشرة الأرضية لكنه أكثر في النيازك، وهذا ما جعله دليلًا على أصل فضائي لتلك الطبقة.' },
78:{ disc:'عرفته شعوب أمريكا الجنوبية قديمًا، ووصفه الأوروبيون في القرن الثامن عشر', name:'من الإسبانية platina أي الفضة الصغيرة', story:'صاغ سكان أمريكا الجنوبية البلاتين قبل وصول الأوروبيين، ثم وصفه الأوروبيون في القرن الثامن عشر باسم platina أي الفضة الصغيرة. يُستعمل اليوم عاملًا حفازًا في المحولات الحفزية للسيارات لتقليل الغازات الضارة.', tip:'البلاتين فلز نبيل خامل وعامل حفاز ممتاز، لأنه يسمح للمواد بالتفاعل على سطحه دون أن يُستهلك هو.' },
79:{ disc:'معروف منذ القدم', name:'رمزه Au من الكلمة اللاتينية aurum', story:'عرفه الإنسان قبل آلاف السنين لأنه يوجد حرًّا لامعًا في الطبيعة. وهو من الفلزات النبيلة، فلا يصدأ ولا يتفاعل بسهولة مع الأكسجين أو الماء، ولهذا بقيت الحلي الذهبية القديمة براقة.', tip:'خمول الذهب سببه أن طاقة تأكسده عالية، فهو لا يفقد إلكتروناته بسهولة رغم أنه فلز.', fun:'يمكن طَرق غرام واحد من الذهب إلى صفيحة مساحتها نحو متر مربع.' },
80:{ disc:'معروف منذ القدم', name:'رمزه Hg من hydrargyrum أي الفضة السائلة', story:'الزئبق هو الفلز الوحيد السائل في الظروف العادية. وقد استعمله القدماء، لكنه سام، ولذلك صار استعماله في موازين الحرارة محدودًا جدًا.', tip:'ضعف الرابطة الفلزية بين ذرات الزئبق، لأن مستوياته الفرعية d وs ممتلئة تمامًا، يفسر انخفاض درجة انصهاره.', fun:'يتجمد الزئبق عند نحو 38.8 درجة سلزية تحت الصفر.' },
81:{ disc:'اكتُشف عام 1861 على يد ويليام كروكس، وعزله لامي مستقلًا', name:'من اليونانية thallos أي الغصن الأخضر', story:'لاحظ الإنجليزي ويليام كروكس خطًا أخضر ساطعًا في الطيف الذري لعينة تحت المطياف فعرف أنه عنصر جديد، فسمّاه من الغصن الأخضر. والثاليوم سام جدًا ويجب التعامل معه بحذر.', tip:'يوضح الثاليوم كيف قاد التحليل الطيفي إلى اكتشاف عناصر جديدة، لأن لكل عنصر بصمة طيفية فريدة.' },
82:{ disc:'معروف منذ القدم', name:'رمزه Pb من الكلمة اللاتينية plumbum', story:'استعمل الرومان الرصاص في أنابيب المياه، ومن كلمة plumbum جاءت كلمة plumbing أي السباكة. وهو سام، ولذلك أُوقف إضافته إلى البنزين وإلى الدهانات في معظم دول العالم.', tip:'الرصاص عنصر من المجموعة 14 ويكوّن أيونات ' + C('Pb<sup>2+</sup>') + '، ويُستعمل في بطاريات السيارات والدرع الواقي من الأشعة.' },
83:{ disc:'معروف منذ القرون الوسطى، وميّزه كلود جوفروا عن الرصاص عام 1753', story:'ظلّ البزموت يُخلط مع الرصاص والقصدير قرونًا، حتى أثبت الفرنسي جوفروا عام 1753 أنه عنصر مستقل. وهو غير سام تقريبًا، فتُصنع منه بعض الأدوية والمساحيق التجميلية.', tip:'البزموت أثقل عنصر كان يُعد مستقرًا، ثم تبيّن عام 2003 أنه مشع بعمر نصف طويل جدًا، وهو مثال لتغير المعرفة العلمية.' },
84:{ disc:'اكتُشف عام 1898 على يد ماري وبيير كوري', name:'نسبة إلى بولندا وطن ماري كوري', story:'استخلصت ماري كوري وزوجها بيير البولونيوم من خام اليورانيوم بعد أن لاحظا أن الخام أشد إشعاعًا مما يبرره اليورانيوم وحده. وسمّتاه على اسم بولندا، وطن ماري، وكانت بولندا آنذاك دولة بلا استقلال.', tip:'البولونيوم من الفلزات الشبيهة بالفلزات في المجموعة 16، وهو عنصر مشع شديد النشاط الإشعاعي.' },
85:{ disc:'اكتُشف عام 1940 على يد كورسون وماكنزي وسيغريه', name:'من اليونانية astatos أي غير مستقر', story:'صُنع الأستاتين في جامعة كاليفورنيا في بيركلي بقصف البزموت بجسيمات ألفا. وهو أندر العناصر الموجودة في الطبيعة، فلا يوجد منه في القشرة الأرضية كلها أكثر من غرامات قليلة.', tip:'الأستاتين هالوجين من المجموعة 17 يقع أسفل اليود، ومن المتوقع أن يكون لونه داكنًا وكهروسالبيته أقل من اليود.' },
86:{ disc:'اكتُشف عام 1900 على يد فريدريش إرنست دورن', name:'من الراديوم لأنه ينتج منه', story:'الرادون غاز نبيل مشع عديم اللون والرائحة، ينتج عن تحلل الراديوم. قد يتجمع في الأقبية والمنازل المبنية فوق صخور تحتوي اليورانيوم، ويُعد من أسباب سرطان الرئة بعد التدخين.', tip:'الرادون أثقل الغازات النبيلة في المجموعة 18، وتوزيعه الإلكتروني مكتمل فهو خامل كيميائيًا لكنه خطر بإشعاعه.' },
87:{ disc:'اكتُشف عام 1939 على يد مارغريت بيريه في معهد كوري بباريس', name:'نسبة إلى فرنسا', story:'اكتشفت الفرنسية مارغريت بيريه الفرانسيوم أثناء دراسة تحلل الأكتينيوم، وهو آخر عنصر اكتُشف في الطبيعة. وهو شديد الندرة وغير مستقر، فلا يبقى منه إلا لدقائق.', tip:'الفرانسيوم في المجموعة 1 أسفل السيزيوم، ويُتوقع أن يكون أكبر الفلزات القلوية حجمًا وأقلها طاقة تأين.' },
88:{ disc:'اكتُشف عام 1898 على يد ماري وبيير كوري وجوستاف بيمون', name:'من اللاتينية radius أي الشعاع', story:'استخلصت ماري كوري الراديوم بعد سنوات من العمل الشاق على أطنان من الخام. حصلت على جائزة نوبل في الفيزياء عام 1903 وفي الكيمياء عام 1911. وفي عشرينيات القرن الماضي تأذت عاملات دهان الساعات المضيئة بالراديوم، فدفعت قصتهن إلى تشريعات سلامة العمال.', tip:'الراديوم فلز قلوي ترابي من المجموعة 2 يشبه الباريوم في خواصه، ويكوّن أيونات ' + C('Ra<sup>2+</sup>') + '.' },
89:{ disc:'اكتُشف عام 1899 على يد أندريه دوبيرن', name:'من اليونانية aktis أي الشعاع', story:'عزل الفرنسي دوبيرن الأكتينيوم من بقايا خام اليورانيوم. يعطي الأكتينيوم اسمه لسلسلة الأكتينيدات، وهو عنصر مشع يتوهج بلون أزرق في الظلام.', tip:'الأكتينيوم أول عناصر الأكتينيدات، وهي عناصر الانتقال الداخلية التي تمتلئ فيها المستويات الفرعية 5f.' },
90:{ disc:'اكتُشف عام 1828 على يد يونس يعقوب برزيليوس', name:'نسبة إلى ثور إله الرعد في الأساطير الإسكندنافية', story:'وجد برزيليوس عنصرًا جديدًا في معدن نادر أهداه إليه قس هاوٍ، وسمّاه على اسم ثور. وهو أكثر وفرة من اليورانيوم، ويُدرس وقودًا نوويًا محتملًا.', tip:'الثوريوم أول أكتينيد طبيعي مهم بعد الأكتينيوم، ويوضح أن بعض العناصر الثقيلة موجودة في الطبيعة بكميات كبيرة.' },
91:{ disc:'اكتُشف عام 1913 على يد فاينس وغورينغ، وحُدّد نظيره الأطول عمرًا عام 1918 تقريبًا', name:'من اليونانية protos أي الأول، لأنه يتحلل إلى الأكتينيوم', story:'يتحلل البروتكتينيوم إلى الأكتينيوم، ومن هنا اسمه أي ما قبل الأكتينيوم. هو عنصر نادر جدًا وشديد الإشعاع، ولهذا لا تتوفر له تطبيقات عملية واسعة.', tip:'البروتكتينيوم من الأكتينيدات في الفئة f، وفيه يبدأ إلكترون المستوى 5f بالظهور في التوزيع الإلكتروني.' },
92:{ disc:'اكتُشف عام 1789 على يد مارتن كلابروث', name:'نسبة إلى الكوكب أورانوس الذي اكتُشف عام 1781', story:'اكتشف كلابروث اليورانيوم في خام البيتشبلند، وسمّاه على اسم أورانوس. وفي عام 1896 لاحظ بيكريل أن أملاحه تُظهر إشعاعًا غامضًا، وعام 1938 اكتشف هان وستراسمان الانشطار النووي، وفسّرته ليزه مايتنر وأوتو فريش.', tip:'نظير اليورانيوم ' + C('<sup>235</sup>U') + ' ينشطر إلى نواتين أصغر مع طاقة هائلة، وهذا أساس المفاعلات النووية.' },
93:{ disc:'اصطُنع عام 1940 على يد ماكميلان وأبلسون', name:'نسبة إلى الكوكب نبتون', story:'جاء النبتونيوم بعد اليورانيوم كما يأتي نبتون بعد أورانوس. وكان أول عنصر أثقل من اليورانيوم يُصنع في المختبر، وذلك في بيركلي بكاليفورنيا.', tip:'النبتونيوم من العناصر ما بعد اليورانيوم، وهي عناصر اصطناعية تُصنع بقصف النوى بجسيمات.' },
94:{ disc:'اصطُنع عام 1940 على يد سيبورغ وماكميلان وكينيدي وفال', name:'نسبة إلى الكوكب القزم بلوتو', story:'صنع فريق غلين سيبورغ البلوتونيوم في بيركلي، ثم تبيّن أن نظيره ' + C('<sup>239</sup>Pu') + ' ينشطر أيضًا. وصار هذا العنصر وقودًا لبعض المفاعلات النووية.', tip:'البلوتونيوم يتلو النبتونيوم كما يأتي بلوتو بعد نبتون، وكلها من الأكتينيدات في الفئة f.' },
95:{ disc:'اصطُنع عام 1944 على يد فريق سيبورغ', name:'نسبة إلى قارتي أمريكا', story:'سُمّي الأمريسيوم على اسم الأمريكتين لأن في الجدول الدوري يقع تحت اليوروبيوم المسمى على اسم أوروبا. يُستعمل الأمريسيوم-241 في كواشف الدخان المنزلية.', tip:'الأمريسيوم يشبه اليوروبيوم في موقعه في السلسلة، وهذا يوضح التماثل بين اللانثانيدات والأكتينيدات.' },
96:{ disc:'اصطُنع عام 1944 على يد فريق سيبورغ', name:'تكريمًا لماري وبيير كوري', story:'سُمّي الكوريوم تكريمًا لماري وبيير كوري. وهو يشبه الغادولينيوم الذي سُمّي تكريمًا لعالم الكيمياء غادولين، فكلاهما يكرّم عالمًا.', tip:'الكوريوم من الأكتينيدات، ويوضح أن العناصر الاصطناعية يمكن تسميتها تكريمًا للعلماء.' },
97:{ disc:'اصطُنع عام 1949 على يد تومسون وغيورسو وسيبورغ', name:'نسبة إلى مدينة بيركلي بكاليفورنيا', story:'سُمّي البركيليوم على اسم مدينة بيركلي التي أُنتج فيها. وهو أحد العناصر الاصطناعية التي صُنعت بقصف الأمريسيوم بجسيمات ألفا.', tip:'البركيليوم يشبه التربيوم في الجدول الدوري، فهما متجاوران بنفس الموقع في سلسلتي الفئة f.' },
98:{ disc:'اصطُنع عام 1950 على يد فريق جامعة كاليفورنيا', name:'نسبة إلى ولاية كاليفورنيا وجامعتها', story:'صنعه علماء بيركلي بقصف الكوريوم بجسيمات ألفا. وهو يُستعمل مصدرًا للنيوترونات في الكشف عن المعادن والذهب.', tip:'الكاليفورنيوم من الأكتينيدات، وبعض نظائره تتحلل تلقائيًا بالانشطار وتصدر نيوترونات.' },
99:{ disc:'اكتُشف عام 1952 في غبار أول قنبلة هيدروجينية', name:'تكريمًا لألبرت أينشتاين', story:'وجد العلماء الآينشتاينيوم في بقايا أول تفجير للقنبلة الهيدروجينية عام 1952. ثم كُشف عنه علنًا عام 1955، وسُمّي تكريمًا لألبرت أينشتاين.', tip:'الآينشتاينيوم مثال لعناصر نشأت من التقاط النوى لنيوترونات كثيرة بسرعة.' },
100:{ disc:'اكتُشف عام 1952 في غبار أول قنبلة هيدروجينية', name:'تكريمًا لإنريكو فيرمي', story:'اكتُشف الفيرميوم مع الآينشتاينيوم في بقايا الاختبار نفسه، وسُمّي تكريمًا لإنريكو فيرمي الذي بنى أول مفاعل نووي.', tip:'الفيرميوم من أثقل العناصر التي يمكن إنتاجها بكميات قابلة للقياس، وهو من الأكتينيدات.' },
101:{ disc:'اصطُنع عام 1955 على يد غيورسو وهارفي وشوبين وتومسون وسيبورغ', name:'تكريمًا لديمتري مندليف', story:'سُمّي المندليفيوم تكريمًا لديمتري مندليف صاحب الجدول الدوري، الذي ترك فراغات للعناصر المجهولة وتنبأ بخواصها. صُنع هذا العنصر بضع ذرات فقط في كل مرة.', tip:'يذكّرنا المندليفيوم بأن الجدول الدوري ترتيب لعناصر حسب خواصها، وقد تنبأ مندليف بعناصر لم تُكتشف بعد.' },
102:{ disc:'جرى تأكيده في خمسينيات وستينيات القرن العشرين', name:'تكريمًا لألفريد نوبل', story:'سُمّي النوبليوم تكريمًا لألفريد نوبل مؤسس جوائز نوبل. تنازعت مختبرات في عدة بلدان على أول اكتشاف له، ثم أُكّد في تجارب لاحقة.', tip:'النوبليوم من الأكتينيدات، وهو من العناصر التي تُنتج ذرة بعد ذرة ولا تتوفر منها كميات تُرى بالعين.' },
103:{ disc:'اصطُنع عام 1961 على يد غيورسو وفريقه في بيركلي', name:'تكريمًا لإرنست لورنس مخترع السيكلوترون', story:'سُمّي اللورنسيوم تكريمًا لإرنست لورنس الذي اخترع السيكلوترون، وهو جهاز يسرّع الجسيمات. وهو آخر عناصر سلسلة الأكتينيدات.', tip:'اللورنسيوم ينهي سلسلة الأكتينيدات بملء المستوى الفرعي 5f، تمامًا كما ينهي اللوتيتيوم سلسلة اللانثانيدات.' },
104:{ disc:'اصطُنع في الستينيات في روسيا وأمريكا، وأُقرّ اسمه عام 1997', name:'تكريمًا لإرنست رذرفورد', story:'تنازع فريقان في روسيا وأمريكا على اكتشافه. سُمّي تكريمًا لإرنست رذرفورد الذي اكتشف النواة الذرية.', tip:'الرذرفورديوم أول العناصر فوق الأكتينيدات، ويقع في المجموعة 4 أسفل الهافنيوم.' },
105:{ disc:'اصطُنع في الستينيات، وأُقرّ اسمه عام 1997', name:'نسبة إلى مدينة دوبنا الروسية', story:'سُمّي الدوبنيوم على اسم مدينة دوبنا الروسية التي يقع فيها معهد الأبحاث النووية المشترك. وقد صُنع بقصف أهداف ثقيلة بأنوية أخف.', tip:'الدوبنيوم يقع في المجموعة 5 أسفل التانتالوم، وهو عنصر فائق الثقل لا يبقى إلا ثوانٍ.' },
106:{ disc:'اصطُنع عام 1974 في بيركلي', name:'تكريمًا لغلين سيبورغ', story:'سُمّي السيبورغيوم تكريمًا لغلين سيبورغ الذي اكتشف عناصر عديدة بعد اليورانيوم. وكان سيبورغ حيًا حين سُمّي العنصر باسمه، وكان ذلك أمرًا نادرًا.', tip:'السيبورغيوم يقع في المجموعة 6 أسفل التنجستن، وخواصه الكيميائية المتوقعة تشبه التنجستن.' },
107:{ disc:'اصطُنع عام 1981 في مركز جي إس آي بدارمشتات بألمانيا', name:'تكريمًا لنيلز بور', story:'صنعه فريق ألماني بقيادة مونتسنبرغ وأرمبروستر. وسُمّي تكريمًا لنيلز بور صاحب نموذج الذرة ذي المستويات الطاقية.', tip:'البوريوم في المجموعة 7 أسفل الرينيوم، وهو مرتبط بنموذج بور الذي فسّر الطيف الذري للهيدروجين.' },
108:{ disc:'اصطُنع عام 1984 في مركز جي إس آي بألمانيا', name:'من hassia الاسم اللاتيني لولاية هيسن الألمانية', story:'سُمّي الهاسيوم على اسم ولاية هيسن التي تقع فيها مدينة دارمشتات. ومن المتوقع أن يشبه الأوزميوم في الكثافة العالية.', tip:'الهاسيوم يقع في المجموعة 8 أسفل الأوزميوم، وهو عنصر فائق الثقل يعيش لثوانٍ قليلة.' },
109:{ disc:'اصطُنع عام 1982 في مركز جي إس آي بألمانيا', name:'تكريمًا لليزه مايتنر', story:'سُمّي الميتنيريوم تكريمًا لليزه مايتنر التي ساهمت في تفسير الانشطار النووي. وهو العنصر الوحيد الذي سُمّي تكريمًا لامرأة وحدها، فالكوريوم سُمّي لماري وبيير معًا.', tip:'يوضح الميتنيريوم أن العلماء يكرّمون من أسهموا في فهم الذرة، وهو يقع في المجموعة 9 أسفل الإيريديوم.' },
110:{ disc:'اصطُنع عام 1994 في مركز جي إس آي بألمانيا', name:'نسبة إلى مدينة دارمشتات الألمانية', story:'سُمّي الدارمشتاتيوم على اسم المدينة التي يقع فيها المركز الذي صنعه. ومن أجل إنتاجه قُصف هدف من الرصاص بأنوية النيكل.', tip:'الدارمشتاتيوم في المجموعة 10 أسفل البلاتين، وهو عنصر اصطناعي عمره قصير جدًا.' },
111:{ disc:'اصطُنع عام 1994 في مركز جي إس آي بألمانيا', name:'تكريمًا لفيلهلم رونتجن مكتشف الأشعة السينية', story:'سُمّي الرونتجينيوم تكريمًا لفيلهلم رونتجن الذي اكتشف الأشعة السينية عام 1895 فنال أول جائزة نوبل في الفيزياء.', tip:'الرونتجينيوم في المجموعة 11 أسفل الذهب، ويُتوقع أن يكون له بعض خواص الذهب.' },
112:{ disc:'اصطُنع عام 1996 في مركز جي إس آي بألمانيا', name:'تكريمًا لنيكولاس كوبرنيكوس', story:'سُمّي الكوبرنيسيوم تكريمًا لنيكولاس كوبرنيكوس الذي اقترح أن الشمس مركز المجموعة الشمسية. وأُقرّ الاسم رسميًا عام 2010.', tip:'الكوبرنيسيوم في المجموعة 12 أسفل الزئبق، وربما يكون غازيًا في الظروف العادية بسبب ضعف الرابطة الفلزية.' },
113:{ disc:'اصطُنع عام 2004 على يد فريق كوسوكي موريتا في اليابان', name:'من nihon أي اليابان باللغة اليابانية', story:'هو أول عنصر يُكتشف في آسيا. صنعه فريق ياباني في معهد ريكن بقيادة كوسوكي موريتا بعد سنوات طويلة من التجارب، وأُقرّ اسمه عام 2016.', tip:'النيهونيوم في المجموعة 13 أسفل الثاليوم، وهو عنصر فائق الثقل.' },
114:{ disc:'اصطُنع عام 1998 في دوبنا بروسيا', name:'تكريمًا لمختبر فليروف وجورجي فليروف', story:'سُمّي الفليروفيوم على اسم مختبر فليروف للتفاعلات النووية في دوبنا، ويحمل اسم الفيزيائي الروسي جورجي فليروف. ويبحث العلماء في عناصر هذه المنطقة عن نوى أطول عمرًا تُعرف بجزيرة الاستقرار.', tip:'الفليروفيوم في المجموعة 14 أسفل الرصاص، وتشير الحسابات إلى أنه أقل فلزية مما يتوقع.' },
115:{ disc:'اصطُنع عام 2003 في دوبنا بروسيا', name:'نسبة إلى منطقة موسكو', story:'سُمّي الموسكوفيوم على اسم منطقة موسكو التي تقع فيها مدينة دوبنا. صُنع بقصف الأمريسيوم بأنوية الكالسيوم.', tip:'الموسكوفيوم في المجموعة 15 أسفل البزموت، وهو عنصر شديد الإشعاع.' },
116:{ disc:'اصطُنع عام 2000 في دوبنا بروسيا', name:'نسبة إلى مختبر لورنس ليفرمور الوطني بكاليفورنيا', story:'سُمّي الليفرموريوم على اسم مختبر لورنس ليفرمور الوطني الذي شارك في تجارب إنتاجه. ويعمل فيه علماء من عدة بلدان معًا.', tip:'الليفرموريوم في المجموعة 16 أسفل البولونيوم، وهو عنصر فائق الثقل عمره بالمللي ثانية.' },
117:{ disc:'اصطُنع عام 2010 بجهود دوبنا وأوك ريدج وليفرمور وفاندربيلت', name:'نسبة إلى ولاية تينيسي الأمريكية', story:'سُمّي التينيسين على اسم ولاية تينيسي التي تقع فيها مؤسسات أوك ريدج وفاندربيلت. وتطلّب إنتاجه الحصول على هدف من البركيليوم المشع.', tip:'التينيسين في المجموعة 17 أسفل الأستاتين، ويتبع الهالوجينات في الجدول الدوري.' },
118:{ disc:'اصطُنع عام 2002 على يد فريق في دوبنا بقيادة يوري أوغانيسيان', name:'تكريمًا لعالم الفيزياء النووية يوري أوغانيسيان', story:'هو أثقل عنصر معروف حتى اليوم، وفيه تكتمل الدورة السابعة. أُقرّ اسمه عام 2016 تكريمًا للروسي الأرميني يوري أوغانيسيان الذي قاد الأبحاث. وهو ثاني عنصر سُمّي على اسم عالم لا يزال حيًا.', tip:'الأوغانيسون في المجموعة 18 مع الغازات النبيلة، لكن تأثير النسبية يجعله غير خامل على الأرجح.' }
});
