<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F2F9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="كيمياء">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="كيمياء: الضوء والذرة، الجدول الدوري، الأيونات والروابط، مع أدوات تفاعلية وقصص العناصر واختبارات جاهزة.">
<title>كيمياء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@400;700&display=swap">
<style>
/* ============ tokens ============ */
:root{
  --c:#5B4BD8;--cd:#3A2CA6;--ctl:#4A3BC4;--ctd:#B4AAFF;--ct:var(--ctl);
  --bg:#F4F2F9;--card:#FFFFFF;--ink:#1B1830;--muted:#5F5B78;--line:#E0DCEE;
  --good:#13875A;--bad:#CF2F47;--warn:#B87100;--gold:#E3A400;
  --shadow:0 4px 14px rgba(44,28,110,.08);
  --c2:color-mix(in srgb,var(--c) 11%,var(--card));
  --f-ui:"Tajawal","Segoe UI",Tahoma,"Noto Sans Arabic","Geeza Pro",system-ui,-apple-system,sans-serif;
  --f-d:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E0D17;--card:#1A1829;--ink:#EEEBFA;--muted:#A9A5C4;--line:#302D47;--ct:var(--ctd);
    --good:#3DDC97;--bad:#FF7A8A;--warn:#FFC24A;--shadow:0 4px 14px rgba(0,0,0,.45);
    --c2:color-mix(in srgb,var(--c) 24%,var(--card));color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0D17;--card:#1A1829;--ink:#EEEBFA;--muted:#A9A5C4;--line:#302D47;--ct:var(--ctd);
  --good:#3DDC97;--bad:#FF7A8A;--warn:#FFC24A;--shadow:0 4px 14px rgba(0,0,0,.45);
  --c2:color-mix(in srgb,var(--c) 24%,var(--card));color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-weight:500;font-size:16px;line-height:1.7;transition:background .3s,color .3s}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--c);outline-offset:2px}
[hidden]{display:none!important}
.ic{display:block;flex:none}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* ============ background: soft tint + dot grid (no floating symbols) ============ */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:radial-gradient(120% 55% at 100% 0%,color-mix(in srgb,var(--c) 11%,transparent),transparent 62%),radial-gradient(90% 45% at 0% 100%,color-mix(in srgb,var(--c) 8%,transparent),transparent 62%)}
.bgfx::before{content:"";position:absolute;inset:0;background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1.4px);background-size:22px 22px;opacity:.55;-webkit-mask-image:linear-gradient(180deg,#000,transparent 70%);mask-image:linear-gradient(180deg,#000,transparent 70%)}
.wash{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle at 50% 100%,var(--wc) 0,transparent 62%);opacity:0;animation:wash .75s ease-out}
@keyframes wash{0%{opacity:0;transform:scale(.6)}35%{opacity:.3}100%{opacity:0;transform:scale(1.7)}}

/* ============ element tile (visual motif) ============ */
.el{--s:44px;--tc:var(--c);--tg:var(--cd);position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:var(--s);height:var(--s);flex:none;border-radius:calc(var(--s)*.2);border:max(1.5px,calc(var(--s)*.04)) solid var(--tc);background:color-mix(in srgb,var(--tc) 11%,var(--card));color:var(--ct);line-height:1;font-style:normal;text-decoration:none;overflow:hidden}
.el .en{position:absolute;top:calc(var(--s)*.09);inset-inline-start:calc(var(--s)*.12);font-size:max(8.5px,calc(var(--s)*.2));font-weight:700;font-style:normal;line-height:1;opacity:.9}
.el .es{display:block;font-family:var(--f-d);font-size:calc(var(--s)*.44);font-weight:700;direction:ltr;font-style:normal;line-height:1;margin-top:calc(var(--s)*.1);white-space:nowrap}
.el .enm{display:block;font-size:max(9px,calc(var(--s)*.15));font-weight:700;line-height:1.1;margin-top:calc(var(--s)*.04);font-style:normal;max-width:96%;overflow:hidden;text-overflow:clip;white-space:nowrap}
.el.solid{background:linear-gradient(145deg,var(--tc),var(--tg));color:#fff;border-color:transparent}
.el.gold{background:linear-gradient(145deg,#FFD97A,#E39B00);border-color:#B87800;color:#2B1700;box-shadow:0 0 0 2px rgba(255,200,60,.35),0 0 14px rgba(255,185,40,.6);animation:glow 2.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px rgba(255,200,60,.5),0 0 22px rgba(255,185,40,.9)}}
.el.lock{filter:grayscale(1);opacity:.5}

/* ============ layout: top(1 line) / content / progress strip / bottom tabs ============ */
#app{position:absolute;inset:0;z-index:1;height:100%;overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto}
.top{display:flex;align-items:center;gap:5px;height:42px;padding:3px clamp(8px,3vw,16px) 0}
.logo{display:flex;align-items:center;gap:7px;min-height:38px;min-width:0;background:none;border:0;padding:0}
.logo .lt{font-family:var(--f-d);font-weight:700;font-size:22px;line-height:1;white-space:nowrap}
@media(max-width:359px){.logo .lt{display:none}}
.sp{flex:1}
.lv{display:flex;align-items:center;gap:6px;height:36px;padding:0 9px 0 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);box-shadow:var(--shadow);flex:none}
.lv .lvx{display:flex;flex-direction:column;gap:3px;min-width:48px}
.lv .lvx b{font-size:12px;font-weight:800;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.lbar{display:block;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.lbar u{display:block;height:100%;width:0;background:linear-gradient(90deg,#FFC83D,#E39B00);text-decoration:none;border-radius:2px;transition:width .5s}
.lv.pop{animation:pop .45s ease}
@keyframes pop{40%{transform:scale(1.14)}}
.strk{display:flex;align-items:center;gap:3px;height:36px;padding:0 8px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:800;font-size:13px;box-shadow:var(--shadow);flex:none;color:var(--muted)}
.strk.on{color:#D2570A}.strk.on .ic{color:#E8680F}
.strk b{font-variant-numeric:tabular-nums}
.ib{position:relative;flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:38px;min-height:38px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);box-shadow:var(--shadow);padding:0 6px;font-weight:700;color:var(--ink)}
.top .ib{min-width:36px;min-height:36px}
.ib .bdg{position:absolute;top:-5px;inset-inline-start:-5px;min-width:19px;height:19px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;line-height:19px;text-align:center;padding:0 5px}
.ib .bdg:empty{display:none}
.pop-m{position:fixed;z-index:60;top:calc(46px + env(safe-area-inset-top));inset-inline-end:max(8px,env(safe-area-inset-right));min-width:200px;padding:6px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);box-shadow:0 14px 34px rgba(0,0,0,.28);animation:inF .2s both}
.pi{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:0 10px;border:0;background:none;border-radius:11px;font-weight:700;font-size:15px;text-align:start}
.pi:hover,.pi:focus-visible{background:var(--c2)}
.pi .ic{color:var(--ct)}.pi .pn{margin-inline-start:auto;min-width:22px;height:22px;border-radius:11px;background:var(--bad);color:#fff;font-size:12px;font-weight:800;text-align:center;line-height:22px;padding:0 5px}

main{position:relative;min-height:0;min-width:0;overflow:hidden;overflow:clip;touch-action:manipulation}
#view{height:100%}
.wrap{height:100%;max-width:920px;margin:0 auto;padding:4px clamp(8px,3vw,14px) 2px;display:flex;flex-direction:column;min-height:0}
.fitbox{flex:1;min-height:0;overflow:hidden;overflow:clip;position:relative}
.fitbox.pgscroll,.pg.pgscroll{overflow-y:auto;overflow-x:hidden}
.fitin{min-width:0}
.fitbox>.fitin:has(>.xcards),.fitbox>.fitin:has(>.home){height:100%}

/* strip: continuous progress + sub-page dots + next/prev */
.bar{display:flex;align-items:center;gap:7px;padding:5px clamp(8px,3vw,16px) 5px;background:color-mix(in srgb,var(--card) 92%,transparent);border-top:1.5px solid var(--line)}
.nb{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:46px;min-height:46px;padding:0 12px;border-radius:14px;border:2px solid var(--c);font-weight:800;font-size:15px;flex:none;transition:transform .15s,box-shadow .3s}
.nb:active{transform:scale(.95)}
.nb.next{background:linear-gradient(135deg,var(--c),var(--cd));border-color:transparent;color:#fff;box-shadow:0 5px 14px color-mix(in srgb,var(--c) 38%,transparent)}
.nb.prev{background:var(--card);color:var(--ct)}
.nb em{font-style:normal;display:none}
.nb.next em{display:inline}
@media(min-width:420px){.nb em{display:inline}}
.nb.next.wide{padding:0 12px;font-size:13.5px}
.mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px}
.cnt{font-size:13px;font-weight:800;color:var(--ink);line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums}
.cnt span{color:var(--muted);font-weight:700}
#pager{display:flex;align-items:center;justify-content:center;gap:5px;height:11px;line-height:1;font-size:11px;font-weight:800;color:var(--muted)}
#pager i{width:9px;height:9px;border-radius:5px;background:color-mix(in srgb,var(--c) 28%,var(--line));transition:width .25s,background .2s}
#pager i.on{width:22px;background:var(--c)}
#pager span{margin-inline-start:3px}
.prog{width:100%;height:20px;display:flex;align-items:center;cursor:pointer}
.prog>div{position:relative;width:100%;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.prog u{position:absolute;inset-block:0;inset-inline-start:0;display:block;background:color-mix(in srgb,var(--c) 38%,transparent);text-decoration:none;transition:width .35s}
.prog u+u{background:linear-gradient(90deg,var(--c),var(--cd))}

.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(4px,1.4vw,8px);padding:6px clamp(8px,3vw,16px) 7px;background:var(--card);border-top:1.5px solid var(--line);box-shadow:0 -8px 22px rgba(30,16,80,.07)}
.bar:not([hidden])+.tabs{border-top-color:transparent;box-shadow:none}
.tab{--tg:var(--cd);position:relative;overflow:hidden;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:clamp(48px,8vh,56px);padding:5px 2px 8px;border-radius:13px;border:1.5px solid color-mix(in srgb,var(--tc) 40%,transparent);background:color-mix(in srgb,var(--tc) 9%,var(--card));font-weight:800;font-size:clamp(11.5px,3.2vw,13px);line-height:1.2;text-align:center;color:var(--ink);transition:background .3s,color .3s,transform .2s,box-shadow .3s}
.tab:active{transform:scale(.96)}
.tab .tn{position:absolute;top:3px;inset-inline-start:6px;font-size:9.5px;font-weight:700;font-style:normal;opacity:.85;line-height:1}
.tab .ti{line-height:0;color:color-mix(in srgb,var(--tc) 72%,var(--ink))}
.tab.on .ti{color:#fff}
.tab .tl{display:block;min-width:0;max-width:100%;white-space:nowrap}
.tab .tl .tf{display:none}
.tab .tp{position:absolute;inset-inline:0;bottom:0;height:3px;background:color-mix(in srgb,var(--tc) 18%,transparent)}
.tab .tp u{display:block;height:100%;width:0;background:var(--tc);transition:width .5s;text-decoration:none;border-radius:0 3px 3px 0}
.tab.on{background:linear-gradient(145deg,var(--tc),var(--tg));border-color:transparent;color:#fff;box-shadow:0 5px 13px color-mix(in srgb,var(--tc) 42%,transparent)}
.tab.on .tp{background:rgba(255,255,255,.3)}.tab.on .tp u{background:#fff}
@media(min-width:700px){.tab{flex-direction:row;gap:10px;font-size:16px;min-height:54px;padding:6px 12px 9px}.tab .tl .tf{display:inline}.tab .tl .ts{display:none}.tab .tn{display:none}}
@media(max-height:620px){.tab{min-height:46px}.nb{min-height:42px}.top{height:40px}}

/* ============ home ============ */
.home{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:clamp(6px,1.5vh,13px);padding:2px 0}
.hero{display:flex;align-items:center;gap:clamp(10px,3vw,16px)}
.hero .el{--s:clamp(66px,11vh,92px);--tc:var(--c);box-shadow:0 10px 24px color-mix(in srgb,var(--c) 38%,transparent);animation:inF .5s both}
.hero .ht{min-width:0}
.hero h1{margin:0;font-family:var(--f-d);font-weight:700;font-size:clamp(34px,6.5vh,50px);line-height:1.1}
.hero .sub{margin:2px 0 0;color:var(--muted);font-size:clamp(13px,3.5vw,15px);line-height:1.5;font-weight:500}
@media(max-height:560px){.hero .sub{display:none}}
.go{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:50px;padding:6px 16px;border-radius:16px;border:0;background:linear-gradient(135deg,var(--c),var(--cd));color:#fff;text-align:start;box-shadow:0 8px 20px color-mix(in srgb,var(--c) 38%,transparent);transition:transform .15s}
.go:active{transform:scale(.98)}
.go b{display:block;font-size:17px;font-weight:800;line-height:1.3}
.go small{display:block;font-size:12.5px;font-weight:500;opacity:.92;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go>span{min-width:0}
.dr{display:flex;gap:8px;align-items:stretch}
.dcard{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:54px;padding:6px 12px;border-radius:16px;border:1.5px solid color-mix(in srgb,var(--gold) 55%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 16%,var(--card)),var(--card));text-align:start;box-shadow:var(--shadow);transition:transform .15s}
.dcard:active{transform:scale(.98)}
.dcard .dti{color:#B87800;line-height:0}
:root[data-theme="dark"] .dcard .dti{color:#FFC83D}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .dcard .dti{color:#FFC83D}}
.dcard b{display:block;font-size:15.5px;font-weight:800;line-height:1.3}
.dcard small{display:block;font-size:12.5px;font-weight:500;color:var(--muted);line-height:1.3}
.dcard.ok{border-color:var(--good)}
.dcard .dgo{margin-inline-start:auto;color:var(--ct);line-height:0}
.hstr{flex:none;width:clamp(64px,19vw,84px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;border-radius:16px;border:1.5px solid var(--line);background:var(--card);box-shadow:var(--shadow);font-weight:800;line-height:1.2;color:var(--muted)}
.hstr.on{color:#D2570A}
.hstr b{font-size:20px;font-variant-numeric:tabular-nums;color:inherit}
.hstr small{font-size:11.5px;font-weight:700}
.hcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(6px,1.6vw,10px)}
@media(min-width:900px){.hcards{grid-template-columns:repeat(4,minmax(0,1fr))}}
.hcard{--tg:var(--cd);position:relative;overflow:hidden;min-width:0;display:flex;align-items:center;gap:10px;text-align:start;border:0;border-radius:18px;padding:9px 11px;min-height:clamp(74px,12vh,104px);color:#fff;background:linear-gradient(145deg,var(--tc),var(--tg));box-shadow:0 8px 18px color-mix(in srgb,var(--tc) 33%,transparent);transition:transform .2s,box-shadow .2s;animation:rise .5s both}
.hcard:nth-child(2){animation-delay:.06s}.hcard:nth-child(3){animation-delay:.12s}.hcard:nth-child(4){animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.hcard:hover{transform:translateY(-2px)}.hcard:active{transform:scale(.98)}
.hcard .el{--s:clamp(44px,7.4vh,60px);background:rgba(255,255,255,.17);border-color:rgba(255,255,255,.55);color:#fff}
.hcard .hx{min-width:0;flex:1}
.hcard .hn1{font-size:11.5px;font-weight:700;opacity:.92;line-height:1.3}
.hcard .ht{font-size:clamp(14px,3.9vw,17.5px);font-weight:800;line-height:1.25;margin:1px 0 4px}
.hcard .hb{height:5px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
.hcard .hb u{display:block;height:100%;background:#fff;border-radius:3px;text-decoration:none;transition:width .6s}
.hcard .hs{font-size:11.5px;opacity:.95;line-height:1.35;margin-top:3px;font-weight:500}
@media(max-height:600px){.hcard .hn1{display:none}}

/* copyright */
.copy{font-family:var(--f-d);text-align:center;color:var(--muted);line-height:1.35;padding-top:2px}
.copy::before{content:"";display:block;width:min(220px,60%);height:1px;margin:0 auto 5px;background:linear-gradient(90deg,transparent,var(--c),transparent)}
.copy .l1{display:block;font-size:clamp(13px,3.6vw,16px)}
.copy .l2{display:block;font-size:clamp(15px,4.4vw,19px);font-weight:700;color:var(--ink);white-space:nowrap}
.copy .orn{color:var(--c);margin:0 5px;font-size:.7em;vertical-align:.1em}
.copy bdi{unicode-bidi:isolate}

/* ============ slide ============ */
.slide.in-next{animation:inN .38s cubic-bezier(.2,.8,.3,1) both}
.slide.in-prev{animation:inP .38s cubic-bezier(.2,.8,.3,1) both}
.slide.in-fade{animation:inF .4s ease both}
@keyframes inN{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes inP{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inF{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.slide{flex:1;min-height:0;display:flex;flex-direction:column}
.kbadge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;color:var(--ct);background:var(--c2);padding:0 9px;border-radius:20px;line-height:1.9;flex:none;margin-inline-start:auto;white-space:nowrap}
@media(max-width:420px){.kbadge .kt{display:none}.kbadge{padding:0 7px}}
.s-head{flex:none;display:flex;align-items:center;gap:9px;margin:0 0 6px}
.s-head .el{--s:38px;border-radius:10px}
.s-head h2{margin:0;font-family:var(--f-d);font-weight:700;font-size:clamp(18px,5vw,26px);line-height:1.3;min-width:0}
.pg{flex:1;min-height:0;overflow:hidden;overflow:clip;position:relative;font-size:15.5px;line-height:1.7}
@media(min-width:700px) and (min-height:700px){.pg{font-size:17px;line-height:1.75}}
.s-body{min-width:0;overflow-wrap:anywhere}
.s-body img,.s-body svg,.s-body canvas,.s-body video{max-width:100%;height:auto}
.s-body p{margin:.4em 0}
.s-body h3{margin:.5em 0 .2em;color:var(--ct);font-size:1.12em;font-weight:800}
.s-body ul,.s-body ol{padding-inline-start:24px;margin:.3em 0}
.s-body li{margin:.15em 0}
.s-body input[type=range]{accent-color:var(--c);max-width:100%}
.s-body sup,.s-body sub{line-height:0}
.pg>.s-body>*+*,.pg>.s-checks>*+*{margin-top:10px}
.pg>.s-checks{margin-top:10px}
.pg .pf{margin-top:0!important}
.s-checks .q{margin:0}
.ck-h{margin:0 0 4px;font-size:16px;font-weight:800;color:var(--ct)}
.slide.k-summary{padding:8px 10px;border-radius:22px;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,var(--c),#E3A400,var(--c)) border-box;border:3px solid transparent;box-shadow:var(--shadow)}
.slide.k-summary .kbadge{background:linear-gradient(135deg,#FFD66B,#E39B00);color:#2b1700}
.pg.toolpg .s-body svg:not(.ic){max-height:var(--toolH,50vh)}
.pg.toolpg .idea{font-size:14.5px;padding:7px 11px;border-radius:13px;line-height:1.45;font-weight:700}
@media(max-height:620px){.pg.toolpg .idea{font-size:13.5px;padding:5px 9px;line-height:1.4}}

/* ============ content classes ============ */
.idea{position:relative;overflow:hidden;padding:12px 14px;border-radius:18px;background:radial-gradient(circle at 6% 125%,transparent 0 30px,rgba(255,255,255,.15) 31px 40px,transparent 41px),radial-gradient(circle at 6% 125%,rgba(255,255,255,.07) 0 62px,transparent 63px),linear-gradient(135deg,var(--c),var(--cd));color:#fff;font-size:clamp(16.5px,4.3vw,22px);font-weight:800;line-height:1.6;box-shadow:0 8px 20px color-mix(in srgb,var(--c) 30%,transparent)}
.idea *{color:inherit}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow);min-width:0}
.card>h3:first-child,.card>h4:first-child{margin-top:0}
.grid2,.grid3{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media(min-width:640px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:840px){.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.analogy{display:flex;align-items:flex-start;gap:10px;padding:10px;border-radius:16px;background:var(--c2);border-inline-start:6px solid var(--c)}
.analogy .ico{flex:none;font-size:28px;line-height:1.2}
.steps{list-style:none;counter-reset:st;padding:0!important;margin:0}
.steps>li{counter-increment:st;position:relative;min-height:38px;padding:3px 48px 6px 0;margin:4px 0}
.steps>li::before{content:counter(st,arabic-indic);position:absolute;inset-inline-start:0;top:2px;width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--c),var(--cd));color:#fff;font-weight:800;font-size:17px;line-height:36px;text-align:center;box-shadow:0 4px 10px color-mix(in srgb,var(--c) 35%,transparent)}
.steps>li:not(:last-child)::after{content:"";position:absolute;inset-inline-start:17px;top:40px;bottom:-6px;width:2px;background:color-mix(in srgb,var(--c) 30%,transparent)}
.flip{position:relative;display:grid;cursor:pointer;margin:0;min-height:64px;user-select:none;-webkit-user-select:none}
.flip>.fq,.flip>.fa{grid-area:1/1;padding:10px 12px;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .6s cubic-bezier(.3,.7,.3,1);display:flex;flex-direction:column;justify-content:center}
.flip>.fq{background:var(--card);border:2px dashed var(--c);font-weight:700;transform:perspective(900px) rotateY(0)}
.flip>.fq::after{content:"اضغط لترى الجواب \21BB";display:block;margin-top:3px;font-size:12.5px;font-weight:700;color:var(--ct)}
.flip>.fa{background:linear-gradient(135deg,var(--c),var(--cd));color:#fff;border:2px solid transparent;transform:perspective(900px) rotateY(180deg)}
.flip.on>.fq{transform:perspective(900px) rotateY(-180deg)}
.flip.on>.fa{transform:perspective(900px) rotateY(0)}
.eq{direction:ltr;text-align:center;font-weight:700;font-size:clamp(17px,4.4vw,22px);line-height:1.9;padding:8px 10px;border-radius:14px;background:var(--c2);border:1.5px solid color-mix(in srgb,var(--c) 35%,transparent);overflow-x:hidden;overflow-y:hidden}
.note,.warn,.good{padding:9px 12px;border-radius:14px;border-inline-start:6px solid var(--c);background:var(--c2)}
.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,var(--card))}
.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 15%,var(--card))}
.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 10px;border-radius:20px;background:var(--c2);color:var(--ct);font-size:13px;font-weight:800;line-height:1.7;vertical-align:middle}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;padding:0 16px;border-radius:22px;border:2px solid var(--c);background:var(--card);color:var(--ct);font-weight:700;font-size:15px;transition:background .2s,color .2s,transform .15s}
.chip:active{transform:scale(.95)}
.chip.on,.chip[aria-pressed=true]{background:var(--c);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:14px;border:0;background:linear-gradient(135deg,var(--c),var(--cd));color:#fff;font-weight:800;font-size:15px;box-shadow:0 6px 16px color-mix(in srgb,var(--c) 36%,transparent);transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--card);color:var(--ct);border:2px solid var(--c);box-shadow:none}
table.t{width:100%;border-collapse:separate;border-spacing:0;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);font-size:14.5px;line-height:1.6}
table.t th{background:var(--c);color:#fff;font-weight:800;padding:8px 8px;text-align:center}
table.t td{padding:7px 8px;border-top:1px solid var(--line);text-align:center}
table.t tr:nth-child(even) td{background:color-mix(in srgb,var(--c) 6%,var(--card))}
table.t td+td,table.t th+th{border-inline-start:1px solid var(--line)}
@media(max-width:480px){table.t{font-size:13px}table.t th,table.t td{padding:5px 4px}}
.big{font-size:clamp(22px,6vw,32px);font-weight:800;line-height:1.5}
.muted{color:var(--muted)}
.center{text-align:center}

/* visual wrapper (addVisuals) */
.vis-wrap{border:1.5px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
.vis-h{display:flex;align-items:center;gap:6px;padding:3px 8px;border-bottom:1px solid var(--line);background:var(--c2);min-height:30px}
.vis-l{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;color:var(--ct)}
.vis-t{margin-inline-start:auto;display:inline-flex;align-items:center;gap:4px;min-height:26px;padding:0 9px;border-radius:13px;border:1.5px solid var(--c);background:var(--card);color:var(--ct);font-size:12px;font-weight:800}
.vis-b{padding:6px}
.vis{min-width:0}
.vis svg{width:100%;height:auto;max-height:var(--visH,34vh)}
.vis-wrap.paused .vis *{animation-play-state:paused!important}
:root.rm .vis *,:root.rm .vis-wrap *{animation:none!important;transition:none!important}

/* ============ questions ============ */
.q{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:10px;margin:0;box-shadow:var(--shadow)}
.q .qt{font-weight:800;font-size:16px;line-height:1.6;margin-bottom:8px}
.opts{display:grid;gap:6px}
.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:5px 10px;text-align:start;border-radius:13px;border:2px solid var(--line);background:var(--card);font-weight:600;font-size:15px;line-height:1.5;transition:border-color .2s,background .25s,transform .12s,opacity .25s}
.opt:hover{border-color:var(--c)}
.opt:active{transform:scale(.985)}
.opt .lt{flex:none;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:9px;background:var(--c2);color:var(--ct);font-size:14px;font-weight:800}
.opt .ot{min-width:0;flex:1;overflow-wrap:anywhere}
.q.locked .opt{pointer-events:none;cursor:default}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 17%,var(--card))}
.opt.ok .lt{background:var(--good);color:#fff}
.opt.ok::after{content:"\2713";font-weight:800;color:var(--good);font-size:20px}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card));animation:shake .4s}
.opt.no .lt{background:var(--bad);color:#fff}
.opt.no::after{content:"\2717";font-weight:800;color:var(--bad);font-size:20px}
.opt.dim{opacity:.5}
@keyframes shake{25%{transform:translateX(5px)}75%{transform:translateX(-5px)}}
.why{margin-top:8px;padding:8px 10px;border-radius:13px;border-inline-start:5px solid var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card));font-size:14.5px;line-height:1.6;animation:inF .35s both}
.q.bad .why{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--card))}
.xpchip{display:inline-block;margin-inline-start:6px;padding:0 8px;border-radius:10px;background:var(--c);color:#fff;font-size:12px;font-weight:800}
.qz-top{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-weight:800;font-size:14px;color:var(--muted)}
.qz-bar{flex:1;height:9px;border-radius:5px;background:var(--line);overflow:hidden}
.qz-bar u{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--cd));border-radius:5px;transition:width .4s;text-decoration:none}
.qz-act{display:flex;justify-content:center;margin-top:10px}
.res{text-align:center;padding:12px 10px;border-radius:20px;background:var(--card);border:1.5px solid var(--line);box-shadow:var(--shadow);animation:inF .4s both;display:flex;flex-direction:column;align-items:center;gap:2px}
.res .el{--s:60px;margin-bottom:2px}
.stars{display:flex;justify-content:center;gap:8px;direction:ltr;margin:2px 0}
.stars span{display:inline-block;line-height:0;animation:starpop .6s cubic-bezier(.3,1.6,.5,1) both;color:#E8A200}
.stars span .ic{width:clamp(34px,10vw,46px);height:auto;fill:currentColor}
.stars span.off{color:var(--muted);opacity:.3}
@keyframes starpop{from{transform:scale(0) rotate(-120deg)}to{transform:scale(1) rotate(0)}}
.res .sc{font-size:28px;font-weight:800;color:var(--ct);line-height:1.3}
.res .acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px}

/* ============ overlays ============ */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,5,25,.55);display:flex;animation:ovin .25s both;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
@keyframes ovin{from{opacity:0}to{opacity:1}}
.drawer{width:min(380px,90vw);height:100%;background:var(--card);display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.3);animation:dr .3s cubic-bezier(.2,.8,.3,1) both}
@keyframes dr{from{transform:translateX(100%)}to{transform:none}}
.dh,.sh{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px;background:linear-gradient(135deg,var(--c),var(--cd));color:#fff;font-weight:800;font-size:16px}
.dh b,.sh b{flex:1;display:flex;align-items:center;gap:8px}
.dh .ib,.sh .ib{background:rgba(255,255,255,.2);color:#fff;border-color:transparent;box-shadow:none}
.dl{list-style:none;margin:0;padding:6px 8px;overflow:hidden;flex:1;min-height:0}
.di{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:4px 10px;margin:2px 0;border-radius:14px;border:2px solid transparent;background:none;text-align:start;line-height:1.4}
.di:hover{background:var(--c2)}
.di.on{border-color:var(--c);background:var(--c2);font-weight:800}
.di .dn{flex:none;width:30px;height:30px;border-radius:9px;background:var(--line);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.di.on .dn{background:var(--c);color:#fff}
.di .dt{flex:1;min-width:0;font-size:14.5px}
.di .dt small{display:inline-block;margin-inline-start:6px;padding:0 6px;border-radius:8px;background:var(--c2);color:var(--ct);font-size:11px;font-weight:800}
.di .dc{flex:none;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.di.done .dc{background:var(--good);color:#fff}
.dnav{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 10px;border-top:1.5px solid var(--line);font-weight:800;font-size:13px;color:var(--muted)}
.dnav .chip{min-height:40px;padding:0 14px}
.dnav .chip:disabled{opacity:.35;pointer-events:none}
.dfoot{flex:none;padding:0 10px 8px}
.sheet{margin:auto;width:min(640px,100%);height:min(100%,720px);display:flex;flex-direction:column;background:var(--bg);border-radius:24px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.4);animation:inF .3s both}
.sb{flex:1;min-height:0;display:flex;flex-direction:column;padding:8px 12px 10px;overflow:hidden}
.mnav{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;font-weight:800;font-size:13px;color:var(--muted)}
.mnav .chip{min-height:40px;padding:0 14px}
.mnav .chip:disabled{opacity:.35;pointer-events:none}
.mq .ml{font-size:12.5px;font-weight:700;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.mq.fixed .q{border-color:var(--good)}
.empty{text-align:center;padding:28px 10px;font-size:18px;font-weight:700}
@media(max-width:600px){.ov.sh-ov{align-items:flex-end}.sheet{border-radius:24px 24px 0 0;height:min(94%,720px);margin:auto 0 0}}
.xpb{position:fixed;z-index:80;transform:translateX(-50%);pointer-events:none;background:linear-gradient(135deg,#FFD66B,#E39B00);color:#2b1700;font-weight:800;padding:2px 12px;border-radius:16px;box-shadow:0 6px 16px rgba(227,155,0,.45);animation:xpf 1.2s ease-out both}
@keyframes xpf{0%{opacity:0;transform:translate(-50%,0) scale(.6)}15%{opacity:1;transform:translate(-50%,6px) scale(1.15)}100%{opacity:0;transform:translate(-50%,52px) scale(1)}}

/* achievements */
.ach-top{flex:none;display:flex;align-items:center;gap:12px;padding:6px 4px 10px}
.ach-top .el{--s:58px}
.ach-top .at{flex:1;min-width:0}
.ach-top .at b{display:block;font-size:17px;font-weight:800;line-height:1.3}
.ach-top .at small{display:block;font-size:12.5px;color:var(--muted);line-height:1.4;font-weight:600}
.ach-top .lbar{margin-top:5px;height:6px}
.ach-st{flex:none;text-align:center;font-weight:800;color:var(--muted);line-height:1.2;font-size:12px}
.ach-st.on{color:#D2570A}.ach-st b{display:block;font-size:20px;color:inherit}
.ach-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:7px}
@media(min-width:560px){.ach-grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr))}}
.bd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:0;min-width:0;padding:4px 3px;border-radius:15px;border:1.5px solid var(--line);background:var(--card);text-align:center;font-size:12px;font-weight:700;line-height:1.25}
.bd .el{--s:44px}
.bd.sel{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 30%,transparent)}
.bd span{display:block;max-width:100%}
.ach-hint{flex:none;min-height:46px;margin-top:8px;padding:7px 12px;border-radius:14px;background:var(--c2);font-size:14px;font-weight:600;line-height:1.5;display:flex;align-items:center}
.toast{position:fixed;z-index:90;top:calc(50px + env(safe-area-inset-top));inset-inline:0;margin:auto;width:max-content;max-width:calc(100% - 24px);display:flex;align-items:center;gap:10px;padding:6px 14px 6px 8px;border-radius:16px;background:var(--card);border:1.5px solid var(--gold);box-shadow:0 12px 30px rgba(0,0,0,.3);animation:toast 3.2s ease both;pointer-events:none}
.toast .el{--s:40px}
.toast small{display:block;font-size:11.5px;color:var(--muted);font-weight:700;line-height:1.2}
.toast b{display:block;font-size:15px;font-weight:800;line-height:1.3}
@keyframes toast{0%{opacity:0;transform:translateY(-16px) scale(.9)}10%,86%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-10px)}}
.lvov{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,5,25,.66);animation:ovin .25s both}
.lvc{width:min(340px,100%);padding:20px 16px 16px;border-radius:26px;background:var(--card);border:2px solid var(--gold);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:lvin .6s cubic-bezier(.3,1.4,.5,1) both}
@keyframes lvin{from{opacity:0;transform:scale(.6) rotate(-6deg)}to{opacity:1;transform:none}}
.lvc .el{--s:104px;margin:0 auto}
.lvc h2{margin:10px 0 0;font-family:var(--f-d);font-size:28px;line-height:1.2}
.lvc p{margin:4px 0 12px;color:var(--muted);font-weight:600;line-height:1.5}
canvas.cf{position:fixed;inset:0;z-index:101;pointer-events:none;width:100%;height:100%}

/* ============ exams ============ */
.xw{padding-top:2px}
.xh{flex:none;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.xw .qz-bar{flex:none}
.xh .ib{min-width:40px;min-height:40px}
.xt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3;font-weight:800;font-size:clamp(14px,3.8vw,16px)}
.xt span{font-size:12px;color:var(--muted);font-weight:700}
.xw .chip{min-height:40px;padding:0 12px;font-size:13px}
.xf{flex:none;display:flex;gap:8px;justify-content:center;align-items:center;padding:6px 0 4px;min-height:54px}
.xf .btn{min-height:46px;flex:1;max-width:340px}
.xf .btn.ghost{flex:none;padding:0 16px}
.xtag{display:inline-flex;margin-bottom:6px}
.xlead{flex:none;display:flex;align-items:center;gap:8px;font-weight:800;font-size:clamp(15px,4vw,18px);margin:2px 0 6px;color:var(--ct)}
.xcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto repeat(3,minmax(clamp(66px,11vh,100px),1fr));gap:clamp(6px,1.6vw,10px);height:100%;max-height:560px}
.xcards .dcard{grid-column:1/-1}
@media(min-width:900px){.xcards{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:auto repeat(2,minmax(clamp(66px,11vh,100px),1fr));max-height:400px}}
.xcard{--tg:var(--cd);position:relative;overflow:hidden;min-width:0;display:flex;align-items:center;gap:9px;text-align:start;border:0;border-radius:18px;padding:8px 10px;color:#fff;background:linear-gradient(145deg,var(--tc),var(--tg));box-shadow:0 8px 18px color-mix(in srgb,var(--tc) 32%,transparent);transition:transform .2s;animation:rise .45s both}
.xcard:nth-child(3){animation-delay:.05s}.xcard:nth-child(4){animation-delay:.1s}.xcard:nth-child(5){animation-delay:.15s}.xcard:nth-child(6){animation-delay:.2s}
.xcard:active{transform:scale(.97)}
.xcard .el{--s:clamp(40px,6.4vh,52px);background:rgba(255,255,255,.17);border-color:rgba(255,255,255,.55);color:#fff}
.xcard .xx{min-width:0;flex:1}
.xcard .xn{font-size:clamp(14px,3.8vw,16.5px);font-weight:800;line-height:1.25}
.xcard .xs{font-size:12px;opacity:.95;line-height:1.35;font-weight:500}
.xcard.off{background:var(--card);color:var(--muted);box-shadow:none;border:2px dashed var(--line);pointer-events:none}
.xcard.off .el{background:transparent;border-color:var(--line);color:var(--muted)}
.xres .res{padding:10px 8px}
.xres .grade{font-size:clamp(18px,5vw,24px);font-weight:800;color:var(--ct)}
.rv{background:var(--card);border:1.5px solid var(--line);border-inline-start:6px solid var(--bad);border-radius:14px;padding:8px 12px}
.rv .rq{font-weight:800;line-height:1.55}
.rv .ra{margin-top:4px;font-size:.95em}
.rv .ra b{color:var(--good)}
.rv .rw{color:var(--bad);font-size:.92em}
.qa-q{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow);font-weight:800;font-size:clamp(15.5px,4vw,18px);line-height:1.65}
.qa-a{margin-top:8px;padding:10px 12px;border-radius:14px;border-inline-start:6px solid var(--good);background:color-mix(in srgb,var(--good) 13%,var(--card));animation:inF .3s both}
.qa-a .fin{margin-top:6px;font-weight:800}
.xchips{flex:none;display:flex;gap:6px;margin-bottom:6px}
.xchips .chip{flex:1;min-width:0;padding:0 4px;font-size:13px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .el.gold{animation:none!important}
}
</style>
</head>
<body>
<div class="bgfx" id="bgfx" aria-hidden="true"></div>
<div id="app">
  <header class="top">

}

}
function collectSlide(pg){

function Pager(pg,collectFn,start,onChange,opt){

    }

  }
  function fitTool(list){
    var core=list.filter(function(b){return !b.classList.contains('idea')});
    if(!core.length)core=list;

    ideas.forEach(unsq);core.forEach(unsq);
    if(!over())return false;
    if(squeeze(core,over,.62))return false;

        b.style.display='';Array.prototype.forEach.call(b.children,function(k){k.style.display=''});unsq(b);b.style.zoom='';

        if(cur.length&&cur.length<=2&&cur.every(function(b){return b.classList.contains('idea')})&&squeeze(u,over,.85)){cur=t2;return}

  }
  function showPage(i,quiet){

    prev:function(){if(idx>0){showPage(idx-1);return true}return false},

}

      var acts=sec.querySelector('.acts');

    }

}

function bankItems(f){

function testCount(t){
  if(t.ch)return Math.min(t.n,pool(t.ch).length);
  if(t.id==='all'){var s=0;['ch1','ch2','ch3'].forEach(function(c){s+=pool(c).length});return Math.min(t.n,s)}
  if(t.id==='bank')return bankItems('all').length;
  return misCount();

function buildTest(t){
  if(t.id==='daily')return dailyQs();
  if(t.ch)return shuffle(pool(t.ch)).slice(0,t.n);
  var ps=['ch1','ch2','ch3'].map(function(c){return shuffle(pool(c))}),out=[],i=0;
  while(out.length<t.n&&(ps[0].length||ps[1].length||ps[2].length)){var a=ps[i%3];if(a.length)out.push(a.shift());i++}
  return shuffle(out);
}

function cfg(z){ /* خوارزمية أفباو + استثناء Cr و Cu */
  var out=[],left=z,i;
  for(i=0;i<ORDER.length&&left>0;i++){var c=Math.min(CAP[ORDER[i][1]],left);out.push([ORDER[i][0],ORDER[i][1],c]);left-=c;}
  function setc(n,t,v){for(var k=0;k<out.length;k++)if(out[k][0]==n&&out[k][1]==t){out[k][2]=v;return;}}
  if(z==24){setc(4,'s',1);setc(3,'d',5);}
  if(z==29){setc(4,'s',1);setc(3,'d',10);}
  return out;
}
function sup(n){return '<sup>'+n+'</sup>';}
function sub2html(a){return a[0]+a[1]+sup(a[2]);}
function cfgHtml(arr){return arr.map(sub2html).join(' ');}
function cfgText(arr){return arr.map(function(a){return a[0]+a[1]+a[2];}).join(' ');}
function shortCfg(z){
  var arr=cfg(z),nb=0,i;
  for(i=0;i<NOBLE.length;i++)if(NOBLE[i]<z)nb=NOBLE[i];
  if(!nb)return null;
  var s=0,k=0;while(k<arr.length&&s<nb){s+=arr[k][2];k++;}
  var sym=SYM[nb-1];
  return '['+sym+'] '+cfgHtml(arr.slice(k));
}
function pos(z){ /* [دورة, مجموعة|0 للـ f] */
  if(z<=2)return [1,z==1?1:18];
  if(z<=4)return [2,z-2];if(z<=10)return [2,z+8];
  if(z<=12)return [3,z-10];if(z<=18)return [3,z];
  if(z<=36)return [4,z-18];
  if(z<=54)return [5,z-36];
  if(z<=56)return [6,z-54];
  if(z<=71)return [6,0];
  if(z<=86)return [6,z-68];
  if(z<=88)return [7,z-86];
  if(z<=103)return [7,0];
  return [7,z-100];
}
function blockOf(z){
  var a=cfg(z);var last=a[a.length-1];
  /* الفئة حسب آخر مجال فرعي في ترتيب أفباو */
  var mx=0,t=last[1];
  /* Cr, Cu: آخر مجال في أفباو هو 3d */
  if(z==24||z==29)t='d';
  return t;
}
function typeOf(z){var s=SYM[z-1];if(METALLOID[s])return 'm';if(NONMETAL[s])return 'n';return 'f';}
var TYPEN={f:'فلز',n:'لافلز',m:'شبه فلز'};
var FAMILY={1:'الفلزات القلوية',2:'الفلزات القلوية الأرضية',17:'الهالوجينات',18:'الغازات النبيلة (الخاملة)'};
function valenceSubs(z){
  var a=cfg(z),b=blockOf(z),n=pos(z)[0],r=[],i;
  for(i=0;i<a.length;i++){
    var x=a[i];
    if(b=='s'||b=='p'){if(x[0]==n&&(x[1]=='s'||x[1]=='p'))r.push(x);}
    else if(b=='d'){if((x[0]==n&&x[1]=='s')||(x[0]==n-1&&x[1]=='d'))r.push(x);}
    else {if((x[0]==n&&x[1]=='s')||(x[0]==n-2&&x[1]=='f')||(x[0]==n-1&&x[1]=='d'))r.push(x);}
  }
  r.sort(function(p,q){return (q[0]-p[0])||0;});
  return r;
}
function oxOf(z){
  var g=pos(z)[1],s=SYM[z-1],b=blockOf(z);
  if(s=='H')return '+1 (و -1 في الهيدريدات)';
  if(b=='f')return '+3 غالباً';
  if(b=='d')return 'متغيّر (يوجد غالباً +2 و +3 ...)';
  var m={1:'+1',2:'+2',13:'+3',14:'±4',15:'-3',16:'-2',17:'-1',18:'0'};
  return m[g];
}

function buildGrid(gridEl,opts){ /* opts.maxPeriod , opts.onclick -> returns cells map z->el */
  var maxP=opts.maxPeriod||7,cells={},z;
  gridEl.innerHTML='';
  function place(zz,r,c){
    var b=document.createElement('button');b.type='button';b.className='ch2-c';
    b.style.gridRow=r;b.style.gridColumn=c;
    b.innerHTML='<i>'+zz+'</i><b class="ltr">'+SYM[zz-1]+'</b>'+(opts.extra?'<u>'+opts.extra(zz)+'</u>':'');
    b.setAttribute('aria-label',AR[zz-1]);
    b.addEventListener('click',function(){opts.onclick(zz,b);});
    gridEl.appendChild(b);cells[zz]=b;
  }
  for(z=1;z<=118;z++){
    var p=pos(z);
    if(p[0]>maxP)continue;
    if(p[1]>0){place(z,p[0],p[1]);}
    else if(!opts.noF){
      var base=p[0]==6?57:89;
      place(z,p[0]==6?9:10,z-base+3);
    }
  }
  if(!opts.noF&&maxP>=6){
    var ph=document.createElement('div');ph.className='ch2-ph';ph.style.gridRow=6;ph.style.gridColumn=3;ph.textContent='57–71';gridEl.appendChild(ph);
    var l1=document.createElement('div');l1.className='ch2-lab';l1.style.gridRow=9;l1.textContent='اللانثانيدات';gridEl.appendChild(l1);
    if(maxP>=7){
      var ph2=document.createElement('div');ph2.className='ch2-ph';ph2.style.gridRow=7;ph2.style.gridColumn=3;ph2.textContent='89–103';gridEl.appendChild(ph2);
      var l2=document.createElement('div');l2.className='ch2-lab';l2.style.gridRow=10;l2.textContent='الأكتينيدات';gridEl.appendChild(l2);
    }
  }
  return cells;
}

var VZ=[3,4,5,6,7,8,9,11,12,13,14,15,16,17,19,20,31,32,33,34,35,37,38,49,50,53,56,21,22,26,30];
function reasonSteps(z){
  var a=cfg(z),p=pos(z),b=blockOf(z),vs=valenceSubs(z),last=a[a.length-1],n=0,tot=0;
  a.forEach(function(x){if(x[0]>n)n=x[0];});
  var lastNon=null;
  var s1='آخر مجال رئيسي في التوزيع هو <span class="ltr">n = '+n+'</span> ← <b>الدورة = '+n+'</b>.';
  var lastSub=a[a.length-1];
  var s2='آخر مجال فرعي ينتهي به التوزيع: <span class="ltr">'+sub2html(lastSub)+'</span> ← <b>الفئة '+b+'</b>.';
  var s3;
  if(b=='s'){s3='إلكترونات التكافؤ = عدد إلكترونات s = '+lastSub[2]+' ← <b>المجموعة = '+p[1]+'</b>.';}
  else if(b=='p'){vs.forEach(function(x){tot+=x[2];});s3='إلكترونات التكافؤ = <span class="ltr">'+cfgHtml(vs.slice().reverse())+'</span> = '+tot+' ← المجموعة = '+tot+' + 10 = <b>'+p[1]+'</b>.';}
  else{s3='الفئة d: المجموعة = عدد إلكترونات d + 2 = '+lastSub[2]+' + 2 = <b>'+p[1]+'</b> (التكافؤ: <span class="ltr">'+cfgHtml(vs)+'</span>).';}
  return [s1,s2,s3];
}
function initChecker(root){
  var cfgEl=el(root,'.ch2-cfg'),res=el(root,'.ch2-res'),scoreEl=el(root,'.ch2-score'),chk=el(root,'.ch2-check'),nxt=el(root,'.ch2-next');
  var pickP=el(root,'.ch2-pp'),pickG=el(root,'.ch2-pg'),pickB=el(root,'.ch2-pb');
  var cur=0,ans={p:0,g:0,b:''},score=0,done=0,answered=false,i;
  function mk(box,vals,key){
    box.innerHTML='';
    vals.forEach(function(v){
      var b=document.createElement('button');b.type='button';b.className='chip';b.textContent=v;
      b.addEventListener('click',function(){
        if(answered)return;ans[key]=v;
        Array.prototype.forEach.call(box.children,function(x){x.classList.toggle('ch2-on',x===b);});
      });
      box.appendChild(b);
    });
  }
  var P=[1,2,3,4,5,6,7],G=[];for(i=1;i<=18;i++)G.push(i);
  mk(pickP,P,'p');mk(pickG,G,'g');mk(pickB,['s','p','d','f'],'b');
  function nextQ(){
    var prev=cur;
    do{cur=VZ[Math.floor(Math.random()*VZ.length)];}while(cur==prev&&VZ.length>1);
    ans={p:0,g:0,b:''};answered=false;res.innerHTML='';
    Array.prototype.forEach.call(root.querySelectorAll('.ch2-pick .chip'),function(x){x.classList.remove('ch2-on');});
    cfgEl.innerHTML=cfgHtml(cfg(cur));
    chk.disabled=false;
  }
  chk.addEventListener('click',function(){
    if(answered)return;
    if(!ans.p||!ans.g||!ans.b){res.innerHTML='<div class="warn">اختر الدورة والمجموعة والفئة أولاً.</div>';return;}
    answered=true;chk.disabled=true;
    var p=pos(cur),b=blockOf(cur);
    var okP=ans.p==p[0],okG=ans.g==p[1],okB=ans.b==b,all=okP&&okG&&okB;
    done++;if(all){score++;xp(3);}
    scoreEl.textContent=score+' / '+done;
    var st=reasonSteps(cur);
    res.innerHTML='<div class="'+(all?'good':'warn')+'">'+(all?'أحسنت! ':'راجع: ')+
      'الدورة '+(okP?'✔':'✘')+' — المجموعة '+(okG?'✔':'✘')+' — الفئة '+(okB?'✔':'✘')+'</div>'+
      '<ol class="steps"><li>'+st.join('</li><li>')+'</li></ol>'+
      '<div class="note">هذا العنصر هو <b class="ltr">'+SYM[cur-1]+'</b> ('+AR[cur-1]+') وعدده الذري '+cur+'.</div>';
  });
  nxt.addEventListener('click',nextQ);
  nextQ();
}

function initRace(root){
  var qEl=el(root,'.ch2-rq'),opts=el(root,'.ch2-ro'),fb=el(root,'.ch2-rf'),scEl=el(root,'.ch2-rs'),nx=el(root,'.ch2-rn');
  var score=0,tot=0,streak=0;
  var P=[[1,['Li','Be','B','C','N','O','F']],[2,['Na','Mg','Al','Si','P','S','Cl']],[3,['K','Ca','Ga','Ge','As','Se','Br']],[4,['Rb','Sr','In','Sn','Sb','Te','I']]];
  var GR=[['Li','Na','K','Rb','Cs'],['Be','Mg','Ca','Sr','Ba'],['F','Cl','Br','I'],['O','S','Se','Te'],['N','P','As','Sb'],['C','Si','Ge','Sn','Pb'],['B','Al','Ga','In']];
  var CR=[
    {k:'r',lbl:'الأكبر حجماً (نصف قطراً)',big:true},
    {k:'r',lbl:'الأصغر حجماً (نصف قطراً)',big:false},
    {k:'ie',lbl:'الأعلى طاقة تأين',big:true},
    {k:'ie',lbl:'الأقل طاقة تأين',big:false},
    {k:'en',lbl:'الأكثر كهروسالبية',big:true},
    {k:'en',lbl:'الأقل كهروسالبية',big:false}];
  function pick(arr,n){var a=arr.slice(),r=[];while(r.length<n&&a.length){r.push(a.splice(Math.floor(Math.random()*a.length),1)[0]);}return r;}
  var cur=null;
  function gen(){
    var tries=0;
    while(tries++<200){
      var c=CR[Math.floor(Math.random()*CR.length)],M=METRIC[c.k],inPeriod=Math.random()<0.5,set,items;
      if(inPeriod){set=P[Math.floor(Math.random()*P.length)][1];}else{set=GR[Math.floor(Math.random()*GR.length)];}
      items=pick(set,Math.random()<0.5?2:3);if(items.length<2)continue;
      var idx=M.idx,vals=items.map(function(s){return TR[s][idx];});
      if(vals.some(function(v){return v==null;}))continue;
      /* الاتجاه المتوقع حسب الموقع */
      var zs=items.map(function(s){return SYM.indexOf(s)+1;});
      var score_=zs.map(function(z){var p=pos(z);
        /* درجة المتجه: x الدورة نحو اليمين، y الهبوط */
        var gx=p[1]>2?p[1]-10:p[1]; /* العمود المعدل 1..8 */
        return {gx:gx,per:p[0]};});
      var inc; /* اتجاه الزيادة: هل القيمة تزداد مع gx أو per؟ */
      var best=0,bi=0,wi=0,worst=1e9;
      vals.forEach(function(v,i){var vv=c.big?v:-v;if(i==0||vv>best){best=vv;bi=i;}});
      var sorted=vals.slice().sort(function(a,b){return a-b;});
      var gap=(sorted[sorted.length-1]-sorted[0])/(Math.abs(sorted[sorted.length-1])||1);
      if(gap<0.12)continue;
      /* تحقق من توافق البيانات مع الاتجاه: لا نقبل الحالات الشاذة */
      var trendWin=0,tv=-1e9;
      items.forEach(function(s,i){
        var sc;
        var z=zs[i],p=pos(z),gx=p[1]>2?p[1]-10:p[1];
        var rightward=(c.k=='r')?-gx:gx;      /* في الدورة */
        var downward=(c.k=='r')?p[0]:-p[0];    /* في المجموعة */
        sc=inPeriod?rightward:downward;
        if(!c.big)sc=-sc;
        if(sc>tv){tv=sc;trendWin=i;}
      });
      if(trendWin!=bi)continue;
      cur={c:c,M:M,items:items,vals:vals,bi:bi,inPeriod:inPeriod};
      return;
    }
    cur={c:CR[0],M:METRIC.r,items:['Li','F'],vals:[167,42],bi:0,inPeriod:true};
  }
  function why(){
    var c=cur.c,M=cur.M,w=cur.items[cur.bi];
    var dir=cur.inPeriod?(M.per+' في الدورة من اليسار إلى اليمين'):(M.grp+' في المجموعة من أعلى إلى أسفل');
    var r=cur.inPeriod?M.whyP:M.whyG;
    return '<b class="ltr">'+w+'</b> هو '+c.lbl.replace(' (نصف قطراً)','')+' لأن '+M.n+' '+dir+'. '+r+
      '<br><span class="muted ltr">'+cur.items.map(function(s,i){return s+' = '+cur.vals[i]+(cur.M.unit?' '+cur.M.unit:'');}).join(' ، ')+'</span>';
  }
  function render(){
    gen();fb.innerHTML='';nx.style.display='none';opts.innerHTML='';
    var where=cur.inPeriod?'(من الدورة نفسها)':'(من المجموعة نفسها)';
    qEl.innerHTML='أيّ هذه العناصر '+where+' هو <b>'+cur.c.lbl+'</b>؟';
    cur.items.forEach(function(s,i){
      var b=document.createElement('button');b.type='button';b.className='btn ltr';b.style.margin='4px';
      b.textContent=s+' ('+AR[SYM.indexOf(s)]+')';b.style.direction='rtl';
      b.addEventListener('click',function(){
        if(nx.style.display=='block')return;
        tot++;
        var ok=i==cur.bi;
        if(ok){score++;streak++;xp(2);}else streak=0;
        scEl.textContent='النتيجة: '+score+' / '+tot+(streak>1?' — سلسلة '+streak+' 🔥':'');
        fb.innerHTML='<div class="'+(ok?'good':'warn')+'">'+(ok?'صحيح! ':'ليست الإجابة الصحيحة. ')+why()+'</div>';
        nx.style.display='block';
      });
      opts.appendChild(b);
    });
  }
  nx.addEventListener('click',render);
  render();
}

function initStoryGame(root){
  var q=root.querySelector('.ch2-sg-q'),ops=root.querySelector('.ch2-sg-o'),fb=root.querySelector('.ch2-sg-f'),nx=root.querySelector('.ch2-sg-n'),sc=root.querySelector('.ch2-sg-s');
  var right=0,tot=0,cur=0,done=false;
  function pool(){var o=window.ELEMENT_STORIES||{};return Object.keys(o).map(Number).filter(function(z){return o[z]&&o[z].story&&z>=1&&z<=118&&AR[z-1];});}
  function mask(t,z){var r=t;[AR[z-1],SYM[z-1]].forEach(function(w){if(w&&w.length>1)r=r.split(w).join('«؟»');});return r;}
  function next(){
    var P=pool();
    if(P.length<8){q.innerHTML='قصص العناصر قيد الإعداد.';ops.innerHTML='';nx.style.display='none';return;}
    cur=P[Math.floor(Math.random()*P.length)];done=false;fb.innerHTML='';nx.style.display='none';
    var st=ELEMENT_STORIES[cur];
    q.innerHTML='<div class="muted" style="font-size:13px">'+(st.disc||'')+'</div><div style="margin-top:4px">'+mask(st.story,cur)+'</div>';
    var set=[cur];while(set.length<4){var r=P[Math.floor(Math.random()*P.length)];if(set.indexOf(r)<0)set.push(r);}
    set.sort(function(){return Math.random()-.5;});
    ops.innerHTML='';
    set.forEach(function(z){var b=document.createElement('button');b.type='button';b.className='chip';b.style.cssText='margin:3px;min-height:44px;font-size:15px';b.textContent=AR[z-1];
      b.addEventListener('click',function(){
        if(done)return;done=true;tot++;
        if(z===cur){right++;b.style.background='var(--good)';b.style.color='#fff';xp(5);fb.innerHTML='<div class="good">صحيح! هذا هو <b>'+AR[cur-1]+'</b>.</div>';}
        else{b.style.background='var(--bad)';b.style.color='#fff';fb.innerHTML='<div class="warn">الجواب: <b>'+AR[cur-1]+'</b>.</div>';}
        sc.textContent='النتيجة: '+right+' / '+tot;
        var tip=ELEMENT_STORIES[cur].tip;if(tip)fb.innerHTML+='<div class="note" style="margin-top:6px">💡 '+tip+'</div>';
        nx.style.display='';
      });ops.appendChild(b);});
  }
  nx.addEventListener('click',next);next();
}

2:{ disc:'رُصد عام 1868 في طيف الشمس، وعُزل على الأرض عام 1895 على يد رامزي', name:'من الكلمة اليونانية «هيليوس» أي الشمس', story:'أثناء كسوف الشمس عام 1868 لاحظ العالمان جانسن ولوكير خطاً أصفر في طيف الشمس لا يطابق أي عنصر معروف، فنُسب إلى عنصر جديد سُمّي على اسم الشمس. وبعد 27 عاماً عثر رامزي عليه في الأرض.', tip:'دليل على أن لكل عنصر بصمة طيفية خطية فريدة. وتوزيعه <span class="ltr">1s<sup>2</sup></span> مكتمل، فهو غاز نبيل وله أعلى طاقة تأين بين العناصر.', fun:'أول عنصر عُرف في الفضاء قبل أن يُعرف على الأرض.' },
3:{ disc:'اكتُشف عام 1817 على يد يوهان أرفدسون', name:'من «ليثوس» اليونانية أي الحجر', story:'اكتشفه أرفدسون في معدن البتالايت، وسُمّي «حجراً» لأنه وُجد في المعادن الصخرية بخلاف الصوديوم والبوتاسيوم اللذين استُخلصا من النباتات. وهو اليوم قلب بطاريات الهواتف والسيارات الكهربائية.', tip:'أخف الفلزات وأقلّها كثافة، يطفو على الزيت، ويلوّن اللهب بالأحمر القرمزي. يفقد إلكتروناً واحداً بسهولة فيصير <span class="ltr">Li<sup>+</sup></span> (فلز قلوي).', fun:'كثافته نحو نصف كثافة الماء، فلو لم يتفاعل معه لطفا عليه.' },
4:{ disc:'اكتُشف عام 1798 على يد لويس فوكلان', name:'من معدن «البريل» الذي يستخلص منه', story:'وجد فوكلان العنصر الجديد في الزمرد والبريل. اسمه مأخوذ من البريل، وهو الحجر الكريم الذي يمنح الزمرد لونه الأخضر عند وجود أثر من الكروم.', tip:'ذرته صغيرة وطاقة تأينه عالية نسبياً بين فلزات الدورة الثانية، لذا ترتبط مركباته بالتساهم أكثر من أغلب الفلزات.' },
5:{ disc:'عُزل عام 1808 على يد غاي-لوساك وتينار وديفي', name:'من «بورق» العربية، وهي كلمة البورَق (البوراكس)', story:'عُرف البوراكس منذ القدم واستُخدم في صهر المعادن، لكن عنصر البورون نفسه لم يُعزل إلا عام 1808 بعد جهود عدة كيميائيين. ويشتهر اليوم في زجاج البايركس المقاوم للحرارة.', tip:'شبه فلز في الدورة الثانية، توزيعه <span class="ltr">1s<sup>2</sup> 2s<sup>2</sup> 2p<sup>1</sup></span>، وتعطي مركباته لهباً أخضر.' },
6:{ disc:'معروف منذ القدم', name:'', story:'عرف الإنسان الفحم والسخام وبعدها الماس منذ آلاف السنين. وفي عام 1985 اكتُشفت كرات الفوليرين، وفي عام 2004 عُزلت طبقة الغرافين من رقاقة واحدة من ذرات الكربون، وهو اكتشاف نال عليه غيم ونوفوسيلوف جائزة نوبل.', tip:'للكربون أربعة إلكترونات تكافؤ وتشكل روابط تساهمية قوية، لذلك له أشكال متعددة: الماس صلب جداً والغرافيت طري وموصل للكهرباء، رغم أن كليهما كربون صرف.', fun:'أساس الكيمياء العضوية وجميع الكائنات الحية.' },
7:{ disc:'اكتُشف عام 1772 على يد دانيال رذرفورد', name:'من اليونانية: «نيترون جينيس» أي مولّد النترات', story:'عزل رذرفورد غازاً لا يدعم الاحتراق ولا الحياة من الهواء بعد إزالة الأكسجين وثاني أكسيد الكربون منه. ويشكّل نحو 78% من الهواء الذي نتنفسه.', tip:'يوجد في الهواء على هيئة <span class="ltr">N<sub>2</sub></span> برابطة ثلاثية قوية جداً، ما يجعله خاملاً نسبياً. وتحويله إلى أمونيا في عملية هابر ينتج الأسمدة.', fun:'تُخزَّن طاقة كبيرة في رابطته الثلاثية، ولذلك تنطلق طاقة هائلة عند تكوينها من مركبات نيتروجينية متفجرة.' },
8:{ disc:'اكتُشف في سبعينيات القرن الثامن عشر على يد شيله وبريستلي، كلٌّ على حدة', name:'سمّاه لافوازييه «مولّد الحمض»، ثم تبيّن أن الاسم غير دقيق', story:'حصل بريستلي عام 1774 على الغاز بتسخين أكسيد الزئبق، وكان شيله قد حضّره قبل ذلك. ثم أثبت لافوازييه دوره في الاحتراق والتنفس، وظنّ خطأً أنه أساس كل الأحماض فاختار الاسم.', tip:'ثاني أعلى العناصر كهروسالبية بعد الفلور، لذلك يكوّن أيون <span class="ltr">O<sup>2-</sup></span> في الروابط الأيونية مثل <span class="ltr">MgO</span>، ويسحب الإلكترونات في الماء فيجعله قطبياً.' },
9:{ disc:'عُزل عام 1886 على يد هنري مواسان', name:'من معدن «الفلورسبار» (من اللاتينية fluere: يسيل)', story:'ظلّ الفلور عصياً على العزل سنوات لشدة نشاطه، وأدّى ذلك إلى إصابات وحتى وفيات بين الكيميائيين. نجح مواسان في عزله بالتحليل الكهربائي، ونال جائزة نوبل عام 1906.', tip:'أعلى العناصر كهروسالبية (3.98) وأصغر الهالوجينات حجماً، لذلك يسحب الإلكترونات بقوة ويكوّن أيون <span class="ltr">F<sup>-</sup></span>.', fun:'يوجد في معجون الأسنان على شكل فلوريد يقوّي المينا.' },
10:{ disc:'اكتُشف عام 1898 على يد رامزي وترافرز', name:'من اليونانية «نيوس» أي الجديد', story:'عثر رامزي وترافرز على النيون في الهواء المسال بعد تبخير الغازات الأخرى. وعند تمرير الكهرباء فيه يتوهّج بلون أحمر برتقالي أصبح رمزاً للافتات المضيئة.', tip:'غاز نبيل توزيعه <span class="ltr">1s<sup>2</sup> 2s<sup>2</sup> 2p<sup>6</sup></span> مكتمل، فهو خامل. واللون الصادر منه ناتج عن عودة الإلكترونات المثارة إلى مستويات أقل، أي طيف ذري.' },
11:{ disc:'عزله همفري ديفي عام 1807', name:'رمزه Na من «ناترون» (natrium)، واسمه من «صودا»', story:'نجح ديفي في فصل الصوديوم بالتحليل الكهربائي لهيدروكسيد الصوديوم المنصهر، بعد أن عجزت الطرق الكيميائية العادية. ولاحظ أنه فلز لامع طري يتفاعل بعنف مع الماء.', tip:'فلز قلوي يلوّن اللهب بالأصفر، وله إلكترون تكافؤ واحد يفقده بسهولة فيصير <span class="ltr">Na<sup>+</sup></span> بتوزيع مثل النيون، ويرتبط بالكلور رابطة أيونية مكوّناً <span class="ltr">NaCl</span>.' },
12:{ disc:'عزله همفري ديفي عام 1808', name:'من منطقة «ماغنيسيا» في اليونان', story:'عُرف ملح الإبسوم (كبريتات الماغنيسيوم) منذ القرن السابع عشر، ثم عزل ديفي الفلز نفسه بالتحليل الكهربائي. يحترق بضوء أبيض ساطع يُستخدم في الألعاب النارية.', tip:'فلز قلوي أرضي يفقد إلكترونين فيصير <span class="ltr">Mg<sup>2+</sup></span>، وهو العنصر المركزي في جزيء الكلوروفيل الذي تصنع به النباتات غذاءها.' },
13:{ disc:'عزله أورستد عام 1825، وطُوّرت طريقة إنتاجه الصناعية عام 1886', name:'من «الشبّ» (alumen) اللاتينية', story:'عُرف الشب منذ القدم، لكن فصل الفلز منه كان صعباً ومكلفاً في القرن التاسع عشر. وفي عام 1886 اخترع هول وإيرو طريقة التحليل الكهربائي، فانخفض سعره وانتشر.', tip:'فلز خفيف الكثافة (2.7 g/cm<sup>3</sup>)، يفقد ثلاثة إلكترونات فيصير <span class="ltr">Al<sup>3+</sup></span>. وتُصنع منه سبائك قوية وخفيفة للطائرات.' },
14:{ disc:'عُزل عام 1824 على يد يونس برزيليوس', name:'من «سيليكس» اللاتينية أي الصوان', story:'عرف الإنسان الرمل والزجاج منذ القدم، لكن برزيليوس هو أول من حضّر السيليكون النقي. وهو ثاني أكثر العناصر وفرة في القشرة الأرضية بعد الأكسجين.', tip:'شبه فلز يوصل الكهرباء بصورة جزئية، وهو أساس الرقائق الإلكترونية والحواسيب. وهو في الدورة الثالثة بين الفلزات (Al) واللافلزات (P)، فتتدرج الصفات الفلزية نحو اللافلزية.' },
15:{ disc:'اكتشفه هينيغ براند عام 1669', name:'من اليونانية «فوسفوروس» أي حامل الضوء', story:'بحث براند الألماني عن حجر الفلاسفة، فبخّر كميات كبيرة من البول وحصل على مادة تتوهج في الظلام. وكان أول عنصر في التاريخ يُعرف مكتشفه.', tip:'يوجد في أشكال متآصلة كالفوسفور الأبيض الشديد النشاط والأحمر الأكثر ثباتاً. وهو عنصر ضروري في الـ DNA وأسمدة النباتات.' },
16:{ disc:'معروف منذ القدم', name:'', story:'عُرف الكبريت أصفر اللون قرب البراكين والينابيع الحارة، وفي عام 1777 أثبت لافوازييه أنه عنصر وليس مركباً.', tip:'يوجد على شكل حلقات <span class="ltr">S<sub>8</sub></span> وهو لافلز، يأخذ إلكترونين فيصير <span class="ltr">S<sup>2-</sup></span>. ويُستخدم في حمض الكبريتيك أكثر المواد الصناعية إنتاجاً.' },
17:{ disc:'اكتُشف عام 1774 على يد شيله، وأثبت ديفي أنه عنصر عام 1810', name:'من اليونانية «كلوروس» أي الأخضر المصفر', story:'حضّر شيله الغاز الأخضر المصفر الخانق من حمض الهيدروكلوريك، ثم أثبت ديفي بعد سنوات أنه عنصر مستقل لا مركب أكسجين. ويُستخدم اليوم في تعقيم مياه الشرب.', tip:'هالوجين له سبعة إلكترونات تكافؤ فيكتسب إلكتروناً ويصير <span class="ltr">Cl<sup>-</sup></span>، وهو مثال على ارتفاع الكهروسالبية في المجموعة 17.' },
18:{ disc:'اكتُشف عام 1894 على يد رايلي ورامزي', name:'من اليونانية «أرغوس» أي الكسول (الخامل)', story:'لاحظ رايلي أن كثافة النيتروجين المأخوذ من الهواء أعلى قليلاً من النيتروجين المحضّر كيميائياً. فتتبّعه مع رامزي حتى عثرا على غاز جديد في الهواء.', tip:'غاز نبيل يشكّل نحو 0.93% من الهواء، ولا يكوّن مركبات عادة لأن مستوى طاقته الخارجي مكتمل بثمانية إلكترونات. ويُستخدم لحماية اللحام والمصابيح.' },
19:{ disc:'عزله همفري ديفي عام 1807', name:'من «البوتاس» (potash) أي رماد النباتات، ورمزه K من kalium', story:'عزله ديفي أولاً بالتحليل الكهربائي لهيدروكسيد البوتاسيوم المنصهر، وبعد أيام فعل الشيء نفسه مع الصوديوم. وعندما لامس الماء اشتعل بلهب بنفسجي.', tip:'يلوّن اللهب بالبنفسجي. وهو أكبر حجماً من الصوديوم وطاقة تأينه أقل، لذلك فهو أكثر نشاطاً منه، وهذا يوضح الاتجاه في المجموعة 1.', fun:'الموز غني بالبوتاسيوم، ويحتوي نظيراً مشعاً ضعيفاً منه.' },
20:{ disc:'عزله همفري ديفي عام 1808', name:'من «كالكس» اللاتينية أي الجير', story:'عُرف الجير والجص منذ العصور القديمة، لكن الكالسيوم الفلزي لم يُعزل حتى عام 1808. وهو أساس الحجر الجيري والأصداف والعظام.', tip:'يلوّن اللهب بالأحمر القرميدي، ويفقد إلكترونين ليصير <span class="ltr">Ca<sup>2+</sup></span>. ومركبه <span class="ltr">CaCO<sub>3</sub></span> هو الحجر الجيري والرخام والطباشير.' },
21:{ disc:'اكتُشف عام 1879 على يد لارس نيلسون', name:'من اسكندنافيا (سكانديا)', story:'تنبأ مندليف بوجود عنصر جديد سمّاه «إيكا-بورون» ليملأ فراغاً في جدوله. وبعد سنوات اكتشف نيلسون عنصر السكانديوم، وتبيّن أن خواصه تطابق التنبؤ.', tip:'أول فلزات السلسلة الانتقالية الأولى، توزيعه <span class="ltr">[Ar] 3d<sup>1</sup> 4s<sup>2</sup></span>.' },
22:{ disc:'اكتشفه ويليام غريغور عام 1791', name:'سمّاه كلابروث عام 1795 تيمناً بالجبابرة «التيتان» في الأساطير الإغريقية', story:'عثر غريغور على معدن جديد في رمل أسود في كورنوال البريطانية، ثم أعاد كلابروث اكتشافه بصورة مستقلة وأعطاه اسمه. يُستخدم في الطائرات والغرسات الطبية.', tip:'فلز انتقالي قوي وخفيف ومقاوم للتآكل، ويُستعمل في السبائك، وله توزيع <span class="ltr">[Ar] 3d<sup>2</sup> 4s<sup>2</sup></span>.' },
23:{ disc:'اكتشفه نيلس سيفستروم عام 1830، وسبقه ديل ريو عام 1801', name:'نسبةً إلى فاناديس، إلهة الجمال في الأساطير الإسكندنافية', story:'سمّاه ديل ريو «إريثرونيوم» ثم تراجع عن اكتشافه، وأعاد سيفستروم اكتشافه فسمّاه فاناديوم لتنوع ألوان مركباته الجميلة.', tip:'له عدة حالات تأكسد، فتعطي محاليله ألواناً مختلفة: بنفسجي وأزرق وأخضر وأصفر.' },
24:{ disc:'اكتُشف عام 1797 على يد لويس فوكلان', name:'من اليونانية «كروما» أي اللون', story:'اكتشفه فوكلان في معدن أحمر برتقالي من سيبيريا. وسُمّي كروماً لأن مركباته متعددة الألوان الزاهية، ويستخدم في طلاء المعادن اللامع.', tip:'استثناء في التوزيع الإلكتروني: <span class="ltr">[Ar] 3d<sup>5</sup> 4s<sup>1</sup></span> بدلاً من <span class="ltr">3d<sup>4</sup> 4s<sup>2</sup></span>، لأن نصف الامتلاء في المستوى d أكثر استقراراً.' },
25:{ disc:'عزله يوهان غان عام 1774', name:'من «ماغنيسيا نيغرا» أي المغنيسيا السوداء', story:'اكتشف شيله أن المعدن الأسود المعروف منذ القدم يحوي عنصراً جديداً، وعزله غان بتسخينه مع الكربون. ويقوّي الفولاذ ويجعله مقاوماً للصدمات.', tip:'له حالات تأكسد كثيرة، ومنها <span class="ltr">KMnO<sub>4</sub></span> البنفسجي، وهو مثال على الألوان في مركبات العناصر الانتقالية.' },
26:{ disc:'معروف منذ القدم', name:'رمزه Fe من اللاتينية «فيروم»', story:'بدأ عصر الحديد قبل نحو 3000 عام، حين تعلم الإنسان صهر الخام وتشكيل أدوات أقوى من البرونز. وهو يشكل معظم لبّ الأرض، ويوجد في هيموغلوبين دمنا.', tip:'يكوّن أيونين شائعين: <span class="ltr">Fe<sup>2+</sup></span> و<span class="ltr">Fe<sup>3+</sup></span>، وهذا مثال على تعدد حالات تأكسد الفلزات الانتقالية. وبإضافة كربون يصير فولاذاً.' },
27:{ disc:'اكتشفه جورج برانت نحو عام 1735', name:'من «كوبولد» الألمانية، روح شريرة في أساطير المناجم', story:'عزل برانت الفلز من خام كان عمال المناجم يظنون أنه مسحور ويضرّ بالنحاس. ومنذ القدم استُخدمت مركباته الزرقاء في تلوين الزجاج والخزف.', tip:'فلز انتقالي مغناطيسي مثل الحديد والنيكل، ويُستعمل في بطاريات الليثيوم والسبائك المقاومة للحرارة.' },
28:{ disc:'اكتشفه أكسل كرونستيدت عام 1751', name:'من «نيكل» الألمانية ومعناها الشيطان أو الخادع', story:'ظنّ عمال المناجم أن خاماً أحمر يشبه النحاس يحوي نحاساً لكنه لا يعطيه، فأطلقوا عليه اسم «نحاس الشيطان». وفي النهاية عزل منه كرونستيدت فلزاً جديداً.', tip:'فلز انتقالي مغناطيسي يقاوم التآكل، وتُصنع منه العملات المعدنية والفولاذ المقاوم للصدأ.' },
29:{ disc:'معروف منذ القدم', name:'رمزه Cu من «كوبروم» اللاتينية نسبةً إلى قبرص', story:'كان النحاس من أول الفلزات التي استخدمها الإنسان، ثم خُلط بالقصدير فنشأ البرونز، وهو بداية عصر البرونز. ويكسو تمثال الحرية طبقة خضراء من مركبات النحاس تكوّنت مع السنين.', tip:'استثناء في التوزيع الإلكتروني: <span class="ltr">[Ar] 3d<sup>10</sup> 4s<sup>1</sup></span> لأن المستوى d المكتمل أكثر استقراراً. وهو موصل ممتاز للكهرباء، ويعطي لهباً أخضر مزرقاً.' },
30:{ disc:'استُخلص في الهند قبل قرون، وعزله ماركغراف في أوروبا عام 1746', name:'', story:'استُخدم الزنك في صنع النحاس الأصفر (سبيكة مع النحاس) منذ القدم. ويحمي الحديد من الصدأ بطلائه (الجلفنة) لأنه يتأكسد قبله.', tip:'يفقد إلكترونين فيصير <span class="ltr">Zn<sup>2+</sup></span> بتوزيع <span class="ltr">3d<sup>10</sup></span> مكتمل، لذا مركباته عديمة اللون وهو يُعدّ حالة خاصة بين الفلزات الانتقالية.' },
31:{ disc:'اكتشفه لوكوك دو بوابودران عام 1875 بالمطياف', name:'من «غاليا» اسم فرنسا القديم', story:'كان مندليف قد تنبأ بهذا العنصر وسمّاه «إيكا-ألومنيوم» قبل اكتشافه، وحدد خواصه بدقة. ورصده لوكوك دو بوابودران عبر خطوط طيفية جديدة في خام الزنك.', tip:'يدعم الجدول الدوري: خواص العنصر قبل اكتشافه تطابقت مع تنبؤ مندليف بسبب موقعه في المجموعة 13.', fun:'ينصهر عند نحو 30 °C فيذوب في اليد، فهو فلز منخفض درجة الانصهار.' },
32:{ disc:'اكتشفه كليمنس فينكلر عام 1886', name:'من «جرمانيا» أي ألمانيا', story:'كان مندليف قد تنبأ به باسم «إيكا-سيليكون»، فحين اكتشفه فينكلر تطابقت صفاته مع التنبؤ بدقة. وكان من أوائل المواد في الترانزستور.', tip:'شبه فلز في المجموعة 14 تحت السيليكون، وهو أشباه الموصلات، ويوضح تدرج الصفات الفلزية في المجموعة.' },
33:{ disc:'عُرفت مركباته منذ القدم، ويُنسب عزله إلى ألبرتوس ماغنوس نحو عام 1250', name:'من «أرسنيكون» اليونانية', story:'اشتهرت مركبات الزرنيخ كسمّ قوي في التاريخ، ولكنها استخدمت أيضاً في الأدوية القديمة. وهو شبه فلز يظهر بصور مختلفة.', tip:'شبه فلز في المجموعة 15، له صفات بين الفلزات واللافلزات، ويستخدم في أشباه الموصلات.' },
34:{ disc:'اكتشفه برزيليوس وغان عام 1817', name:'من «سيلين» اليونانية أي القمر', story:'وجد برزيليوس مادة حمراء في مخلفات مصنع حمض الكبريتيك، وتبيّن أنها عنصر جديد يشبه التيلوريوم. فسمّاه سيلينيوم تيمناً بالقمر لأن التيلوريوم سُمي على اسم الأرض.', tip:'لافلز في عائلة الأكسجين والكبريت (المجموعة 16)، وتزداد خواصه الفلزية عند النزول في المجموعة. وتتغير مقاومته الكهربائية بالضوء.' },
35:{ disc:'اكتشفه أنطوان بالار عام 1826', name:'من اليونانية «بروموس» أي الرائحة الكريهة', story:'لاحظ بالار سائلاً أحمر داكناً ينفصل عن مياه البحيرات المالحة عند معالجتها بالكلور. وسُمّي كذلك لرائحته النفاذة الخانقة.', tip:'هالوجين، وهو العنصر اللافلزي الوحيد السائل في الظروف العادية، والزئبق هو الفلز الوحيد السائل.' },
36:{ disc:'اكتُشف عام 1898 على يد رامزي وترافرز', name:'من اليونانية «كريبتوس» أي المخفي', story:'وجد رامزي وترافرز الكريبتون في بقايا الهواء المسال بعد إزالة الأرغون، وسُمّي المخفي لأنه كان متخفياً في الهواء. وبين عامي 1960 و1983 عُرّف المتر بطول موجة خط طيفي برتقالي لنظير الكريبتون 86.', tip:'غاز نبيل خامل، وطيفه الخطي المحدد سمح باستخدامه معياراً للقياس.' },
37:{ disc:'اكتشفه بنزن وكيرشهوف عام 1861 بالمطياف', name:'من اللاتينية «روبيدوس» أي الأحمر الداكن', story:'درس بنزن وكيرشهوف أطياف المعادن باللهب فلاحظا خطّين أحمرين داكنين لم يسبق رؤيتهما، فاستنتجا وجود عنصر جديد وسمّياه من لون خطوطه.', tip:'فلز قلوي طاقة تأينه منخفضة جداً، وطيفه المميز مثال على استخدام الطيف الذري للتعرف على العناصر.' },
38:{ disc:'تعرّف عليه كروفورد عام 1790، وعزله ديفي عام 1808', name:'من قرية ستروشيان (Strontian) في اسكتلندا', story:'وجد المعدن في مناجم الرصاص قرب قرية ستروشيان، وظهر أنه يحوي عنصراً جديداً غير الباريوم. وتلوّن مركباته اللهب بالأحمر القرمزي في الألعاب النارية.', tip:'فلز قلوي أرضي، يفقد إلكترونين ليصير <span class="ltr">Sr<sup>2+</sup></span>، ويفيد في تمييز الأيونات من لون اللهب.' },
39:{ disc:'اكتُشف أكسيده عام 1794 على يد يوهان غادولين', name:'من قرية إيتربي (Ytterby) في السويد', story:'عُثر على معدن أسود غريب في منجم قرب قرية إيتربي، وتبيّن أنه يحوي أكسيد عنصر جديد. وسُمّيت عناصر أخرى باسم القرية نفسها: الإربيوم والتيربيوم والإتربيوم.', tip:'فلز انتقالي تدخل مركباته في المواد المتوهجة (الفوسفورية) وفي بعض أنواع الليزر.' },
40:{ disc:'اكتشفه مارتن كلابروث عام 1789', name:'من معدن «الزركون»', story:'حلّل كلابروث حجر الزركون المعروف منذ القدم وعزل منه أكسيداً جديداً. ويُستخدم الزركونيوم في المفاعلات النووية لأنه لا يمتص النيوترونات كثيراً.', tip:'فلز انتقالي شديد المقاومة للتآكل، وأكسيده يُستخدم في الزركونيا المكعبة التي تقلّد الألماس.' },
41:{ disc:'اكتشفه تشارلز هاتشيت عام 1801 باسم كولومبيوم', name:'من «نيوبي» ابنة تانتالوس في الأساطير الإغريقية', story:'وجده هاتشيت في معدن أمريكي فسمّاه كولومبيوم، ثم استُبدل الاسم لاحقاً بنيوبيوم لشدة شبهه بالتانتالوم. واستقر الاسم رسمياً عام 1949.', tip:'فلز انتقالي موصل فائق في درجات حرارة منخفضة، ويستخدم في مغانط أجهزة التصوير بالرنين.' },
42:{ disc:'عزله بيتر هيلم عام 1781 بعد تمييز شيله له عام 1778', name:'من اليونانية «موليبدوس» أي الرصاص', story:'ظنّ الناس أن خامه معدن الرصاص أو الغرافيت لأنه يترك أثراً أسود. وعندما درسه شيله اكتشف أنه يحوي عنصراً جديداً، فعزله هيلم.', tip:'فلز انتقالي ينصهر في درجة حرارة عالية جداً، ويضاف للفولاذ فيقوّيه.' },
43:{ disc:'أُنتج صناعياً عام 1937 على يد بيرييه وسيغري', name:'من اليونانية «تكنيتوس» أي الاصطناعي', story:'ترك مندليف فراغاً له في الجدول، ولم يُعثر عليه في الطبيعة بكميات تُذكر. وحصل عليه بيرييه وسيغري بقصف الموليبدنوم بمسرّع جسيمات، فكان أول عنصر مصنوع بيد الإنسان.', tip:'كل نظائره مشعة، ويُستخدم نظيره Tc-99m في التصوير الطبي.' },
44:{ disc:'اكتشفه كارل كلاوس عام 1844', name:'من «روثينيا» الاسم اللاتيني لروسيا', story:'عزل كلاوس العنصر من بقايا خام البلاتين، وسمّاه على اسم روسيا. وهو من مجموعة معادن البلاتين النفيسة.', tip:'فلز انتقالي نادر يُستخدم عاملاً حفازاً في التفاعلات الكيميائية وفي الأقراص الصلبة.' },
45:{ disc:'اكتشفه ويليام وولاستون عام 1803', name:'من اليونانية «رودون» أي الوردة', story:'عثر وولاستون على الروديوم في خام البلاتين، وسمّاه لأن مركباته تعطي محاليل بلون وردي. ومن أغلى المعادن وأندرها.', tip:'يستخدم في المحولات الحفازة للسيارات لتقليل غازات العادم السامة.' },
46:{ disc:'اكتشفه ويليام وولاستون عام 1802', name:'نسبةً إلى الكويكب بالاس (Pallas) الذي اكتُشف في العام نفسه', story:'سمّاه وولاستون على اسم الكويكب بالاس المكتشف حديثاً آنذاك. ويمتص كميات كبيرة من الهيدروجين، مما يجعله مهماً في الحفز.', tip:'فلز انتقالي يستخدم في المحولات الحفازة للسيارات، وتوزيعه الإلكتروني <span class="ltr">[Kr] 4d<sup>10</sup></span> استثناء.' },
47:{ disc:'معروف منذ القدم', name:'رمزه Ag من «أرجنتوم» اللاتينية', story:'استخدمه الإنسان القديم في العملات والحلي. وفي التصوير القديم كانت أملاح الفضة تحمل الصور على الأفلام بتفاعلها مع الضوء.', tip:'أفضل موصل للكهرباء بين الفلزات، ويكوّن الأيون <span class="ltr">Ag<sup>+</sup></span>، وتوزيعه <span class="ltr">4d<sup>10</sup> 5s<sup>1</sup></span> استثناء مثل النحاس.' },
48:{ disc:'اكتشفه فريدريش شترومايير عام 1817', name:'من «كادميا» اللاتينية أي خام الزنك', story:'لاحظ شترومايير أن عينة من كربونات الزنك تتغير لونها عند التسخين، فعزل منها فلزاً جديداً. وكان يرافق الزنك دائماً في خاماته.', tip:'فلز مجموعة 12 مثل الزنك والزئبق، وهو سام ويجب التعامل معه بحذر، ويُستخدم في بطاريات النيكل-كادميوم.' },
49:{ disc:'اكتشفه رايش وريختر عام 1863 بالمطياف', name:'من «إنديكو» أي النيلي', story:'رصد رايش وريختر خطاً طيفياً أزرق نيلياً لامعاً لم يُعرف من قبل في عينة من الزنك، فأثبتا وجود عنصر جديد.', tip:'مثال آخر على تعرف الطيف الذري على عنصر جديد من خط طيفي وحيد.' },
50:{ disc:'معروف منذ القدم', name:'رمزه Sn من «ستانوم» اللاتينية', story:'خلط القدماء القصدير بالنحاس فصنعوا البرونز، فكانت السبيكة أصلب من أي من مكوناتها. ويُستخدم اليوم في طلاء علب الحفظ وفي لحام الإلكترونيات.', tip:'مثال على السبائك: يُكوّن البرونز مع النحاس، وخواص السبيكة تختلف عن خواص الفلزات النقية المكوّنة لها.' },
51:{ disc:'عُرفت مركباتها منذ القدم', name:'رمزه Sb من «ستيبيوم» اللاتينية', story:'استخدم المصريون القدماء كبريتيد الأنتيمون (الكحل) في تجميل العيون. وهو شبه فلز يزيد صلابة الرصاص في السبائك.', tip:'شبه فلز في المجموعة 15 يقوّي السبائك ويدخل في أشباه الموصلات.' },
52:{ disc:'اكتشفه فرانتس مولر فون رايشنشتاين عام 1782', name:'من «تيلوس» اللاتينية أي الأرض', story:'وجد مولر معدناً غريباً في مناجم رومانيا، وسمّاه كلابروث لاحقاً عام 1798 تيلوريوم. وهو نادر الوجود في القشرة الأرضية.', tip:'شبه فلز في المجموعة 16 تحت السيلينيوم، ويزداد فيها الطابع الفلزي نزولاً.' },
53:{ disc:'اكتشفه برنار كورتوا عام 1811', name:'من اليونانية «أيوديس» أي البنفسجي', story:'أثناء استخلاص النترات من رماد الأعشاب البحرية، أضاف كورتوا كمية زائدة من الحمض فظهرت أبخرة بنفسجية جميلة. وتبيّن أنها عنصر جديد.', tip:'هالوجين صلب يتسامى عند التسخين فيتحول مباشرة إلى بخار بنفسجي. وهو ضروري لعمل الغدة الدرقية.' },
54:{ disc:'اكتُشف عام 1898 على يد رامزي وترافرز', name:'من اليونانية «كسينوس» أي الغريب', story:'عزل رامزي وترافرز الزينون من الهواء المسال كآخر الغازات النبيلة. وفي عام 1962 حضّر نيل بارتليت أول مركب له، فكسر فكرة أن الغازات النبيلة لا تتفاعل أبداً.', tip:'غاز نبيل لكن مستواه الخارجي الكبير يسمح بتكوين مركبات مع الفلور والأكسجين، وهي استثناء مهم في الغازات النبيلة.' }
});
